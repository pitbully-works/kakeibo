/* 行を足す。書きかけを消さないよう、いま画面にある値をそのまま保存してから足す。 */
/* 足した行の入力欄へ画面を移す。
   作り直すといちばん上に戻ってしまい、どこに入れるのか分からなくなるため。 */
function lpAddRow(key){
  if(lpKind==="insurance"){
    const ai = lpReadInsurance();
    if(ai.insurancePolicies.length >= Core.LP_MAX_ROWS){ toast(L(`${Core.LP_MAX_ROWS}件までです`, `Up to ${Core.LP_MAX_ROWS} items`)); return; }
    ai.insurancePolicies = ai.insurancePolicies.concat([{ name:"" }]);
    const i = ai.insurancePolicies.length - 1;
    if(lpSave(ai)){ render(); focusField(`lp-in-name-${i}`); }
    return;
  }
  if(lpKind==="nisa"){
    const a0 = lpReadNisa();
    if(a0[key].length >= Core.LP_MAX_ROWS){ toast(L(`${Core.LP_MAX_ROWS}件までです`, `Up to ${Core.LP_MAX_ROWS} items`)); return; }
    a0[key] = a0[key].concat([key==="lumpSums" ? {} : { funds: [] }]);
    const i = a0[key].length - 1;
    const id = key==="tsumitateSchedule" ? `lp-ts-from-${i}`
             : key==="growthSchedule"    ? `lp-gs-from-${i}`
             : `lp-lm-age-${i}`;
    if(lpSave(a0)){ render(); focusField(id); }
    return;
  }
  if(lpKind==="banks"){ lpSaveBanksQuiet(); }
  else if(lpKind==="loans"){ lpSaveLoansQuiet(); }
  else if(lpKind==="pension"){ lpSavePensionQuiet(); }
  const a = lpAssets();
  const key2 = lpKind==="banks" ? "banks" : lpKind==="loans" ? "loans" : "privatePensionPlans";
  const key3 = key2;
  if(a[key3].length >= Core.LP_MAX_ROWS){ toast(L(`${Core.LP_MAX_ROWS}件までです`, `Up to ${Core.LP_MAX_ROWS} items`)); return; }
  a[key3] = a[key3].concat([{ name:"" }]);
  const i = a[key3].length - 1;
  const id = lpKind==="banks" ? `lp-b-name-${i}` : lpKind==="loans" ? `lp-l-name-${i}` : `lp-p-name-${i}`;
  if(lpSave(a)){ render(); focusField(id); }
}
/* 「足す」「消す」の前に、書きかけを取りこぼさないための静かな保存 */
function lpSaveBanksQuiet(){ const a=lpAssets(); a.banks=a.banks.map((b,i)=>({
  name:lpVal(`lp-b-name-${i}`), balance:lpVal(`lp-b-bal-${i}`),
  monthlyDeposit:lpVal(`lp-b-mon-${i}`), interestPct:lpVal(`lp-b-int-${i}`), id:b.id })); lpSave(a); }
function lpSaveLoansQuiet(){ const a=lpAssets(); a.loans=a.loans.map((l,i)=>({
  name:lpVal(`lp-l-name-${i}`), principal:lpVal(`lp-l-pri-${i}`),
  annualRatePct:lpVal(`lp-l-rate-${i}`), monthlyPayment:lpVal(`lp-l-pay-${i}`), id:l.id })); lpSave(a); }
function lpSavePensionQuiet(){ const a=lpAssets(); a.privatePensionPlans=a.privatePensionPlans.map((p,i)=>({
  name:lpVal(`lp-p-name-${i}`), monthlyContribution:lpVal(`lp-p-mon-${i}`),
  contribFromAge:lpVal(`lp-p-cf-${i}`), contribToAge:lpVal(`lp-p-ct-${i}`),
  payoutFromAge:lpVal(`lp-p-pf-${i}`), payoutToAge:lpVal(`lp-p-pt-${i}`),
  monthlyPayout:lpVal(`lp-p-pay-${i}`), id:p.id })); lpSave(a); }

function lpDeleteRow(i, keyFromBtn){
  const idx = Number(i);
  if(lpKind==="insurance"){
    const ai = lpReadInsurance();
    if(!ai.insurancePolicies[idx]) return;
    if(typeof confirm==="function" && !confirm(L(`「${ai.insurancePolicies[idx].name||"（名前なし）"}」を消しますか？`, `Delete "${ai.insurancePolicies[idx].name||"Unnamed"}"?`))) return;
    ai.insurancePolicies = ai.insurancePolicies.filter((_,n)=>n!==idx);
    if(lpSave(ai)){ render(); toast(L("消しました ✓","Deleted ✓")); }
    return;
  }
  if(lpKind==="nisa"){
    const a0 = lpReadNisa();
    if(!a0[keyFromBtn] || !a0[keyFromBtn][idx]) return;
    if(typeof confirm==="function" && !confirm(L("この行を消しますか？","Delete this row?"))) return;
    a0[keyFromBtn] = a0[keyFromBtn].filter((_,n)=>n!==idx);
    if(lpSave(a0)){ render(); toast(L("消しました ✓","Deleted ✓")); }
    return;
  }
  const key = lpKind==="banks" ? "banks" : lpKind==="loans" ? "loans" : "privatePensionPlans";
  const a0 = lpAssets();
  const target = a0[key][idx];
  if(!target) return;
  if(typeof confirm==="function" && !confirm(L(`「${target.name||"（名前なし）"}」を消しますか？`, `Delete "${target.name||"Unnamed"}"?`))) return;
  if(lpKind==="banks") lpSaveBanksQuiet();
  else if(lpKind==="loans") lpSaveLoansQuiet();
  else lpSavePensionQuiet();
  const a = lpAssets();
  a[key] = a[key].filter((_,n)=>n!==idx);
  if(lpSave(a)){ render(); toast(L("消しました ✓","Deleted ✓")); }
}

/* すべて初期設定に戻す。
   取り返しがつかないので、二度たずねる。
   一度目は何が消えるか、二度目は本当に押したのかを確かめる。
   保存に失敗したときは、消える前の状態へそのまま戻す。 */
function resetAll(){
  if(typeof confirm!=="function") return;
  if(!confirm(L("この端末のデータをすべて消して、最初の状態に戻します。\n"
    + "設定・記録・日記・健康・予定・写真が消えます。\n"
    + "元に戻せません。\n\n先にバックアップを書き出しましたか？",
    "This erases all data on this device and starts over.\n"
    + "Settings, records, diary, health, schedule and photos will be gone.\n"
    + "This cannot be undone.\n\nHave you exported a backup first?"))) return;
  if(!confirm(L("本当に、すべて消して最初から始めますか？","Are you sure you want to erase everything and start over?"))) return;
  const before = JSON.parse(JSON.stringify(state));
  state = defaultState();
  if(!save()){
    state = before;                                 // 消える前へ完全に戻す
    render(); toast(L("戻せませんでした。データはそのままです","Could not reset. Your data is unchanged"));
    return;
  }
  view = "home";
  render();
  toast(L("最初の状態に戻しました ✓","Everything has been reset ✓"));
}

/* ---------- ライフプランへ渡す ---------- */
function lpExport(){
  /* 前に作った保存データには、まだ行のしるし（id）が無い。
     しるしが無いまま渡すと向こうは名前で照合するしかなく、
     名前が空・同名だと同じ行が増える。渡す前に付けて、この端末にも残す。 */
  if(Core.lpHasAny(state.settings.lp)) lpSave(lpAssets());
  const text = JSON.stringify(Core.buildLifePlanInputs(state.settings), null, 2);
  shareText(`lifeplan-assets-${todayISO()}.json`, text,
    L("コピーしました。ライフプランの「バックアップの読み込み」に貼りつけてください",
      "Copied. Paste it into \"Restore from backup\" in the life plan app"),
    L("ファイルに書き出しました","Exported to a file"));
}

/* ---------- イベント（委譲） ---------- */
/* バックグラウンドから戻ったとき：日をまたいでいたら画面を今日に合わせる。
   日記や設定などの入力途中の下書きを消さないよう、
   自由入力の無い画面（カレンダー・ホーム・まとめ）だけ描き直す。 */
/* 日記の日付えらびは、押すのではなく選ぶ操作なので change で受ける。 */
/* ---------- 打ったその場で保存する ----------
   「保存する」を押さずに画面を移ると、入れた内容が消えていた。
   トップに反映されない、内訳が空に戻る、という報告の元。

   画面を作り直すと入力中の欄から指が外れてしまうので、
   保存は静かに行い、合計の表示だけをその場で書き換える。
   打つたびに端末へ書くと重いので、手が止まってから少しおいて保存する。 */
function lpReadCurrent(){
  if(lpKind==="nisa")      return lpReadNisa();
  if(lpKind==="insurance") return lpReadInsurance();
  if(lpKind==="gold")      return lpReadGold();
  if(lpKind==="ideco")     return lpReadIdeco();
  const a=lpAssets();
  if(lpKind==="banks") a.banks=a.banks.map((b,i)=>({
    name:lpVal(`lp-b-name-${i}`), balance:lpVal(`lp-b-bal-${i}`),
    monthlyDeposit:lpVal(`lp-b-mon-${i}`), interestPct:lpVal(`lp-b-int-${i}`), id:b.id }));
  if(lpKind==="loans") a.loans=a.loans.map((l,i)=>({
    name:lpVal(`lp-l-name-${i}`), principal:lpVal(`lp-l-pri-${i}`),
    annualRatePct:lpVal(`lp-l-rate-${i}`), monthlyPayment:lpVal(`lp-l-pay-${i}`), id:l.id }));
  if(lpKind==="pension") a.privatePensionPlans=a.privatePensionPlans.map((p,i)=>({
    name:lpVal(`lp-p-name-${i}`), monthlyContribution:lpVal(`lp-p-mon-${i}`),
    contribFromAge:ageValueFromFields(`lp-p-cf-${i}`,`lp-p-cf-${i}-month`), contribToAge:ageValueFromFields(`lp-p-ct-${i}`,`lp-p-ct-${i}-month`),
    payoutFromAge:ageValueFromFields(`lp-p-pf-${i}`,`lp-p-pf-${i}-month`), payoutToAge:ageValueFromFields(`lp-p-pt-${i}`,`lp-p-pt-${i}-month`),
    monthlyPayout:lpVal(`lp-p-pay-${i}`), id:p.id }));
  return a;
}

/* 保存したあとの値で、合計の表示だけを書き換える（欄は触らない） */
function lpRefreshTotals(){
  const a = Core.normalizeLifePlanAssets(state.settings.lp);
  const put = (sel, text) => { const el=document.querySelector(sel); if(el) el.textContent=text; };
  [["tsumitateSchedule", a.tsumitateSchedule], ["growthSchedule", a.growthSchedule]].forEach(([key,rows])=>{
    rows.forEach((r,i)=>{
      put(`[data-live="${key}-${i}"]`, yen(r.monthlyYen));
      put(`[data-liveage="${key}-${i}"]`, ageRangeLabel(r.fromAge||0, r.toAge||0));
    });
  });
  put('[data-live="sum-insurance"]', yen(a.insurancePolicies.reduce((t,p)=>t+p.monthlyPremium,0)));
  put('[data-live="sum-gold"]',      yen(Core.lpGoldValue(a.gold)));
  put('[data-live="sum-banks"]',     yen(Core.lpBanksTotal(a.banks)));
  put('[data-live="sum-loans"]',     yen(Core.lpLoansTotal(a.loans)));
  put('[data-live="sum-pension"]',   yen(Core.lpPensionMonthly(a.privatePensionPlans)));
  const nh=document.querySelector('[data-live="nisa-head"]');
  if(nh) nh.innerHTML=nisaHeadHtml(state.settings);
}

/* せっていで、いま打った欄だけを保存する。
   すべての欄を読み直すと、まだ画面から値を取り出せていない欄
   （日付の欄など）を空で上書きしてしまい、生年月日が消えていた。
   生年月日が消えるとNISAの年齢区間が決まらず、トップが0円になる。 */
const SETTING_FIELD = {
  "f-birth":   (s,v)=>{ s.birth = Core.normalizeBirth(v); },
  "f-gname":   (s,v)=>{ s.goalName = String(v||"").slice(0,24); },
  "f-gtarget": (s,v)=>{ s.goalTarget = settingMinor(v, s); },
  "f-gcur":    (s,v)=>{ s.goalCurrent = settingMinor(v, s); },
  "f-cycle":   (s,v)=>{ s.cycleStart = Core.normalizeCycleStart(v); },
  "f-country": (s,v)=>{ s.country = Core.pickCountry(v); },
};
/* 設定の金額欄。打ち込みは主単位。小数の無い通貨では、これまでどおり整数だけ。
   字のまま桁を組むので、$300.50 も誤差なく 30050 になる。 */
function settingMinor(v, settings){ return Core.majorTextToMinorRound(v, decOf(settings)); }
function settingNum(v){ const n=parseInt(String(v).replace(/[^\d]/g,""),10); return isNaN(n)?0:n; }
/* 金額の欄でスマホに出すキーボード。小数のある通貨だけ小数点を出す。 */
/* 金額の欄でスマホに出すキーボード。5か国とも小数点を出す（円は記録時に1円へ丸める）。 */
function moneyInputMode(){ return "decimal"; }
/* 四捨五入の単位の呼び名（円 / セント …）。知らせる文言に使う。 */
function roundUnit(){ return decOf()>0 ? L("1セント","cent") : L("1円","yen"); }
/* 国は「押す」ではなく「選ぶ」操作なので change で受ける。
   選んだその場で保存し、ことば・通貨・日付の出し方を入れ替えるため画面を作り直す。
   （打つたびの自動保存に任せると、ことばが古いままになる） */
function onCountryPicked(el){
  if(!el || el.id !== "f-country") return false;
  if(!switchMoneyCountry(el.value)){ toast(T("set.saveFailed")); render(); return true; }
  render(); return true;
}
function saveSettingField(id){
  const put = SETTING_FIELD[id]; if(!put) return;
  const el = $(id); if(!el) return;
  const before = JSON.parse(JSON.stringify(state.settings));
  const s = Object.assign({}, state.settings);
  put(s, el.value);
  state.settings = Core.normalizeSettings(s);
  if(!save()) state.settings = before;        // 失敗したら元のまま
}

function autoSave(id){
  if(view==="settings"){ saveSettingField(id); return; }
  if(view==="lp"){ lpSave(lpReadCurrent()); lpRefreshTotals(); }
}
document.addEventListener("input",(e)=>{
  const el=e&&e.target; if(!el||!el.id) return;
  if(view!=="settings" && view!=="lp") return;
  /* 入力したその場で同期保存する。
     保存待ちを作らないので、入力直後にホームへ戻る・アプリを閉じる場合も値が残る。 */
  autoSave(el.id);
});

document.addEventListener("change",(e)=>{
  const el = e && e.target;
  if(el && el.id === "d-date") pickDiaryDate(el.value);
  /* 国は、ことば・通貨・日付の出し方がまとめて変わる。
     打ちかけの他の欄も取りこぼさないよう、いったん全部保存してから描き直す。 */
  if(onCountryPicked(el)) return;
});

document.addEventListener("visibilitychange",()=>{
  /* 画面を離れたら測定を中止する（カメラとライトを点けっぱなしにしない） */
  if(document.hidden){ if(pRunning || pStream || pGen!==pStopGen){ pulseFail("画面を離れたので測定を中止しました。"); } return; }
  if(!calSyncToToday()) return;
  if(view==="calendar"||view==="home"||view==="summary") render();
});
document.addEventListener("click",e=>{
  const nav=e.target.closest("#nav button"); if(nav){ showSheet(false); view=nav.dataset.nav; render(); return; }
  const go=e.target.closest("[data-go]"); if(go){ showSheet(false); view=go.dataset.go; render(); focusField(go.dataset.focus); return; }
  const pick=e.target.closest("[data-pick]");
  if(pick&&sheetState){ readSheetInputs();
    /* 候補は最小単位で持っている。打ち込み欄の字（主単位）へ戻す。 */
    sheetState.amount=Core.minorToMajorText(pick.dataset.pick, sheetDec());
    sheetState.calc=Core.calcFrom(sheetState.amount, sheetCalcDec());
    sheetState.ocrChoices=null;
    sheetState.ocrNote="金額を入れました。内容を確かめて「記録する」を押してください";
    renderSheet(); return; }
  const act=e.target.closest("[data-act]"); if(act){ handleAct(act.dataset.act,e); return; }
  const edit=e.target.closest("[data-edit]"); if(edit){ openRecord(edit.dataset.edit); return; }
  const type=e.target.closest("[data-type]"); if(type&&sheetState){ readSheetInputs(); sheetState.type=type.dataset.type; renderSheet(); return; }
  const cat=e.target.closest("[data-cat]"); if(cat&&sheetState){ readSheetInputs(); sheetState.cat=cat.dataset.cat; renderSheet(); return; }
  if(e.target.id==="scrim") showSheet(false);
});
function handleAct(a,e){
  if(a==="open-record") return openRecord(null);
  if(a==="close-sheet") return showSheet(false);
  if(a==="record-hist-del"){
    const el=e&&e.target&&e.target.closest("[data-id]"); const id=el&&el.dataset.id;
    const h=(state.recordCalcHistory||[]).find(x=>x.id===id);
    if(!h) return;
    /* 履歴の削除は、その計算で作った家計簿記録も同時に削除する。
       同じ txId を指す履歴が複数ある場合は、記録だけ消えて履歴が孤立しないよう全部消す。 */
    const beforeHistory=JSON.parse(JSON.stringify(state.recordCalcHistory||[]));
    const beforeTx=JSON.parse(JSON.stringify(state.tx||[]));
    const txId=String(h.txId||"");
    state.recordCalcHistory=beforeHistory.filter(x=>x.id!==id && (!txId || x.txId!==txId));
    if(txId) state.tx=beforeTx.filter(x=>x.id!==txId);
    if(!save()){
      state.recordCalcHistory=beforeHistory;
      state.tx=beforeTx;
      toast(L("削除できませんでした","Could not delete it"));
      renderSheet(); return;
    }
    renderSheet();
    toast(L("計算履歴と記録を削除しました","Deleted the calculation and record"));
    return;
  }
  if(a==="save-tx") return saveTx();
  if(a==="del-tx") return delTx();
  if(a==="rm-photo"){ if(sheetState){ readSheetInputs(); releaseOcrImage(sheetState); sheetState.photo=null; sheetState.crop=null; sheetState.ocrNote=""; sheetState.ocrChoices=null; renderSheet(); } return; }
  if(a==="shot-total"){ readSheetInputs(); savePending(); $("camInput").value=""; $("camInput").click(); return; }
  if(a==="read-crop"){ readSheetInputs(); return readCrop(); }
  if(a==="manual-amount"){ if(sheetState){ readSheetInputs(); sheetState.ocrChoices=null;
      sheetState.ocrNote="金額を入れてください"; renderSheet(); focusField("s-amt"); } return; }
  if(a==="calc"){
    if(!sheetState) return;
    const el=e&&e.target&&e.target.closest("[data-key]");
    if(!el) return;
    readSheetInputs();                       // 日付・メモの打ちかけを失わない
    sheetState.calc=Core.calcPress(sheetState.calc, el.dataset.key);
    sheetState.amount=Core.calcDisplay(sheetState.calc);
    renderSheet(); return;
  }
  if(a==="sci"){
    const el=e&&e.target&&e.target.closest("[data-key]"); if(!el) return;
    const before=sci();
    sciState=Core.sciPress(before, el.dataset.key);
    /* 履歴が増えたときだけ端末に残す */
    if(sciState.history.length!==before.history.length){
      state.calcHistory=sciState.history.slice();
      if(!save()){ state.calcHistory=before.history.slice(); toast(L("履歴を保存できませんでした","Could not save the history")); }
    }
    render(); return;
  }
  if(a==="sci-use"){
    const el=e&&e.target&&e.target.closest("[data-i]"); if(!el) return;
    const h=sci().history[Number(el.dataset.i)];
    if(!h) return;
    sciState=Object.assign({}, sci(), { tokens:String(h.expr).split(""), result:null, error:"" });
    render(); return;
  }
  if(a==="sci-clear"){
    const before=sci();
    sciState=Core.sciClearHistory(before);
    state.calcHistory=[];
    if(!save()){ state.calcHistory=before.history.slice(); sciState=before; toast(L("消せませんでした","Could not delete it")); }
    render(); return;
  }
  if(a==="sci-record"){
    /* 関数電卓の答え → 記録画面。ここが「計算した額をそのまま記録する」導線。 */
    const minor=Core.sciRecordAmount(sci(), decOf());
    if(minor===null){ toast(L("先に ＝ を押してください","Press = first")); return; }
    openRecord(null);
    /* 打ち込み欄は主単位の字。最小単位から戻してから入れる
       （ここを取り違えると、$12.34 が $1,234.00 になる）。 */
    sheetState.amount=Core.minorToMajorText(minor, sheetDec());
    sheetState.calc=Core.calcFrom(sheetState.amount, sheetCalcDec());
    renderSheet(); return;
  }
  if(a==="save-settings") return saveSettings();
  if(a==="reset-all") return resetAll();
  /* --- ライフプランへ渡す資産 --- */
  if(a==="lp-open"){ const el=e&&e.target&&e.target.closest("[data-kind]");
    saveSettingsQuiet();                       // 書きかけの設定を取りこぼさない
    lpKind=(el&&el.dataset.kind)||"gold"; view="lp"; render(); return; }
  if(a==="lp-tab"){ const el=e&&e.target&&e.target.closest("[data-kind]");
    lpKind=(el&&el.dataset.kind)||"gold"; render(); return; }
  if(a==="lp-back"){ view="settings"; render(); return; }
  if(a==="lp-add"){ const el=e&&e.target&&e.target.closest("[data-key]"); return lpAddRow(el&&el.dataset.key); }
  if(a==="lp-del"){ const el=e&&e.target&&e.target.closest("[data-i]"); if(el) lpDeleteRow(el.dataset.i, el.dataset.key); return; }
  if(a==="lp-save-nisa") return lpSaveNisa();
  if(a==="lp-save-ideco") return lpSaveIdeco();
  if(a==="lp-save-insurance") return lpSaveInsurance();
  if(a==="lp-add-fund"){ const el=e&&e.target&&e.target.closest("[data-key]"); if(el) lpAddFund(el.dataset.key, el.dataset.i); return; }
  if(a==="lp-del-fund"){ const el=e&&e.target&&e.target.closest("[data-key]"); if(el) lpDeleteFund(el.dataset.key, el.dataset.i, el.dataset.n); return; }
  if(a==="lp-save-gold") return lpSaveGold();
  if(a==="lp-save-banks") return lpSaveBanks();
  if(a==="lp-save-loans") return lpSaveLoans();
  if(a==="lp-save-pension") return lpSavePension();
  if(a==="lp-export") return lpExport();
  if(a==="export-backup") return exportBackup();
  if(a==="purge-photos") return purgePhotos();
  if(a==="import-backup") return pickBackup();
  if(a==="save-health") return saveHealth();
  if(a==="cal-prev"){ calShift(-1); render(); return; }
  if(a==="cal-next"){ calShift(1); render(); return; }
  if(a==="cal-day"){ const el=e&&e.target&&e.target.closest("[data-date]"); const d=el&&el.dataset.date; calSelected=(calSelected===d?null:d); render(); return; }
  if(a==="cal-edit-tx"){ const el=e&&e.target&&e.target.closest("[data-id]"); const id=el&&el.dataset.id; if(id) openRecord(id); return; }
  if(a==="cal-edit-diary"){ const el=e&&e.target&&e.target.closest("[data-date]"); diaryEditDate=el&&el.dataset.date; diaryPhotoPending=undefined; view="diary"; render(); return; }
  if(a==="cal-edit-health"){ view="health"; render(); return; }
  if(a==="save-diary") return saveDiary();
  if(a==="plan-add"){ const el=e&&e.target&&e.target.closest("[data-date]"); return addPlan(el&&el.dataset.date); }
  if(a==="plan-del"){ const el=e&&e.target&&e.target.closest("[data-id]"); return delPlan(el&&el.dataset.date, el&&el.dataset.id); }
  if(a==="plan-toggle"){ const el=e&&e.target&&e.target.closest("[data-id]"); return togglePlan(el&&el.dataset.date, el&&el.dataset.id); }
  if(a==="cal-edit-plan"){ const el=e&&e.target&&e.target.closest("[data-date]");
    diaryEditDate=(el&&el.dataset.date)||null; diaryPhotoPending=undefined; view="diary"; render();
    focusField("p-text"); return; }
  if(a==="new-diary"){ diaryEditDate=null; diaryPhotoPending=undefined; render(); return; }
  if(a==="edit-diary"){ const el=e&&e.target&&e.target.closest("[data-date]"); diaryEditDate=(el&&el.dataset.date)||null; diaryPhotoPending=undefined; render(); return; }
  if(a==="add-diary-photo"){ const el=$("diaryPhotoInput"); if(el){ el.value=""; el.click(); } return; }
  if(a==="rm-diary-photo"){ diaryPhotoPending=null; render(); return; }
  if(a==="toggle-recurring"){ if(sheetState){ readSheetInputs(); sheetState.recurring=!sheetState.recurring; renderSheet(); } return; }
  if(a==="task"){ const el=e&&e.target&&e.target.closest("[data-task]"); if(el) goTask(el.dataset.task); return; }
  if(a==="carry-recurring") return carryRecurring();
  if(a==="sum-tab"){ const el=e&&e.target&&e.target.closest("[data-tab]"); sumTab=(el&&el.dataset.tab)||"month"; render(); return; }
  if(a==="health-range"){ const el=e&&e.target&&e.target.closest("[data-range]"); healthRange=(el&&el.dataset.range)||"month"; render(); return; }
  /* --- 心拍数（β版） --- */
  if(a==="pulse-go"){ view="pulse"; pulseStage="home"; render(); return; }
  if(a==="pulse-start") return pulseStart();
  if(a==="pulse-stop"){ pulseStopAll(); pulseStage="home"; pulseErr="測定をやめました。"; render(); return; }
  if(a==="pulse-cond"){ const el=e&&e.target&&e.target.closest("[data-cond]"); pulseCond=(el&&el.dataset.cond)||"rest"; render(); return; }
  if(a==="pulse-detail"){ const el=e&&e.target&&e.target.closest("[data-id]"); const id=el&&el.dataset.id;
    pulseOpenId = (pulseOpenId===id) ? null : id; pulseEditId=null; render(); return; }
  if(a==="pulse-edit"){ const el=e&&e.target&&e.target.closest("[data-id]"); pulseEditId=el&&el.dataset.id; render(); return; }
  if(a==="pulse-edit-cancel"){ pulseEditId=null; render(); return; }
  if(a==="pulse-edit-save"){ const el=e&&e.target&&e.target.closest("[data-id]"); if(el) pulseEditSave(el.dataset.id); return; }
  if(a==="pulse-del"){ const el=e&&e.target&&e.target.closest("[data-id]"); if(el) pulseDelete(el.dataset.id); return; }
  if(a==="pulse-to-health"){ const el=e&&e.target&&e.target.closest("[data-bpm]"); if(el) pulseToHealth(el.dataset.bpm); return; }
  if(a==="pulse-csv") return pulseExportCsv();
}
/* ページを閉じる・アプリを切り替えるときも、カメラとライトを必ず止める。
   （テスト用の最小DOMには window.addEventListener が無いので存在を確かめる） */
if(typeof window!=="undefined" && typeof window.addEventListener==="function"){
  window.addEventListener("pagehide",()=>{ if(pRunning || pStream || pGen!==pStopGen) pulseStopAll(); });
}
$("camInput").addEventListener("change",e=>{ const f=e.target.files&&e.target.files[0]; if(f) onPhotoPicked(f); });
$("backupInput").addEventListener("change",e=>{ onBackupPicked(e.target.files&&e.target.files[0]); });
$("diaryPhotoInput").addEventListener("change",e=>{ const f=e.target.files&&e.target.files[0]; if(!f) return;
  const tEl=$("d-text"); const keepText=tEl?tEl.value:"";   // 入力中の本文を失わない
  const r=new FileReader();
  r.onload=()=>{ diaryPhotoPending=r.result;
    const cur=state.diary[diaryEditDate||todayISO()]||{}; cur.text=keepText;   // 本文を保って再描画
    render(); const t2=$("d-text"); if(t2) t2.value=keepText; };
  r.onerror=()=>toast(L("写真を読み込めませんでした","Could not read that photo"));
  r.readAsDataURL(f);
});

/* ---------- 起動 ---------- */
render();
/* カメラでページが再読み込みされた場合、記録の途中から戻す */
(function restorePending(){
  const p=loadPending(); if(!p) return;
  sheetState={mode:p.mode||"add", id:p.id||undefined, type:p.type||"expense", amount:p.amount||"",
              cat:p.cat||"food", date:p.date||todayISO(), memo:p.memo||"", photo:null,
              ocrNote:"カメラから戻りました。もう一度「レシートを撮る」を押してください"};
  renderSheet(); showSheet(true);
})();
/* --- SW-REGISTRATION-START ---
   iPhone の Safari は sw.js 自体をキャッシュすることがあり、
   放っておくと古い画面・古い core.js がいつまでも残る。
     ・updateViaCache:"none" で sw.js を必ず取り直す
     ・登録直後に update() で更新確認を明示する
     ・新しい Service Worker に切り替わったら画面を1回だけ読み直す
     ・再読み込み済みの印を必ず持ち、繰り返しを防ぐ
     ・初めて開いた人（もともと controller が無い人）は読み直さない。
       初回登録でも controllerchange は発火するため、そのままだと
       余計なリロードが1回入ってしまう。                      */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", async () => {
    try {
      // 登録する前に「すでに Service Worker に制御されていたか」を控えておく
      const hadController = !!navigator.serviceWorker.controller;

      const registration = await navigator.serviceWorker.register("./sw.js", {
        updateViaCache: "none"
      });

      await registration.update();

      let refreshing = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (!hadController) return;  // ← 初回登録。更新ではないので読み直さない
        if (refreshing) return;      // ← 無限に読み直さないための印
        refreshing = true;
        window.location.reload();
      });
    } catch (error) {
      console.error("Service Worker registration failed:", error);
    }
  });
}
/* --- SW-REGISTRATION-END --- */

/* テスト用フック（本番挙動には影響しない） */
window.__kakeibo={ get state(){return state;}, Core, compute, save, render, load:()=>{state=load();}, setView:v=>{view=v;render();}, setTab:t=>{sumTab=t;render();} };
