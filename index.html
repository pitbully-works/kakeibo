<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="かけいぼ">
<meta name="theme-color" content="#3f826a">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="./favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png?v=2">
<link rel="icon" href="./favicon.ico?v=2" sizes="any">
<title>かけいぼ ― 夢に近づく家計簿</title>
<style>
  :root{
    --bg:#f4f7f5; --card:#ffffff; --ink:#1e2a28; --sub:#647476; --line:#e7ecee; --line2:#eef2f0;
    --green:#6fa88a; --green-d:#3f826a; --green-dd:#356e59; --green-l:#e6f1eb;
    --sage:#8fbf7f; --gold:#d9a54f; --gold-d:#b4842f; --gold-l:#f8efd9;
    --blue:#4fa8d8; --blue-l:#e4f1f9; --amber:#e0972b; --amber-l:#fbeed4;
    --terra:#c2694f; --terra-l:#f6e5df; --pink:#e2739a; --pink-l:#fbe8f0;
    --shadow:0 1px 3px rgba(20,40,38,.05),0 10px 26px rgba(20,40,38,.07);
    --radius:16px; --nav-h:64px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
    color:var(--ink);background:var(--bg);line-height:1.7;font-size:16px;-webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none}
  .mono{font-family:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,"Roboto Mono",monospace;letter-spacing:-.02em}
  button{font-family:inherit;cursor:pointer;border:0;background:none}
  input,select,textarea{font-family:inherit;font-size:16px}

  #app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;
    padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 8px)}
  /* 上に52pxの帯を空けているのは、右上のせっていボタン(.gearbtn)と
     画面の中身が重ならないようにするため。 */
  .screen{padding:52px 16px 8px;animation:fadein .28s cubic-bezier(.2,.7,.3,1)}
  @keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* top greeting */
  .greet{padding:2px 4px 2px}
  .greet .g{font-size:12.5px;color:var(--sub);font-weight:700}
  .greet .date{font-size:27px;font-weight:800;line-height:1.25;letter-spacing:-.01em;margin-top:1px}
  .greet .date .wd{font-size:17px;margin-left:4px;color:var(--sub)}
  .greet .d{font-size:12px;color:var(--sub);margin-top:1px}

  /* hero */
  .hero{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 18px 18px;text-align:center;box-shadow:var(--shadow);margin-top:8px}
  .hero .l{font-size:13px;color:var(--sub)}
  .hero .n{font-size:44px;font-weight:800;color:var(--green-d);line-height:1.12;margin:4px 0;word-break:keep-all}
  .hero .n.amber{color:var(--amber)}
  .hero .n.over{color:var(--terra)}
  .hero .u{font-size:12.5px;color:var(--sub);min-height:18px}
  .hero .ok{display:inline-block;margin-top:8px;font-size:12px;border-radius:999px;padding:5px 14px;font-weight:800}
  .hero .ok.good{background:var(--green-l);color:var(--green-d)}
  .hero .ok.warn{background:var(--amber-l);color:var(--amber)}
  .hero .ok.over{background:var(--terra-l);color:var(--terra)}
  .heromini{display:flex;gap:8px;padding:10px 14px 0;justify-content:center;flex-wrap:wrap}
  .heromini .m{font-size:11px;color:var(--sub);background:#f6f8f7;border-radius:9px;padding:5px 9px}
  .heromini .m b{color:var(--ink);font-weight:800}

  /* dream strip */
  .dreamlbl{text-align:center;font-size:10px;color:#9aa6a3;margin:16px 0 6px;letter-spacing:.05em}
  .dreamlbl i{display:block;font-style:normal;font-size:9px;margin-top:3px;letter-spacing:0}
  /* タイルは8枚。1行に詰めると指より細くなって文字が潰れ、
     横スクロールにすると隠れた分に気づけない。4枚ずつ2段にして全部見せる。 */
  .dreamstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .ds{min-width:0;border-radius:14px;padding:11px 6px 12px;text-align:center;background:var(--card);border:1px solid var(--line);
    transition:transform .12s cubic-bezier(.2,.7,.3,1)}
  .ds:active{transform:scale(.97)}
  .ds .tapin{font-size:9px;color:#a7b2af;margin-top:5px}
  .ds .di{font-size:18px}
  .ds .dk{font-size:10.5px;color:var(--sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ds .dv{font-size:13px;font-weight:800;white-space:nowrap;margin-top:2px;overflow:hidden;text-overflow:ellipsis}
  /* 目標は「貯める先」、ほかは「毎月の固定額」で種類が違う。ひと目で分かるよう色を変える。 */
  .ds.goal{background:var(--gold-l,#fdf6e6);border-color:var(--gold,#e7c06f)}
  .ds.goal .dk{color:var(--gold-d)}
  .ds.goal .dv{color:var(--gold-d)}
  .ds.goal .tapin{color:var(--gold-d)}
  .ds.gold .dv{color:var(--gold-d)}.ds.blue .dv{color:#2f7fad}.ds.green .dv{color:var(--green-d)}
  .ds .track{height:5px;background:#ecefed;border-radius:3px;overflow:hidden;margin-top:7px}
  .ds .track>i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#e7c06f,var(--gold));transition:width .5s cubic-bezier(.2,.7,.3,1)}

  /* big record button */
  .recordbtn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;margin-top:18px;
    background:var(--green-d);color:#fff;border-radius:18px;padding:17px;font-size:16.5px;font-weight:800;
    box-shadow:0 8px 18px rgba(63,130,106,.32);transition:transform .12s cubic-bezier(.2,.7,.3,1)}
  .recordbtn:active{transform:scale(.975)}
  .subrow{display:flex;justify-content:center;gap:26px;margin-top:14px}
  .subrow button{font-size:12.5px;color:var(--green-d);font-weight:700;display:flex;align-items:center;gap:5px}

  /* section titles */
  .stitle{font-size:13px;font-weight:800;color:var(--sub);margin:20px 4px 8px}

  /* records list */
  .daygroup{margin-bottom:14px}
  .dayhd{font-size:11.5px;color:var(--sub);font-weight:700;padding:0 4px 6px;display:flex;justify-content:space-between}
  .txcard{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .tx{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line2)}
  .tx:last-child{border-bottom:0}
  .tx .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex:0 0 auto;background:#f4f7f5}
  .tx .mid{flex:1;min-width:0}
  .tx .t1{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tx .t2{font-size:11px;color:var(--sub)}
  .tx .amt{font-size:15px;font-weight:800;white-space:nowrap}
  .tx .amt.exp{color:var(--ink)}
  .tx .amt.inc{color:var(--green-d)}

  .empty{text-align:center;color:var(--sub);font-size:13.5px;padding:34px 16px;background:var(--card);border:1px dashed var(--line);border-radius:16px}
  .empty .e{font-size:30px;display:block;margin-bottom:8px}

  /* summary */
  /* 横1列に4枚並べると、金額が長い月に右端がはみ出して切れる。
     枚数に関係なく収まるよう、2列のグリッドで折り返す。 */
  .sumcards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .sc{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px 12px;text-align:center}
  .sc .l{font-size:10.5px;color:var(--sub)}
  .sc .v{font-size:18px;font-weight:800;margin-top:2px;overflow-wrap:anywhere}
  /* 3枚のときは、最後の1枚を横いっぱいに（2枚＋1枚で座りをよくする） */
  .sumcards.three .sc:last-child{grid-column:1 / -1}
  .sc .v.inc{color:var(--green-d)}.sc .v.exp{color:var(--terra)}.sc .v.net{color:var(--gold-d)}
  .barlist{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin-top:12px}
  .brow{display:flex;align-items:center;gap:9px;margin:9px 0;font-size:12px}
  .brow .bt{width:64px;flex:0 0 auto;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brow .track{flex:1;height:10px;background:#eef1ef;border-radius:6px;overflow:hidden}
  .brow .fill{display:block;height:100%;border-radius:6px}
  .brow .bv{width:58px;text-align:right;flex:0 0 auto;font-weight:800}
  .segbtns{display:flex;background:#eaeeec;border-radius:12px;padding:3px;margin:4px 0 2px}
  .segbtns button{flex:1;padding:8px;border-radius:9px;font-size:13px;font-weight:800;color:var(--sub)}
  .segbtns button.on{background:#fff;color:var(--green-d);box-shadow:0 1px 3px rgba(0,0,0,.06)}

  /* settings */
  .field{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .field label{font-size:12px;color:var(--sub);font-weight:700;display:block;margin-bottom:4px}
  .field .row{display:flex;align-items:center;gap:8px}
  .field .yen{font-size:16px;color:var(--sub);font-weight:800}
  .field input,.field select{width:100%;border:0;border-bottom:2px solid var(--line);padding:6px 2px;background:transparent;font-weight:700;color:var(--ink);outline:none}
  .field input:focus,.field select:focus{border-color:var(--green)}
  .field input.mono{font-size:20px}
  .fhelp{font-size:11px;color:var(--sub);margin-top:5px}
  .savebar{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding-top:8px}
  .btn-primary{width:100%;background:var(--green-d);color:#fff;border-radius:15px;padding:15px;font-size:15.5px;font-weight:800;box-shadow:0 6px 14px rgba(63,130,106,.28)}
  /* 確定ボタン（＋予定を入れる／保存する／この内容で記録する など）。
     以前は見た目の指定が無く、ただの小さな文字リンクに見えていた。
     ホームの「記録する」と同じ、押せると一目で分かる大きなボタンに揃える。 */
  .btn-main{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    background:var(--green-d);color:#fff;border-radius:15px;padding:16px 14px;
    font-size:16px;font-weight:800;line-height:1.35;text-align:center;
    box-shadow:0 6px 14px rgba(63,130,106,.28);
    transition:transform .12s cubic-bezier(.2,.7,.3,1)}
  .btn-main:active{transform:scale(.975)}
  .btn-ghost{width:100%;background:#fff;color:var(--green-d);border:1.5px solid #bfe0d3;border-radius:15px;padding:13px;font-size:14px;font-weight:800;margin-top:8px}
  .btn-quiet{width:100%;color:var(--sub);font-size:12.5px;padding:10px;font-weight:700;margin-top:2px}

  /* 日記の日付えらび。カレンダーへ行かなくても、この場で日付を変えられる。 */
  .dpick{display:flex;align-items:center;gap:8px;margin:0 0 10px}
  .dpick label{font-size:12px;color:var(--sub);font-weight:700;flex:none}
  .dpick input{flex:1;min-width:0;font:inherit;font-size:14px;font-weight:700;color:var(--ink);
    padding:10px;border:1px solid var(--line2);border-radius:11px;background:#fff}
  .dpick .today{flex:none;width:auto;margin:0;padding:10px 13px;font-size:12.5px;font-weight:800;
    color:var(--green-d);background:var(--green-l);border:1px solid #cfe4d9;border-radius:11px}

  /* 写真を追加。文字だけだと押せる場所に見えないので、
     枠と背景をつけて「ここを押す」と分かる形にする。 */
  .photobtn{width:100%;margin-top:10px;padding:15px 12px;border-radius:14px;
    border:2px dashed #bfd8cb;background:var(--green-l);color:var(--green-dd);
    font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px}
  .photobtn .pi{font-size:19px;line-height:1}
  .photobtn small{display:block;font-size:11px;font-weight:700;color:var(--sub);margin-top:3px}
  .photobtn:active{transform:scale(.985);background:#dcebe3}

  /* bottom nav */
  /* 下のタブ。iOSでは、半透明＋ぼかし（backdrop-filter）の固定要素は
     スクロール中に描き直しが追いつかず、画面の途中に取り残されて見えることがある。
     そのため、ぼかしをやめて色を透かさず、独立した層に固定して常にいちばん上へ置く。 */
  .nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));
    padding-bottom:env(safe-area-inset-bottom,0px);background:var(--card);
    border-top:1px solid var(--line);display:flex;
    transform:translateZ(0);-webkit-backface-visibility:hidden;backface-visibility:hidden;will-change:transform;
    z-index:100}
  /* いま見ている画面が、ひと目で分かるようにする。
     絵文字は色を変えられないので、丸い色つきの台を敷いて、文字を濃く太くし、
     絵文字を少しだけ大きくする。3つ重ねているのは、色の見分けがつきにくい人にも
     「大きさ」と「太さ」で伝わるようにするため。 */
  .nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    color:var(--sub);font-size:9.5px;font-weight:700;letter-spacing:-.02em;padding:0 1px;
    margin:5px 2px;border-radius:13px;transition:background .18s,color .18s}
  .nav button .ni{font-size:19px;line-height:1;transition:transform .18s}
  .nav button.on{color:var(--green-dd);font-weight:800;background:var(--green-l);
    box-shadow:inset 0 0 0 1px #d5e7dd}
  .nav button.on .ni{transform:scale(1.14)}
  .rgbtn{flex:1;padding:7px 0;border:1px solid var(--line2);border-radius:9px;background:#fff;color:var(--sub);font-weight:700;font-size:12.5px}
  .rgbtn.on{background:var(--green-d);color:#fff;border-color:var(--green-d)}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
  .cal-title{font-weight:800;font-size:16px}
  .cal-nav{width:40px;height:36px;border:1px solid var(--line2);border-radius:9px;background:#fff;font-size:20px;color:var(--ink)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .cal-dowrow{margin-bottom:4px}
  .cal-dow{text-align:center;font-size:11px;font-weight:700;padding:2px 0}
  .cal-cell{aspect-ratio:1;border-radius:8px;background:#fff;border:1px solid var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:4px;gap:2px}
  .cal-cell.empty{background:transparent;border:none}
  .cal-cell.today{border-color:var(--green-d);border-width:2px}
  .cal-cell.sel{background:var(--green-d)}
  .cal-cell.sel .cal-num{color:#fff}
  .cal-num{font-size:13px;font-weight:700}
  .cal-dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:90%}
  .cd{display:inline-block;width:5px;height:5px;border-radius:50%}
  .cal-legend{display:flex;gap:12px;justify-content:center;font-size:11px;color:var(--sub);margin:10px 0 4px}
  .cal-legend span{display:inline-flex;align-items:center;gap:3px}

  /* sheet (record / edit) */
  .scrim{position:fixed;inset:0;background:rgba(15,25,23,.4);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
  .scrim.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));
    max-width:520px;margin:0 auto;background:var(--bg);
    border-radius:24px 24px 0 0;z-index:51;transform:translateY(110%);transition:transform .3s cubic-bezier(.2,.8,.25,1);
    max-height:calc(100vh - var(--nav-h) - env(safe-area-inset-bottom,0px) - 24px);
    max-height:calc(100dvh - var(--nav-h) - env(safe-area-inset-bottom,0px) - 24px);
    overflow-y:auto;padding:8px 16px 20px}
  .sheet.show{transform:translateY(0)}
  /* シートの見出し。左に余白、右に閉じる */
  .sheethd{position:relative;display:flex;align-items:center;justify-content:center;margin:2px 0 12px}
  .sheethd h3{font-size:16px;font-weight:800;margin:0}
  .sheethd .close{position:absolute;right:-4px;top:50%;transform:translateY(-50%);
    width:34px;height:34px;border-radius:999px;background:#fff;border:1px solid var(--line);
    color:var(--sub);font-size:16px;font-weight:800;display:grid;place-items:center}
  .grip{width:40px;height:4px;background:#d3dbd8;border-radius:2px;margin:8px auto 6px}
  .sheet h3{font-size:16px;font-weight:800;text-align:center;margin:2px 0 12px}
  .typetog{display:flex;background:#eaeeec;border-radius:12px;padding:3px;margin-bottom:14px}
  .typetog button{flex:1;padding:9px;border-radius:9px;font-size:13.5px;font-weight:800;color:var(--sub)}
  .typetog button.on.exp{background:#fff;color:var(--terra)}
  .typetog button.on.inc{background:#fff;color:var(--green-d)}
  .amtbox{text-align:center;padding:6px 0 12px}
  .amtbox .lab{font-size:11px;color:var(--sub)}
  .amtbox .amtinput{border:0;text-align:center;font-size:44px;font-weight:800;color:var(--ink);width:100%;outline:none;background:transparent}
  .amtbox .amtinput::placeholder{color:#c8d2cf}
  .catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 12px}
  .catbtn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 4px;text-align:center;font-size:11px;color:var(--sub);font-weight:700}
  .catbtn .ce{font-size:19px;display:block}
  .catbtn.on{background:var(--green-l);border-color:#bfe0d3;color:var(--green-d)}
  .row2{display:flex;gap:10px;margin-bottom:12px}
  .row2 .field{flex:1;margin-bottom:0}
  .photobtn{display:block;width:100%;border:1.5px dashed #c3d3ce;border-radius:14px;padding:12px;color:var(--green-d);font-weight:800;font-size:13.5px;background:#fff;margin-bottom:8px;text-align:center}
  .photobtn.main{border-style:solid;border-color:var(--green);background:var(--green-l)}
  .photobtn.big{padding:16px 12px;font-size:15px;margin-bottom:14px}
  .photobtn .sm{display:block;font-size:10.5px;font-weight:700;color:var(--sub);margin-top:2px}
  .shothint{font-size:11px;color:var(--sub);text-align:center;margin:0 0 12px;line-height:1.6}
  /* 読み取り候補 */
  .choices{margin:2px 0 12px}
  .choices .cl{font-size:11px;color:var(--sub);text-align:center;margin-bottom:7px}
  .choice{display:block;width:100%;background:#fff;border:1.5px solid #bfe0d3;border-radius:14px;
    padding:14px;font-size:19px;font-weight:800;color:var(--green-d);margin-bottom:8px}
  .choice:active{transform:scale(.985)}
  .choice.manual{font-size:13.5px;font-weight:700;color:var(--sub);border-style:dashed;border-color:var(--line);padding:12px}
  /* 切り取り枠 */
  .cropwrap{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);
    background:#11201c;margin-bottom:8px;touch-action:none;user-select:none;-webkit-user-select:none}
  .cropwrap img{width:100%;display:block;max-height:44vh;object-fit:contain;pointer-events:none}
  .cropbox{position:absolute;border:2.5px solid #fff;border-radius:5px;
    box-shadow:0 0 0 9999px rgba(10,20,18,.55);cursor:move}
  .cropbox .h{position:absolute;width:34px;height:34px;background:#fff;border-radius:10px;
    border:1px solid rgba(0,0,0,.12);box-shadow:0 2px 6px rgba(0,0,0,.25)}
  .cropbox .h.tl{left:-17px;top:-17px}
  .cropbox .h.br{right:-17px;bottom:-17px}
  .cropbox .h::after{content:"";position:absolute;inset:11px;border-radius:3px;background:#9fb0ab}
  .photoprev{position:relative;margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
  .photoprev img{width:100%;display:block;max-height:180px;object-fit:cover}
  .photoprev .rm{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;width:28px;height:28px;font-size:15px}
  .ocrnote{font-size:11.5px;color:var(--sub);text-align:center;margin:-4px 0 10px}
  .delbtn{width:100%;color:var(--terra);font-size:13px;font-weight:700;padding:12px;margin-top:2px}
  /* 記録ボタンはシートの下に貼り付けて、どこまでスクロールしても押せるように */
  .sheetsave{position:sticky;bottom:0;z-index:3;padding:12px 0 6px;margin-top:10px;background:var(--bg);
    box-shadow:0 -10px 14px -6px rgba(244,247,245,.95)}

  .toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px);transform:translateX(-50%) translateY(20px);
    background:var(--green-dd);color:#fff;font-size:13.5px;font-weight:700;padding:11px 20px;border-radius:999px;
    z-index:120;opacity:0;transition:all .3s cubic-bezier(.2,.7,.3,1);box-shadow:0 8px 20px rgba(20,40,38,.25);white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast .ck{display:inline-block;margin-right:6px}

  /* summary: 内わけ行・タグ・計算式メモ */
  .krow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;padding:5px 0;color:var(--ink)}
  .krow span{color:var(--sub)}
  .krow b{font-weight:800;white-space:nowrap}
  .krow.sub{padding:0 0 4px;font-size:11px}
  .tag{display:inline-block;margin-left:6px;font-size:9.5px;font-weight:800;border-radius:999px;padding:1px 7px;vertical-align:1px}
  .tag.pl{background:#eef2f0;color:var(--sub)}
  .tag.act{background:var(--green-l);color:var(--green-d)}
  .calcnote{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-top:10px;
    font-size:11.5px;color:var(--sub);line-height:1.75}
  .calcnote b{color:var(--ink);font-weight:800}
  .catlbl{grid-column:1/-1;font-size:10.5px;color:var(--sub);font-weight:800;margin:2px 2px -2px}

  /* 毎月固定のスイッチ */
  .fixtog{display:inline-flex;align-items:center;gap:6px;margin-top:2px;padding:6px 12px;border-radius:999px;
    border:1px solid var(--line2);background:#fff;color:var(--sub);font-size:12px;font-weight:800}
  .fixtog .sw{display:inline-block;width:26px;height:15px;border-radius:999px;background:#dfe5e2;position:relative;transition:background .15s}
  .fixtog .sw i{position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:#fff;transition:left .15s}
  .fixtog.on{border-color:var(--green-d);background:var(--green-l);color:var(--green-d)}
  .fixtog.on .sw{background:var(--green-d)}
  .fixtog.on .sw i{left:13px}
  .fixhint{font-size:10.5px;color:var(--sub);margin-top:4px}
  .tag.fx{background:var(--green-l);color:var(--green-d)}
  /* 今日やることカード */
  .todos{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 13px;margin-top:12px}
  .todos .hd{font-size:11.5px;color:var(--sub);font-weight:800;margin-bottom:6px}
  .todo{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 2px;border-top:1px solid var(--line);background:none}
  .todo.first{border-top:none;padding-top:2px}
  .todo .ti{flex:0 0 auto;font-size:19px;line-height:1.2}
  .todo .tm{flex:1;min-width:0}
  .todo .t1{display:block;font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.4}
  .todo .t2{display:block;font-size:10.5px;color:var(--sub);margin-top:1px}
  .todo .tg{flex:0 0 auto;color:#c3ccc8;font-size:17px;font-weight:800}
  /* 分析タブ */
  .seg{display:flex;gap:6px;margin:6px 0 2px}
  .ins{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:8px 0;border-top:1px solid var(--line);line-height:1.5}
  .ins.first{border-top:none;padding-top:2px}
  .ins .ii{flex:0 0 auto;font-size:14px;line-height:1.35}
  .ins.warn{color:#a8543c}
  .ins.good{color:#3f7a52}
  .crow{margin:11px 0}
  .crow .chd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px}
  .crow .cn{color:var(--ink);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .crow .cv{flex:0 0 auto;font-weight:800}
  .crow .track{display:block;height:8px;background:#eef1ef;border-radius:6px;overflow:hidden;margin:4px 0 3px}
  .crow .fill{display:block;height:100%;border-radius:6px}
  .crow .csub{font-size:10.5px;color:var(--sub)}
  .dif{display:inline-block;margin-left:6px;font-size:10px;font-weight:800;border-radius:999px;padding:1px 6px}
  .dif.up{background:#fbeae4;color:#b35c42}
  .dif.dn{background:#e8f2ea;color:#3f7a52}
  .dif.eq{background:#eef1ef;color:var(--sub)}
  /* 資産形成 総合ライフプランへの入口（ホームのいちばん下）
     色はすべて既存の変数（--card / --line / --sub / --green-d）だけで作る。
     テーマの色を差し替えれば、このカードもそのまま追従する。 */
  .lpcard{display:flex;align-items:center;gap:12px;width:100%;min-height:66px;margin-top:16px;
    text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);
    transition:transform .12s cubic-bezier(.2,.7,.3,1)}
  .lpcard:active{transform:scale(.985)}
  .lpcard .lpi{flex:none;font-size:22px;line-height:1}
  .lpcard .lpt{flex:1;min-width:0}
  .lpcard .lpt b{display:block;font-size:14.5px;font-weight:800;line-height:1.45}
  .lpcard .lpt i{display:block;font-style:normal;font-size:11.5px;color:var(--sub);margin-top:1px}
  .lpcard .lpar{flex:none;font-size:18px;font-weight:800;color:var(--sub)}

  /* アプリ情報（About）。せっていのいちばん下に置く小さなカード。 */
  .about{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 16px 14px;text-align:center;box-shadow:var(--shadow)}
  .about .an{font-size:14.5px;font-weight:800}
  .about .av{font-size:12px;color:var(--sub);margin-top:2px}
  .about .aline{border:0;border-top:1px solid var(--line2);margin:12px 0 10px}
  .about .ac{font-size:11px;line-height:1.9;color:var(--sub)}
  /* 連絡先は指で押しやすいよう、1行あたり40px以上の高さを取る */
  .about .alink{display:inline-flex;align-items:center;justify-content:center;min-height:40px;
    padding:2px 12px;font-size:11.5px;font-weight:700;color:var(--green-d);text-decoration:none}
  .about .alink:active{opacity:.6}
  /* 金額の電卓（iPhoneのキーボードは出さず、これだけで打つ） */
  .amtbox .calcexpr{min-height:16px;text-align:center;font-size:12.5px;font-weight:700;color:var(--sub);letter-spacing:.02em}
  .amtbox .calcerr{text-align:center;font-size:11.5px;font-weight:800;color:var(--terra);min-height:14px}
  .calcpad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
  .calcpad button{min-height:52px;border-radius:12px;background:var(--card);border:1px solid var(--line);
    font-size:19px;font-weight:800;color:var(--ink);transition:transform .1s cubic-bezier(.2,.7,.3,1)}
  .calcpad button:active{transform:scale(.95)}
  .calcpad .fn{background:#eef1ef;color:var(--sub);font-size:16px}
  .calcpad .op{background:var(--green-l);color:var(--green-dd)}
  .calcpad .op.on{background:var(--green-d);color:#fff}
  .calcpad .eq{grid-row:span 2;background:var(--green-d);color:#fff}
  .calcpad .zero{font-size:17px}
  .rechist{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  .rechistrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
  .rechistexpr{font-size:13px;font-weight:800;color:var(--ink);overflow-wrap:anywhere}
  .rechistacts{display:flex;gap:6px}.rechistacts button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 9px;font-size:11px;font-weight:800;color:var(--sub)}

  /* 関数電卓 */
  .scidisp{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 14px 10px;box-shadow:var(--shadow);margin-top:6px}
  .sciunit{position:absolute;left:12px;top:10px;font-size:11px;font-weight:800;color:var(--green-d);
    border:1px solid var(--line2);border-radius:8px;padding:4px 10px;min-height:28px}
  .sciexpr{text-align:right;font-size:14px;font-weight:700;color:var(--sub);min-height:20px;word-break:break-all;line-height:1.5}
  .scians{text-align:right;font-size:30px;font-weight:800;color:var(--ink);min-height:36px;word-break:break-all;line-height:1.2}
  .scierr{text-align:right;font-size:11.5px;font-weight:800;color:var(--terra);min-height:14px}
  .scifn{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
  .scifn button{min-height:44px;border-radius:10px;background:var(--green-l);border:1px solid var(--line);
    font-size:13px;font-weight:800;color:var(--green-dd)}
  .scipad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
  .scipad button{min-height:52px;border-radius:12px;background:var(--card);border:1px solid var(--line);
    font-size:19px;font-weight:800;color:var(--ink)}
  .scifn button:active,.scipad button:active,.scieq:active{transform:scale(.95)}
  .scipad .fn{background:#eef1ef;color:var(--sub);font-size:16px}
  .scipad .fn.ac{color:var(--terra)}
  .scipad .op{background:var(--green-l);color:var(--green-dd)}
  /* ＝ は一番よく押すので、いちばん大きく目立たせる */
  .scieq{margin-top:10px;min-height:66px;font-size:30px;letter-spacing:.1em;
    box-shadow:0 8px 18px rgba(63,130,106,.32)}
  .sciuse{margin-top:10px;background:var(--gold);box-shadow:0 6px 14px rgba(217,165,79,.32)}
  .shrow{display:flex;align-items:baseline;gap:10px;width:100%;padding:9px 0;border-bottom:1px solid var(--line2);text-align:left}
  .shrow:last-of-type{border-bottom:0}
  .shrow .se{flex:1;min-width:0;font-size:12px;color:var(--sub);word-break:break-all}
  .shrow .sv{flex:none;font-size:14px;font-weight:800;color:var(--ink)}

  /* 体重・血圧の推移グラフ（目もり付き） */
  .chtitle{font-size:12px;font-weight:800;color:var(--sub);margin-bottom:2px}
  .chgrow{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:5px;
    margin-top:6px;font-size:11.5px;color:var(--sub);line-height:1.6}
  .chgrow b{color:var(--ink);font-weight:800;font-size:13px}
  .chgrow .ar{color:#a7b2af;font-weight:800}
  .chgbadge{font-size:12.5px;font-weight:800;border-radius:999px;padding:3px 11px;
    background:var(--line2);color:var(--ink);white-space:nowrap}
  .chgbadge.up{background:var(--terra-l);color:var(--terra)}
  .chgbadge.dn{background:var(--blue-l);color:#2f7fad}

  /* ホームの「今月の予定」 */
  .mpday{font-size:11.5px;font-weight:800;color:var(--sub);margin:10px 0 2px}
  .mpday:first-child{margin-top:0}
  .mpday.today{color:var(--green-d)}
  .mplink{text-align:left;font:inherit;color:inherit;padding:0;background:none;border:0}
  .mpmore{display:block;width:100%;text-align:center;font-size:12px;font-weight:700;color:var(--green-d);padding:10px 0 2px}

  /* 予定（スケジュール） */
  .prow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line2)}
  .prow:last-of-type{border-bottom:0}
  .prow.done .ptext{text-decoration:line-through;color:var(--sub)}
  .pchk{flex:none;font-size:19px;line-height:1;padding:6px 2px;color:var(--green-d);min-width:32px;text-align:left}
  .ptime{flex:none;min-width:44px;font-size:12px;font-weight:800;color:var(--sub)}
  .ptext{flex:1;min-width:0;font-size:13.5px;line-height:1.5;word-break:break-word}
  .pdel{flex:none;padding:6px 4px;font-size:13px;color:var(--sub);min-width:30px}
  .prowadd{display:flex;gap:8px;align-items:center}
  .prowadd input[type="time"]{flex:0 0 96px;border:1px solid var(--line2);border-radius:10px;padding:9px 8px;background:var(--card);color:var(--ink);font-weight:700}
  .prowadd input#p-text{flex:1;min-width:0;border:1px solid var(--line2);border-radius:10px;padding:9px 10px;background:var(--card);color:var(--ink)}
  /* 右上のせってい。
     下のタブに「心拍」を入れるため、せっていはここへ移した。
     画面の中身と重ならないよう、.screen の上に帯ぶんの余白を取ってある。 */
  .gearbtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);
    right:max(12px, calc(50% - 248px));width:40px;height:40px;border-radius:50%;
    background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);
    font-size:18px;line-height:1;display:grid;place-items:center;color:var(--ink);
    transform:translateZ(0);z-index:90}
  .gearbtn:active{transform:scale(.94)}
  .gearbtn.on{border-color:var(--green-d);background:var(--green-l)}

  /* 心拍数（β版） */
  .betatag{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.02em;
    background:var(--gold-l);color:var(--gold-d);border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:2px}
  .pnote{font-size:11px;color:var(--sub);line-height:1.6;margin-top:10px}
  .chtitle+.pnote{margin-top:6px}
  .pbig{text-align:center;padding:6px 0 2px}
  .pbig .pv{font-size:46px;font-weight:800;color:var(--pink);line-height:1.1}
  .pbig .pv small{font-size:16px;color:var(--sub);margin-left:5px;font-weight:700}
  .pbig .pt{font-size:12px;color:var(--sub)}
  .pbig .pq{font-size:13.5px;font-weight:800;margin-top:2px;color:var(--gold-d);letter-spacing:1px}
  .pbig .pq span{font-size:12.5px;color:var(--ink);letter-spacing:0;margin-left:6px}
  .pempty{text-align:center;color:var(--sub);font-size:13px;padding:14px 6px}

  /* 測定画面 */
  .pprev{width:100%;aspect-ratio:16/10;border-radius:13px;overflow:hidden;background:#20120f;
    display:grid;place-items:center;color:#f0d9cc;font-size:12px}
  .pprev video{width:100%;height:100%;object-fit:cover;display:block}
  .phold{text-align:center;font-size:13px;font-weight:800;margin-top:10px;min-height:22px}
  .pcount{text-align:center;font-size:46px;font-weight:800;color:var(--green-d);line-height:1.1;margin-top:2px}
  .pcount small{font-size:15px;color:var(--sub);font-weight:700;margin-left:4px}
  .ptrack{height:10px;background:#eef1ef;border-radius:6px;overflow:hidden;margin:10px 0 4px}
  .ptrack i{display:block;height:100%;width:0;background:var(--green-d);border-radius:6px;transition:width .25s linear}
  .ptrack i.prep{background:var(--amber)}
  .pphase{text-align:center;font-size:12px;color:var(--sub);font-weight:700;min-height:20px}
  #pulse-wave{width:100%;height:74px;display:block;margin-top:8px;background:#fbfcfb;border-radius:10px;border:1px solid var(--line2)}
  .plive{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--sub);margin-top:8px}
  .plive b{color:var(--pink);font-size:15px}
  .pguide{display:flex;align-items:center;gap:9px;margin-top:10px;padding:11px 12px;border-radius:13px;
    background:var(--green-l);border:1px solid #dcebe3}
  .pguide.warn{background:var(--amber-l);border-color:#f0dcb4}
  .pguide.bad{background:var(--terra-l);border-color:#f0d0c4}
  .pguide .gi{font-size:18px;line-height:1;flex:none}
  .pguide .gt{font-size:13px;font-weight:800;color:var(--green-dd)}
  .pguide.warn .gt{color:var(--gold-d)} .pguide.bad .gt{color:var(--terra)}
  .qbar{margin-top:10px}
  .qbar .ql{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);font-weight:700;margin-bottom:3px}
  .qbar .qt{height:7px;background:#eef1ef;border-radius:5px;overflow:hidden}
  .qbar .qt i{display:block;height:100%;width:0;background:var(--green-d);border-radius:5px;transition:width .3s}
  .qbar .qt i.low{background:var(--amber)} .qbar .qt i.bad{background:var(--terra)}

  /* 結果・お知らせ */
  .pres{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin-top:12px}
  .pres.ng{background:var(--terra-l);border-color:#f0d0c4}
  .pres.ng .rt{font-size:13.5px;font-weight:800;color:var(--terra);line-height:1.6}
  .pres .rd{font-size:11.5px;color:var(--sub);margin-top:6px}
  .presok{font-size:12px;font-weight:800;color:var(--green-d);text-align:center;margin-top:4px}

  /* 履歴 */
  .plist{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .pitem{border-bottom:1px solid var(--line2)}
  .pitem:last-child{border-bottom:0}
  .pmain{display:flex;align-items:center;gap:11px;width:100%;padding:11px 13px;text-align:left;color:inherit}
  .pmain .pv{font-size:20px;font-weight:800;color:var(--pink);white-space:nowrap;min-width:74px}
  .pmain .pv small{font-size:11px;color:var(--sub);margin-left:2px;font-weight:700}
  .pmain .pmid{flex:1;min-width:0}
  .pmain .pmid b{display:block;font-size:13px;font-weight:700}
  .pmain .pmid i{display:block;font-style:normal;font-size:11px;color:var(--gold-d);font-weight:700}
  .pmain .pg{flex:none;color:var(--sub);font-size:15px}
  .pdetail{padding:2px 13px 12px;background:#fbfcfb;border-top:1px solid var(--line2)}
  .pdrow{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:6px 0;border-bottom:1px solid var(--line2)}
  .pdrow:last-of-type{border-bottom:0}
  .pdrow .k{color:var(--sub);font-weight:700;flex:none}
  .pdrow .v{font-weight:800;text-align:right;word-break:break-all}
  .pdbtns{display:flex;gap:8px;margin-top:10px}
  .pdbtns button{flex:1;padding:10px;border-radius:11px;font-size:12.5px;font-weight:800;border:1px solid var(--line)}
  .pdbtns .ed{background:#fff;color:var(--green-d);border-color:#bfe0d3}
  .pdbtns .de{background:#fff;color:var(--terra);border-color:#f0d0c4}
  .pedit{padding:10px 13px 13px;background:#fbfcfb;border-top:1px solid var(--line2)}
  /* ライフプランへ渡す資産の一覧と内訳 */
  .lprow{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line2)}
  .lprow:last-of-type{border-bottom:0}
  .lpi{font-size:20px;line-height:1;flex:none}
  .lpmid{flex:1;min-width:0}
  .lpmid b{display:block;font-size:13.5px;font-weight:800}
  .lpmid i{display:block;font-style:normal;font-size:11px;color:var(--sub);font-weight:700}
  .lpv{font-size:14px;font-weight:800;white-space:nowrap}
  .lpbtn{flex:none;padding:8px 13px;border-radius:11px;font-size:12.5px;font-weight:800;
    color:var(--green-d);background:var(--green-l);border:1px solid #cfe4d9}
  /* 内訳の入力カード。ホームの入口カード（.lpcard）とは別物。
     同じ名前にしていたため、あちらの display:flex が残って
     見出し・入力欄・合計が横一列に潰れていた。名前を分ける。 */
  .lpseg{display:block;border:1px solid var(--line2);border-radius:13px;padding:11px 12px;margin-bottom:10px;background:#fbfcfb}
  .lpseg-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
  .lpseg-h b{font-size:13px;font-weight:800}

<body>
<div id="app"></div>
<button class="gearbtn" id="gearbtn" data-go="settings" aria-label="せってい">⚙️</button>
<nav class="nav" id="nav">

  <button data-nav="summary"><span class="ni">📊</span>まとめ</button>
  <button data-nav="calendar"><span class="ni">📅</span>カレンダー</button>
  <button data-nav="diary"><span class="ni">📖</span>日記</button>
  <button data-nav="health"><span class="ni">❤️</span>健康</button>
  <button data-nav="calc"><span class="ni">🧮</span>電卓</button>
  <button data-nav="pulse"><span class="ni">💓</span>心拍β</button>
</nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>

<input type="file" id="camInput" accept="image/*" capture="environment" class="hidden">
<input type="file" id="diaryPhotoInput" accept="image/*" class="hidden">
<input type="file" id="backupInput" accept="application/json,.json" class="hidden">

<script src="./core.js"></script>
<script>
/* =========================================================================
   かけいぼ ― 夢に近づく家計簿（MVP）
   ・ビルド不要の自己完結アプリ。データは端末内(localStorage)にのみ保存。
   ・「資産形成総合ライフプラン」へ渡す月次スナップショット書き出しに対応。
   ========================================================================= */
"use strict";
const STORE_KEY = "kakeibo:v1:state";

/* ---------- 分類・計算はすべて core.js（唯一の正）から取る ---------- */
const Core = window.KakeiboCore;
const EXP_CATS = Core.EXP_CATS;         // 表示・集計に使う支出カテゴリ（過去の記録のぶんも含む）
const EXP_PICK_CATS = Core.EXP_PICK_CATS;  // 記録シートで選べるカテゴリ（重複する「その他」を出さない）
const INC_CATS    = Core.INC_CATS;      // 収入のカテゴリ
const catOf       = Core.catOf;

/* ---------- 状態 ---------- */
const defaultState = ()=>{
  const settings=Core.normalizeSettings({});
  return {
    settings,
    tx:[],  // {id,type:'expense'|'income',amount,cat,date:'YYYY-MM-DD',memo,photo?}
    health:{},  // { 'YYYY-MM-DD': {weight,bpHigh,bpLow} } 1日1件・上書き
    diary:{},  // { 'YYYY-MM-DD': '本文' } 1日1件・編集可
    plans:{},  // { 'YYYY-MM-DD': [{id,time,text,done}] } 予定。1日に何件でも
    pulse:[],  // 心拍数（カメラ測定）の履歴。1日に何件でも。数値だけで映像は持たない
    calcHistory:[],  // 関数電卓の履歴 [{expr,value}]。式そのものは持ち歩かない
    recordCalcHistory:[], // 記録画面の電卓履歴 [{id,txId,expr,result,cat,type,country,date}]
    dataVersion: Core.DATA_VERSION  // 新しく入れた端末は最初から最小単位。移行を通らない
  };
};
let lastSaveError=null;
const MIGRATION_BACKUP_KEY = "kakeibo:v1:backup-before-minor-units";
let migrationBlocked = false;      // 控えが取れず、移行を見送った
let migrationDone = null;          // 移行できたときの件数（画面で知らせる）

/* 控えを取る。書けたら必ず読み戻して、1文字も違わないことまで確かめる。
   「書けたつもり」で移行を始めるのが、いちばん危ないため。 */
function backupBeforeMigration(raw){
  const put = (text) => {
    try{
      localStorage.setItem(MIGRATION_BACKUP_KEY, text);
      return localStorage.getItem(MIGRATION_BACKUP_KEY) === text;
    }catch(e){ return false; }
  };
  if(put(raw)) return true;
  /* 写真で場所が足りないことがある。金額を戻すのに写真は要らないので、
     写真だけ外した控えでもう一度試す。 */
  try{
    const lite = JSON.parse(raw);
    if(Array.isArray(lite.tx)) lite.tx = lite.tx.map(t => Object.assign({}, t, { photo: null }));
    if(lite.diary && typeof lite.diary === "object"){
      Object.keys(lite.diary).forEach(d => {
        if(lite.diary[d] && typeof lite.diary[d] === "object") lite.diary[d] = { text: lite.diary[d].text || "" };
      });
    }
    return put(JSON.stringify(lite));
  }catch(e){ return false; }
}

let state = load();
/* 移行できたときは、その場で書き込んで印を確定させる。
   ここで書けなかったら印も付かないので、次に開いたときにやり直す
   （＝金額だけ移行されて印が無い、という状態にはならない）。 */
if(migrationDone && !save()) migrationDone=null;
let view = "home";
let sumTab = "month";   // まとめ画面のタブ： "month"（今月）／"analysis"（分析）

/* =========================================================================
   最小通貨単位への移行（一度きり）
   -------------------------------------------------------------------------
   移行は、保存データの金額を書き換える唯一の処理。だから2つ守る。

     ① 移行の直前に、移行前のまま控えを取る。控えが取れなければ移行しない
     ② 控えと dataVersion の印は、金額と同じ1回の setItem で入る
        （＝「金額だけ移行されて印が無い」状態は作れない＝二重移行しない）

   控えが取れなかったときは移行せず、保存もいったん止める。
   古い単位のまま書き込むと、次に開いたときに二重移行の判断ができなくなるため。
   空きを作ってから開き直せば、そこで移行が完了する。
   ========================================================================= */
function load(){
  try{ const raw = localStorage.getItem(STORE_KEY); if(raw){ let s=JSON.parse(raw);
    /* --- 移行はここ。整える前の、保存されたそのままの形に対してかける --- */
    if(Core.needsMinorUnitMigration(s)){
      if(backupBeforeMigration(raw)){
        const m = Core.migrateToMinorUnits(s);
        s = m.state;
        migrationDone = { tx: m.txConverted, profiles: m.profilesConverted };
      }else{
        migrationBlocked = true;   // 控えが取れなかった。移行しない
      }
    }
    const legacy=Core.normalizeSettings(s.settings||{});
    /* JPだけを使ってきた端末は、保存サイズも形もできるだけ従来のままにする。
       moneyProfiles がある場合だけ国別プロファイルを復元する。
       旧US版（プロファイル無し）は、共有されていた金額をJPへ退避してUSは空から始める。 */
    let profiles=null, active=legacy;
    if(s.moneyProfiles && typeof s.moneyProfiles==="object"){
      profiles=Core.normalizeMoneyProfiles(s.moneyProfiles, s.settings||{});
      active=Core.settingsForCountry(profiles, legacy.country, legacy.birth);
      profiles[active.country]=Core.normalizeSettings(active);
    }else if(legacy.country!=="JP"){
      profiles=Core.normalizeMoneyProfiles(null, s.settings||{});
      active=Core.settingsForCountry(profiles, legacy.country, legacy.birth);
      profiles[active.country]=Core.normalizeSettings(active);
    }
    /* 記録も health/diary/plans/pulse と同じように整えてから使う。
       ここだけ素通しにすると、壊れた金額や不正な写真が
       再起動しても消えずに残ってしまう。 */
    const recordCalcHistory=Array.isArray(s.recordCalcHistory) ? s.recordCalcHistory.slice(-50).filter(h=>h&&typeof h==="object").map(h=>({
      id:String(h.id||uid()), txId:String(h.txId||""), expr:String(h.expr||"").slice(0,120),
      result:String(h.result||"").slice(0,40), cat:String(h.cat||"food").slice(0,30),
      type:h.type==="income"?"income":"expense", country:Core.normalizeCountry(h.country),
      date:Core.normalizeDateString(h.date)||todayISO()
    })).filter(h=>h.expr&&h.result) : [];
    const out={ settings:active, tx:Core.normalizeTxList(s.tx), health:Core.normalizeHealth(s.health), diary:Core.normalizeDiary(s.diary), plans:Core.normalizePlans(s.plans), pulse:Core.normalizePulseList(s.pulse), calcHistory:Core.normalizeSciHistory(s.calcHistory), recordCalcHistory };
    if(profiles) out.moneyProfiles=profiles;
    /* 移行を見送ったときは印を付けない。次に開いたとき、もう一度やり直す。 */
    if(!migrationBlocked) out.dataVersion=Core.DATA_VERSION;
    return out; } }
  catch(e){ /* ignore */ }
  return defaultState();
}
function syncMoneyProfile(){
  if(!state || !state.settings) return;
  const c=Core.normalizeCountry(state.settings.country);
  /* JPしか使っていない間は余分なプロファイルを保存しない。 */
  if(!state.moneyProfiles && c==="JP") return;
  state.moneyProfiles=Core.normalizeMoneyProfiles(state.moneyProfiles, c==="JP"?state.settings:null);
  state.moneyProfiles[c]=Core.normalizeSettings(Object.assign({},state.settings,{country:c}));
}
function save(){
  /* 移行を見送っている間は書き込まない。古い単位のまま上書きすると、
     次に開いたときに移行済みかどうかを判断できなくなる。 */
  if(migrationBlocked){ lastSaveError = new Error("QuotaExceededError"); lastSaveError.name="QuotaExceededError"; return false; }
  try{ syncMoneyProfile(); localStorage.setItem(STORE_KEY, JSON.stringify(state)); lastSaveError=null; return true; }
  catch(e){ lastSaveError=e; return false; }
}
function isQuotaError(e){
  if(!e) return false;
  return e.name==="QuotaExceededError" || e.name==="NS_ERROR_DOM_QUOTA_REACHED" || e.code===22 || e.code===1014;
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ---------- 日付・お金ヘルパ ---------- */
const pad=n=>String(n).padStart(2,"0");
function todayISO(d=new Date()){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function ymOf(iso){ return iso.slice(0,7); }
/* 月の区切りの起点日（設定。既定は1日＝暦の月）。計算のしかたは core.js が唯一の正。 */
function cycleStart(){ return Core.normalizeCycleStart(state.settings && state.settings.cycleStart); }
/* 今いる区切りのキー。起点が1日なら、これまでどおり今月の "YYYY-MM"。 */
function curYM(){ return Core.cycleOf(todayISO(), cycleStart()); }
/* ---------- 国・ことば・お金の書き方 ----------
   決めごと：**保存するデータは国が変わっても同じ形**。
   カテゴリは内部ID（food / rent …）のまま保存し、
   「食費 / Groceries」は表示のときだけ切り替える。
   書き方の表はすべて core.js が持つ（画面には文言表を置かない）。 */
function curCountry(){ return Core.normalizeCountry(state.settings && state.settings.country); }
function isEn(){ return Core.countryLang(state.settings)==="en"; }
function T(key, vars){ return Core.t(key, state.settings, vars); }
/* 既存の静的テストが index.html の文言を直接見ているものは、
   日本語をこのファイルに残したまま、英語のときだけ表から引く。
   こうすると日本版の文言が画面ファイルから消えず、
   これまでの砦（integrity.test.js）がそのまま効き続ける。 */
function TJ(key, ja, vars){ return isEn() ? Core.t(key, state.settings, vars) : ja; }
function catN(type, k){ return Core.catName(type, k, state.settings); }
/* その場かぎりの文言は、日本語と英語を並べて書く。
   何度も使い回す文言だけを core.js の UI_TEXT に置く。
   ここに日本語がそのまま残るので、日本版の表示が変わっていないか目で確かめやすい。 */
function L(ja, en){ return isEn() ? en : ja; }
/* 年齢の区間の書き方。JPは「57歳 〜 65歳」、USは「age 57 to 65」。 */
function curSym(){ return Core.countryRule(curCountry()).symbol; }
/* 計算のエラー文。core.js が付ける errorKey があれば、その国のことばで出す。 */
function errText(o){
  if(!o) return "";
  if(o.errorKey) return Core.t(o.errorKey, state.settings);
  return o.error||"";
}
function ageParts(age){
  const n=Number(age)||0;
  const total=Math.max(0,Math.round(n*12));
  return { years:Math.floor(total/12), months:total%12 };
}
function ageValueFromFields(yearId, monthId){
  const yEl=$(yearId), mEl=$(monthId);
  const y=Math.max(0,Math.floor(Number(yEl&&yEl.value)||0));
  const m=Math.max(0,Math.floor(Number(mEl&&mEl.value)||0));
  return (y*12+m)/12;
}
function ageValueLabel(age){
  const a=ageParts(age);
  return L(`${a.years}歳${a.months?` ${a.months}ヶ月`:``}`, `age ${a.years}${a.months?`y ${a.months}m`:``}`);
}
function ageRangeLabel(from, to){ return L(`${ageValueLabel(from)} 〜 ${ageValueLabel(to)}`, `${ageValueLabel(from)} to ${ageValueLabel(to)}`); }
function ageInputHtml(id,label,age,phYear){
  const a=ageParts(age);
  const has=age!=="" && age!=null && Number(age)!==0;
  return `<label>${label}<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
    <span style="display:flex;align-items:center;gap:5px"><input class="mono" id="${id}" inputmode="numeric" value="${has?a.years:""}" placeholder="${phYear||"0"}"><span>${L("歳","yr")}</span></span>
    <span style="display:flex;align-items:center;gap:5px"><input class="mono" id="${id}-month" inputmode="numeric" min="0" max="11" value="${has?a.months:""}" placeholder="0"><span>${L("ヶ月","mo")}</span></span>
  </div></label>`;
}
function wd(dow){ return Core.weekdayShort(dow, state.settings); }
/* 金額。日本のときは今までと1文字も変わらない「¥1,234」。USは「$1,234.56」。
   -----------------------------------------------------------------------
   内部の金額は最小通貨単位（JPは円、USはセント）で持っている。
   画面へ出すときは、必ずここで主単位へ戻す。
   金額を出す場所はすべて yen() を通しているので、境目はこの1か所だけ。 */
function yen(v){ return Core.formatAmount(v, state.settings); }
/* 打ち込まれた主単位の数を、内部の最小単位へ直す。受け取る境目はここだけ。 */
function toMinor(v){ return Core.toMinor(v, state.settings); }
/* 内部の最小単位を、打ち込み欄やグラフの目もりに出す主単位へ戻す。 */
function toMajor(v){ return Core.toMajor(v, state.settings); }
/* 今の区切りが終わるまで、あと何日か */
function daysLeftInCycle(){
  const r=Core.cycleRange(curYM(), cycleStart());
  return Math.max(0, Core.daysApart(todayISO(), r.to));
}
function weekRange(){ const d=new Date(); const day=(d.getDay()+6)%7; /*Mon=0*/ const mon=new Date(d); mon.setDate(d.getDate()-day);
  const sun=new Date(mon); sun.setDate(mon.getDate()+6); return {from:todayISO(mon),to:todayISO(sun)}; }

/* ---------- 集計（計算式は core.js が唯一の正。ここでは足し引きしない） ---------- */
function compute(){
  const c = Core.computeMonth(state.settings, state.tx, curYM());
  const {from,to} = weekRange();
  c.weekSpent = Core.weekSpent(state.tx, from, to, state.settings);
  return c;
}

/* ---------- ルート描画 ---------- */
const $=id=>document.getElementById(id);
/* 下のタブに「いま見ている画面」の印をつける。
   見た目（.on）だけでなく aria-current も付けて、読み上げでも分かるようにする。 */
function navMark(btn, on){
  if(!btn) return;
  if(btn.classList) btn.classList.toggle("on", on);
  if(typeof btn.setAttribute!=="function") return;
  if(on) btn.setAttribute("aria-current","page");
  else if(typeof btn.removeAttribute==="function") btn.removeAttribute("aria-current");
}

/* 下のタブ・歯車・ページの言語を、いまの国に合わせる。
   HTMLに書いてある日本語は初期表示用で、ここで必ず上書きされる。 */
const NAV_ICONS={home:"🏠",summary:"📊",calendar:"📅",diary:"📖",health:"❤️",calc:"🧮",pulse:"💓"};
function applyLang(){
  try{
    document.querySelectorAll("#nav button").forEach(b=>{
      const k=b.dataset&&b.dataset.nav; if(!k||!NAV_ICONS[k]) return;
      b.innerHTML=`<span class="ni">${NAV_ICONS[k]}</span>${T("nav."+k)}`;
    });
    const gear=$("gearbtn");
    if(gear&&typeof gear.setAttribute==="function") gear.setAttribute("aria-label", T("nav.settings"));
    const root=document.documentElement;
    if(root&&typeof root.setAttribute==="function") root.setAttribute("lang", isEn()?"en":"ja");

    /* ホーム画面に追加したときの名前も、いまのことばに合わせる。
       manifest は静的ファイルなので中身を多言語にはできない。
       そこで、ことばごとのファイルを用意して差し替える。 */
    const man=document.querySelector('link[rel="manifest"]');
    if(man&&typeof man.setAttribute==="function"){
      man.setAttribute("href", isEn()?"./manifest-en.webmanifest":"./manifest.webmanifest");
    }
    /* iPhone はホーム画面の名前を manifest ではなくこの meta から取る */
    const appTitle=document.querySelector('meta[name="apple-mobile-web-app-title"]');
    if(appTitle&&typeof appTitle.setAttribute==="function"){
      appTitle.setAttribute("content", isEn()?"Kakeibo":"かけいぼ");
    }
    if(typeof document.title==="string"){
      document.title=isEn()?"Kakeibo — a budget that gets you closer to your dream":"かけいぼ ― 夢に近づく家計簿";
    }
  }catch(e){ /* 最小DOMでも落とさない */ }
}

function render(){
  applyLang();
  /* 心拍の画面から離れるときは、必ずカメラとライトを止める。
     pRunning は「許可が下りたあと」に立つので、それだけを条件にすると
     許可を待っている最中に画面を移られたときに止め損ねる。
     待っている最中かどうか（pGen が進んでいるか）も一緒に見る。 */
  if(view!=="pulse" && (pRunning || pStream || pGen!==pStopGen)) pulseStopAll();
  document.querySelectorAll("#nav button").forEach(b=>navMark(b, b.dataset.nav===view));
  const gear=$("gearbtn"); if(gear&&gear.classList) gear.classList.toggle("on", view==="settings");
  const app=$("app");
  if(view==="home") app.innerHTML=renderHome();
  else if(view==="summary") app.innerHTML = sumTab==="analysis" ? renderAnalysis() : renderSummary();
  else if(view==="calendar") app.innerHTML=renderCalendar();
  else if(view==="diary") app.innerHTML=renderDiary();
  else if(view==="health") app.innerHTML=renderHealth();
  else if(view==="calc") app.innerHTML=renderSci();
  else if(view==="pulse") app.innerHTML=renderPulse();
  else if(view==="lp") app.innerHTML=renderLp();
  else if(view==="settings") app.innerHTML=renderSettings();
  window.scrollTo(0,0);
}

/* 今日やることカード。やることが無いときは、何も出さない。 */
function taskCard(){
  const today=todayISO();
  const tasks=Core.todayTasks(state, today);
  /* 今日の予定（まだ済んでいないもの）。タップでその場でチェックできる。 */
  const plans=Core.todayPlans(state, today);
  const shown=plans.slice(0, Core.PLAN_SHOW_MAX);
  if(!tasks.length && !shown.length) return "";
  const planRows=shown.map((p,i)=>`<button class="todo${i===0?" first":""}" data-act="plan-toggle" data-date="${today}" data-id="${p.id}">
      <span class="ti">☐</span>
      <span class="tm"><span class="t1">${p.time?`${p.time}　`:""}${escapeHtml(p.text)}</span><span class="t2">${T("home.todayPlan")}</span></span>
      <span class="tg">✓</span>
    </button>`).join("");
  const more = plans.length>shown.length
    ? `<button class="todo" data-act="task" data-task="diary"><span class="ti">📝</span>
        <span class="tm"><span class="t1">${T("home.morePlans",{n:plans.length-shown.length})}</span></span><span class="tg">›</span></button>`
    : "";
  const rows=tasks.map((t,i)=>`<button class="todo${(i===0&&!planRows)?" first":""}" data-act="task" data-task="${t.act}">
      <span class="ti">${t.icon}</span>
      <span class="tm"><span class="t1">${escapeHtml(t.text)}</span>${t.sub?`<span class="t2">${escapeHtml(t.sub)}</span>`:""}</span>
      <span class="tg">›</span>
    </button>`).join("");
  return `<div class="todos"><div class="hd">${T("home.todos")}</div>${planRows}${more}${rows}</div>`;
}

/* やることをタップしたときの行き先。ここでは記録を書き換えない。 */
function goTask(act){
  if(act==="carry"){ view="summary"; sumTab="month"; render(); return; }
  if(act==="record"){ openRecord(null); return; }
  if(act==="salary"){
    openRecord(null);
    sheetState.type="income"; sheetState.cat="salary";
    renderSheet(); return;
  }
  if(act==="diary"){ diaryEditDate=null; diaryPhotoPending=undefined; view="diary"; render(); return; }
  if(act==="health"){ view="health"; render(); return; }
}

/* ---------- 外部アプリ（資産形成 総合ライフプラン）への入口 ----------
   別プロジェクトとして公開しているサイトへ、リンクで移動するだけ。
   家計簿の計算・保存データには一切関わらない。 */
const LIFEPLAN_URL="https://pitbully-works.jp/";

/* ホーム画面に追加したPWA（standalone表示）で開いているかどうか。
   iPhoneでは開き方によって戻りやすさが変わるので、これで target を切り替える。
     ・PWA        … target="_blank"。iOSはアプリ内のブラウザで開き、「完了」や
                    左端スワイプでかけいぼへ戻れる。入力中の画面も残る。
     ・Safariのタブ … 同じタブ。戻るボタン／左端スワイプ一発で戻れ、タブも増えない。
   テスト用の最小DOMのように matchMedia が無い環境でも落ちないようにする。 */
function isStandalonePWA(){
  try{
    if(typeof navigator!=="undefined" && navigator && navigator.standalone===true) return true;
    if(typeof window==="undefined" || !window || typeof window.matchMedia!=="function") return false;
    return window.matchMedia("(display-mode: standalone)").matches===true;
  }catch(e){ return false; }
}
function extTarget(){ return isStandalonePWA() ? "_blank" : "_self"; }

/* ホームのいちばん下に出す「今月の予定」。暦の月（1日〜月末）で見る。
   済んだ予定はグレーで残す。 */
function monthPlanCard(){
  const today=todayISO();
  const ym=today.slice(0,7);
  const m=Core.monthPlans(state, ym);
  if(!m.total) return "";
  /* いったん1行ずつに開いてから、出す行数をここで1回だけ決める */
  const rows=[];
  for(const d of m.days) for(const p of d.plans) rows.push({date:d.date, plan:p});
  const shownRows=rows.slice(0, Core.PLAN_HOME_MAX);
  let html="", lastDate="";
  for(const r of shownRows){
    if(r.date!==lastDate){
      lastDate=r.date;
      const [yy,mm,dd]=r.date.split("-").map(Number);
      const wdName=wd(new Date(yy,mm-1,dd).getDay());
      html+=`<div class="mpday${r.date===today?" today":""}">${mm}/${dd}${isEn()?` (${wdName})`:`（${wdName}）`}${r.date===today?T("home.today"):""}</div>`;
    }
    const p=r.plan;
    html+=`<div class="prow${p.done?" done":""}">
      <button class="pchk" data-act="plan-toggle" data-date="${r.date}" data-id="${p.id}" aria-label="済みにする">${p.done?"☑":"☐"}</button>
      <span class="ptime mono">${p.time||"—"}</span>
      <button class="ptext mplink" data-act="cal-edit-plan" data-date="${r.date}">${escapeHtml(p.text)}</button>
    </div>`;
  }
  const rest=rows.length-shownRows.length;
  return `<div class="stitle">${T("home.monthPlans",{month:Core.monthName(Number(ym.slice(5,7)), state.settings)})}</div>
    <div class="barlist">
      <div style="font-size:11.5px;color:var(--sub);margin-bottom:2px">${T("home.planCount",{total:m.total})} <b style="color:var(--ink)">${T("home.planLeft",{n:m.left})}</b></div>
      ${html}
      ${rest>0?`<button class="mpmore" data-nav="calendar">${T("home.planMore",{n:rest})}</button>`:""}
    </div>`;
}

/* 収入を100%とした割合のドーナツ円グラフ（SVG・外部ライブラリなし） */
function donutChart(bd){
  const R=52, C=Math.PI*2*R, cx=60, cy=60;
  let acc=0;
  const total=bd.parts.reduce((s,p)=>s+p.amount,0);
  const segs = total>0 ? bd.parts.filter(p=>p.amount>0).map(p=>{
    const frac=p.amount/Math.max(total, bd.base);
    const len=C*frac;
    const seg=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${p.color}" stroke-width="14"
      stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}"
      transform="rotate(-90 ${cx} ${cy})"></circle>`;
    acc+=len; return seg;
  }).join("") : `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--line2)" stroke-width="14"></circle>`;
  const legend=bd.parts.map(p=>`<div style="display:flex;align-items:center;gap:6px;font-size:12px">
    <span style="width:10px;height:10px;border-radius:3px;background:${p.color};flex:0 0 auto"></span>
    <span style="flex:1">${p.name}</span><b class="mono">${p.pct}%</b></div>`).join("");
  return `<div style="display:flex;align-items:center;gap:16px">
    <svg viewBox="0 0 120 120" style="width:120px;height:120px;flex:0 0 auto">${segs}
      <text x="60" y="56" text-anchor="middle" style="font-size:11px;fill:var(--sub)">${T("donut.income")}</text>
      <text x="60" y="72" text-anchor="middle" style="font-size:13px;font-weight:800;fill:var(--ink)" class="mono">${yen(bd.income)}</text>
    </svg>
    <div style="flex:1;display:flex;flex-direction:column;gap:6px">${legend}
      ${bd.over>0?`<div style="font-size:11px;color:#c2694f">${T("donut.over",{amount:yen(bd.over)})}</div>`:""}
    </div>
  </div>`;
}
/* 先月の「🔁 毎月固定」を今月へまとめて入れるカード。
   入れるものが無いときは、何も出さない（済んだら消える）。 */
function carryCard(){
  const plan=Core.recurringCarryPlan(state.tx, curYM(), cycleStart(), state.settings);
  if(!plan.toAdd.length) return "";
  const names=plan.toAdd.slice(0,4).map(i=>`${i.emoji} ${escapeHtml(i.name)} ${yen(i.amount)}`).join(" ・ ");
  const more=plan.toAdd.length>4?` ${T("home.morePlans",{n:plan.toAdd.length-4})}`:"";
  return `<div class="barlist" style="margin-top:10px">
    <div style="font-size:13px;font-weight:800;color:var(--ink);margin-bottom:4px">${T("sum.carryTitle",{n:plan.toAdd.length})}</div>
    <div style="font-size:11.5px;color:var(--sub);margin-bottom:10px">${names}${more}${T("sum.carryTotal")}<b class="mono" style="color:var(--ink)">${yen(plan.total)}</b>${plan.skipped>0?`<br>${T("sum.carrySkip",{n:plan.skipped})}`:""}</div>
    <button class="btn-main" data-act="carry-recurring">${T("sum.carryBtn")}</button>
    <div style="font-size:10.5px;color:var(--sub);margin-top:6px">${T("sum.carryNote")}</div>
  </div>`;
}

/* まとめて入れる。1件でも保存に失敗したら、1件も増やさずに戻す。 */
function carryRecurring(){
  const plan=Core.recurringCarryPlan(state.tx, curYM(), cycleStart(), state.settings);
  if(!plan.toAdd.length){ toast(L("入れるものはありません","There is nothing to add")); return; }
  const lines=plan.toAdd.map(i=>`${i.emoji} ${i.name} ${yen(i.amount)}`).join("\n");
  const ok=confirm(
    `先月（${plan.from.replace("-","年")}月）の毎月固定を、今月へ入れます。\n\n${lines}\n\n合計 ${yen(plan.total)}\n\n` +
    "金額は先月と同じです。ちがうときは、入れたあとで直してください。\n\n続けますか？"
  );
  if(!ok) return;                                   // キャンセル：何も変えない
  const before = JSON.parse(JSON.stringify(state.tx));   // 失敗したら戻せるように退避
  plan.toAdd.forEach(i=>{
    state.tx.push({id:uid(),type:"expense",amount:i.amount,cat:i.cat,date:i.date,memo:i.memo,photo:null,recurring:true});
  });
  /* 国の印。JPのときはキーごと持たせない（日本の保存データの形を変えないため）。 */
  if(curCountry()!=="JP"){
    state.tx.slice(state.tx.length-plan.toAdd.length).forEach(t=>{ t.country=curCountry(); });
  }
  if(!save()){
    state.tx = before;            // 途中まで増えた状態を残さない
    toast(L("入れられませんでした（空き容量をご確認ください）","Could not add them — please check your free space"));
    return;
  }
  render(); toast(L(`${plan.toAdd.length}件を今月に入れました ✓`, `Added ${plan.toAdd.length} to this month ✓`));
}

/* まとめに出す「毎月ひとりでに出ていくお金」の内わけ。
   ライフプラン欄に入れた毎月の金額は、記録からは入れない決めごとなので、
   記録した固定費とは別に、ここで並べて見せる。 */
function lpMonthlyCard(c){
  const line = (name, amount, key) => `<div class="krow"><span>${escapeHtml(Core.lpRowName(key, name, state.settings))}</span><b class="mono">${yen(amount)}</b></div>`;
  const setAside = c.lpSetAside || [];
  const spend = c.lpSpend || [];
  const note = `<div class="calcnote" style="margin:0 0 8px">${T("sum.setAsideNote")}
      <b>${T("sum.notFromRecords")}</b>${T("sum.doubleCount")}</div>`;
  let html = "";
  if(setAside.length || c.nisaPlanned){
    html += `<div class="stitle">${T("sum.setAsideTitle")}</div>
      <div class="barlist">${note}
        ${c.nisaPlanned?line("NISA積立", c.nisaPlanned, "nisa"):""}
        ${setAside.map(r=>line(r.name, r.amount, r.key)).join("")}
        <div class="krow" style="border-top:1px solid var(--line2);margin-top:6px;padding-top:8px">
          <span><b>${T("sum.total")}</b></span><b class="mono">${yen(c.setAside)}</b></div>
      </div>`;
  }
  if(spend.length){
    html += `<div class="stitle">${T("sum.fixedTitle")}</div>
      <div class="barlist">
        <div class="calcnote" style="margin:0 0 8px">${T("sum.fixedNote")}<b>${T("sum.asSpend")}</b>${T("sum.counted")}
          ${T("sum.alsoNot")}<b>${T("sum.notFromRecords")}</b>。</div>
        ${spend.map(r=>line(r.name, r.amount, r.key)).join("")}
        <div class="krow" style="border-top:1px solid var(--line2);margin-top:6px;padding-top:8px">
          <span><b>${T("sum.total")}</b></span><b class="mono">${yen(c.lpSpendSum||0)}</b></div>
      </div>`;
  }
  return html;
}

function renderSummary(){
  const c=compute();
  /* ホームと同じ定義。のこり ＝ 収入 － 支出 － 先取り ＝ c.available */
  const net=c.available;
  // 直近の記録（新しい順、日付グループ）
  const list=[...Core.txsForCountry(state.tx, state.settings)].sort((a,b)=> a.date<b.date?1:a.date>b.date?-1: (a.id<b.id?1:-1));
  let recHtml="";
  if(list.length===0){
    recHtml=`<div class="empty"><span class="e">🧾</span>${T("sum.empty")}</div>`;
  } else {
    const groups={}; list.forEach(t=>{ (groups[t.date]=groups[t.date]||[]).push(t); });
    recHtml = Object.keys(groups).sort().reverse().slice(0,60).map(date=>{
      const items=groups[date];
      const dayTotal=items.filter(t=>t.type==="expense").reduce((a,t)=>a+Number(t.amount),0);
      const md=Core.formatMonthDay(date, state.settings);
      const rows=items.map(t=>{ const cat=catOf(t.type,t.cat); const cn=catN(t.type,t.cat);
        return `<div class="tx" data-edit="${t.id}"><div class="ic">${t.type==="income"?"💴":cat.e}</div>
          <div class="mid"><div class="t1">${escapeHtml(t.memo|| cn)}</div>
          <div class="t2">${t.type==="income"?T("sum.incomeTag"):""}${escapeHtml(cn)}${t.photo?" ・📷":""}${t.recurring?`<span class="tag fx">${T("sum.recurring")}</span>`:""}</div></div>
          <div class="amt ${t.type}">${t.type==="income"?"+":""}${yen(t.amount)}</div></div>`;
      }).join("");
      return `<div class="daygroup"><div class="dayhd"><span>${md}</span><span>${T("sum.dayTotal",{amount:yen(dayTotal)})}</span></div>
        <div class="txcard">${rows}</div></div>`;
    }).join("");
  }
  // カテゴリ内訳バー
  const cats=Object.entries(c.byCat).sort((a,b)=>b[1]-a[1]);
  /* 棒の基準は「収入」。収入に対して各カテゴリが何%かを見せる。
     収入がまだ無い月は、支出のいちばん大きい項目を基準にして形だけ見せる。 */
  const barBase = c.incomeTotal>0 ? c.incomeTotal : (cats.length?cats[0][1]:1);
  const PIE={food:"#8fbf7f",eatout:"#d9a54f",daily:"#4fa8d8",rent:"#7f9cc0",power:"#e0c060",gas:"#d98a5f",water:"#5fb0d0",comm:"#9a8fd0",insure:"#78b89a",transit:"#b08fd6",car:"#8a9a70",medical:"#c2694f",clothes:"#c98fb0",social:"#6fa88a",hobby:"#e6b0a6",pet:"#b89a70",pension:"#d0b060",tax:"#a0a0a8",subs:"#8fb0c0",other:"#9fb0ab"};
  const bars = cats.length? cats.map(([k,v])=>{ const cat=catOf("expense",k);
      const pct = Math.round(v/barBase*100);
      return `<div class="brow"><span class="bt">${cat.e} ${escapeHtml(catN("expense",k))}</span><span class="track"><span class="fill" style="width:${Math.max(3,Math.min(100,pct))}%;background:${PIE[k]||"#9fb0ab"}"></span></span><span class="bv mono">${yen(v)}<span style="color:var(--sub);font-weight:600;font-size:11px"> ${pct}%</span></span></div>`;
    }).join("") : `<div class="muted" style="font-size:12.5px;text-align:center;padding:6px">${T("sum.noSpend")}</div>`;

  return `<div class="screen">
    ${sumTabs()}
    ${carryCard()}
    <div class="stitle" style="margin-top:6px">${T("sum.title",{month:Core.monthName(Number(curYM().slice(5,7)), state.settings)+(Core.cycleLabel(curYM(), cycleStart(), state.settings)?(isEn()?" · ":"・")+Core.cycleLabel(curYM(), cycleStart(), state.settings):"")})}</div>
    <div class="sumcards">
      <div class="sc"><div class="l">${T("sum.income")}</div><div class="v inc mono">${yen(c.incomeTotal)}</div></div>
      <div class="sc"><div class="l">${T("sum.spend")}</div><div class="v exp mono">${yen(c.spendTotal)}</div></div>
      <div class="sc"><div class="l">${T("sum.setAside")}</div><div class="v mono">${yen(c.setAside)}</div></div>
      <div class="sc"><div class="l">${T("sum.left")}</div><div class="v net mono">${net>=0?"+":""}${yen(net)}</div></div>
    </div>
    <div class="calcnote">${T("sum.formula",{income:yen(c.incomeTotal),spend:yen(c.spendTotal),setAside:yen(c.setAside)})}<b>${yen(net)}</b><br>
      ${T("sum.sameAsHome")}</div>
    <div class="barlist">
      <div style="font-size:11.5px;color:var(--sub);margin-bottom:8px">${T("sum.donutLabel")}</div>
      ${donutChart(Core.budgetBreakdown(c))}
    </div>
    ${lpMonthlyCard(c)}
    <div class="barlist">
      <div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--sub);margin-bottom:4px">
        <span>${T("sum.incomeBreak")}</span><span></span></div>
      <div class="krow"><span>${T("sum.incomeRegular")}${c.incomeRegularRecorded?"":`<span class="tag pl">${T("sum.notRecorded")}</span>`}</span><b class="mono">${yen(c.incomeRegular)}</b></div>
      <div class="krow"><span>${T("sum.incomeExtra")}</span><b class="mono">${yen(c.incomeExtra)}</b></div>
    </div>
    <div class="barlist">
      <div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--sub);margin-bottom:6px">
        <span>${T("sum.spendBreak")}${c.incomeTotal>0?T("sum.barNote"):""}</span>
        <span class="mono" style="font-weight:800;color:var(--ink)">${yen(c.spendTotal)}</span></div>
      ${c.recurringSpend>0?`<div class="krow"><span>${T("sum.recurring")}</span><b class="mono">${yen(c.recurringSpend)}</b></div>
      <div class="krow" style="border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:4px"><span>${T("sum.spot")}</span><b class="mono">${yen(c.spotSpend)}</b></div>`:""}
      ${bars}
    </div>
    <div class="stitle">${TJ("sum.records","記録（タップで編集）")}</div>
    ${recHtml}
  </div>`;
}

function sumTabs(){

  return `<div class="seg">${b("month",T("sum.tabMonth"))}${b("analysis",T("sum.tabAnalysis"))}</div>`;

/* 使うペース：つかった累計の線と、予算のペース（点線）を重ねる。
   縦＝金額の目もり（万単位）／横＝日にち。目もりの決め方は core.js（chartScale）が正。 */
/* グラフの目もり。渡ってくる v は内部の最小単位なので、
   ここで主単位へ戻してから「万」「k」に丸める。
   直さないと、USの軸だけが100倍の数字になる。 */
/* 目もりの数字を短くする（1.5 → "1.5"、2 → "2"）。 */
function tickShort(n){ return Number.isInteger(n) ? n : Math.round(n*10)/10; }
function yenTick(minorValue){
  const v = toMajor(minorValue);
  if(v===0) return "0";
  /* 英語圏は「万」を使わない。1000区切りの k と、100万区切りの M で出す。
     M が無いと 1,500,000 が "1500k" になり、桁がぱっと読めない。 */
  if(isEn()){
    if(v>=1000000){ return tickShort(v/1000000)+"M"; }
    if(v>=1000){ return tickShort(v/1000)+"k"; }
    return v.toLocaleString("en-US");
  }
  if(v>=10000){ return tickShort(v/10000)+"万"; }
  return v.toLocaleString("ja-JP");
}
function paceChart(p){
  if(!p.daily.length || p.spendTotal<=0) return `<div class="muted" style="text-align:center;padding:14px;font-size:12.5px">${T("an.noRecords")}</div>`;
  const last=p.daily[p.daily.length-1];
  const showFore=(p.isCurrent&&p.elapsed<p.days);
  const sc=Core.chartScale([0, last.cum, p.budget>0?p.budget:0, showFore?p.forecast:0], Core.CHART_TICKS);
  const W=320,H=158,padL=36,padR=10,padT=12,padB=26;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const col=(p.over!==null&&p.over>0)?"#c2694f":"#6f9c78";
  const x=d=>padL+plotW*((d-1)/Math.max(1,p.days-1));
  const span=(sc.hi-sc.lo)||1;
  const y=v=>padT+plotH*(1-(v-sc.lo)/span);

  /* 横線（金額の目もり）と、左の数字 */
  const grid=sc.ticks.map(t=>{
    const yy=y(t).toFixed(1);
    return `<line x1="${padL}" x2="${W-padR}" y1="${yy}" y2="${yy}" stroke="#e7ecee" stroke-width="1"></line>`
         + `<text x="${padL-5}" y="${(y(t)+3.4).toFixed(1)}" text-anchor="end" font-size="9.5" fill="#647476">${yenTick(t)}</text>`;
  }).join("");

  /* 縦線と、下の日にち（1日・…・${p.days}日） */
  const xi=Core.chartLabelIndexes(p.days, Core.CHART_XLABELS);
  const xaxis=xi.map(i=>{
    const day=i+1, xx=x(day).toFixed(1);
    const anchor=i===0?"start":(i===p.days-1?"end":"middle");
    return `<line x1="${xx}" x2="${xx}" y1="${padT}" y2="${padT+plotH}" stroke="#eef2f0" stroke-width="1"></line>`
         + `<text x="${xx}" y="${H-8}" text-anchor="${anchor}" font-size="9.5" fill="#647476">${isEn()?day:day+"日"}</text>`;
  }).join("");

  const pts=p.daily.map(d=>`${x(d.day).toFixed(1)},${y(d.cum).toFixed(1)}`).join(" ");
  const budgetLine=p.budget>0
    ? `<line x1="${x(1).toFixed(1)}" y1="${y(p.budgetPerDay).toFixed(1)}" x2="${x(p.days).toFixed(1)}" y2="${y(p.budget).toFixed(1)}" stroke="#9fb0ab" stroke-width="1.5" stroke-dasharray="4 4"></line>` : "";
  const foreLine=showFore
    ? `<line x1="${x(p.elapsed).toFixed(1)}" y1="${y(last.cum).toFixed(1)}" x2="${x(p.days).toFixed(1)}" y2="${y(p.forecast).toFixed(1)}" stroke="${col}" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.55"></line>` : "";

  /* 凡例。線の色と種類をそのまま見せて、どれが何の線か迷わないように */
  const sw=(stroke,dash)=>`<svg width="20" height="8" viewBox="0 0 20 8" style="vertical-align:middle"><line x1="1" y1="4" x2="19" y2="4" stroke="${stroke}" stroke-width="2"${dash?` stroke-dasharray="${dash}"`:""}></line></svg>`;
  const legend=`<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-size:10.5px;color:var(--sub);margin-top:4px">
    <span>${sw(col)} ${T("an.spentLine")}</span>
    ${p.budget>0?`<span>${sw("#9fb0ab","4 4")} ${T("an.budgetLine")}</span>`:""}
    ${showFore?`<span>${sw(col,"3 3")} ${T("an.forecastLine")}</span>`:""}
  </div>`;

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img">
    ${grid}${xaxis}
    <line x1="${padL}" x2="${padL}" y1="${padT}" y2="${padT+plotH}" stroke="#d7dedb" stroke-width="1"></line>
    <line x1="${padL}" x2="${W-padR}" y1="${padT+plotH}" y2="${padT+plotH}" stroke="#d7dedb" stroke-width="1"></line>
    ${budgetLine}${foreLine}
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"></polyline>
    <circle cx="${x(last.day).toFixed(1)}" cy="${y(last.cum).toFixed(1)}" r="3.5" fill="#fff" stroke="${col}" stroke-width="2"></circle>
  </svg>
  ${legend}`;
}

/* 月ごとの推移：収入（緑）と支出（赤）を並べた棒。
   縦＝金額の目もり（万単位）。目もりの決め方は core.js（chartScale）が正。 */
function trendChart(trend){
  const vals=[0];
  trend.forEach(m=>{ vals.push(m.income, m.spend); });
  const sc=Core.chartScale(vals, Core.CHART_TICKS);
  const W=320,H=150,padL=36,padR=8,padT=12,padB=24;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const span=(sc.hi-sc.lo)||1;
  const y=v=>padT+plotH*(1-(v-sc.lo)/span);

  /* 横線（金額の目もり）と、左の数字 */
  const grid=sc.ticks.map(t=>{
    const yy=y(t).toFixed(1);
    return `<line x1="${padL}" x2="${W-padR}" y1="${yy}" y2="${yy}" stroke="#e7ecee" stroke-width="1"></line>`
         + `<text x="${padL-5}" y="${(y(t)+3.4).toFixed(1)}" text-anchor="end" font-size="9.5" fill="#647476">${yenTick(t)}</text>`;
  }).join("");

  /* 月ごとの棒（収入・支出のペア）と、下の月ラベル */
  const n=Math.max(1,trend.length);
  const slot=plotW/n, bw=Math.min(11, slot*0.22), gap=3;
  const baseY=padT+plotH;
  const bar=(cx,v,color)=> v>0
    ? `<rect x="${(cx-bw/2).toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(2,(baseY-y(v))).toFixed(1)}" rx="2.5" fill="${color}"></rect>` : "";
  const cols=trend.map((m,i)=>{
    const cx=padL+slot*(i+0.5);
    return bar(cx-(bw+gap)/2, m.income, "#6f9c78")
         + bar(cx+(bw+gap)/2, m.spend, "#c2694f")
         + `<text x="${cx.toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="9.5" fill="#647476">${escapeHtml(m.label)}</text>`;
  }).join("");

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img">
    ${grid}
    <line x1="${padL}" x2="${padL}" y1="${padT}" y2="${baseY}" stroke="#d7dedb" stroke-width="1"></line>
    <line x1="${padL}" x2="${W-padR}" y1="${baseY}" y2="${baseY}" stroke="#d7dedb" stroke-width="1"></line>
    ${cols}
  </svg>
  <div style="display:flex;gap:12px;justify-content:center;font-size:10.5px;color:var(--sub);margin-top:4px">
    <span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#6f9c78"></span> ${T("sum.income")}</span>
    <span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#c2694f"></span> ${T("sum.spend")}</span>
  </div>`;
}

function diffTag(diff, hadPrev){
  if(!hadPrev) return `<span class="dif eq">${T("an.first")}</span>`;
  if(diff>0) return `<span class="dif up">+${yen(diff)}</span>`;
  if(diff<0) return `<span class="dif dn">−${yen(-diff)}</span>`;
  return `<span class="dif eq">±0</span>`;
}

    ? a.insights.map((s,i)=>{ const icon=s.level==="warn"?"⚠️":s.level==="good"?"🌱":"💡";

  const forecastCard = p.hasIncome

    ${p.periodLabel?`<div class="calcnote" style="margin:-4px 0 10px">${T("an.periodNote",{month:monName,period:p.periodLabel})}</div>`:""}
    <div class="barlist" style="margin-top:0">${insHtml}</div>

    <div class="stitle">${T("an.pace")}</div>

      <div class="sc"><div class="l">${T("an.perDay")}</div><div class="v mono">${yen(p.perDay)}</div></div>
      ${forecastCard}

      ${paceChart(p)}

        ? T("an.budgetNote",{budget:yen(p.budget),income:yen(a.month.incomeTotal),setAside:yen(a.month.setAside),perDay:yen(p.budgetPerDay)})
        : T("an.noIncome")}<br>
        ${T("an.days",{spend:p.spendDays,none:p.noSpendDays})}${p.recurringSoFar>0

/* ---------- カレンダーページ ---------- */
/* カレンダーが表示する「今月」。
   curYM() は家計の区切りキー（起点20日なら 8/2 でも「7月」）を返すので、
   カレンダーには使わない。ここは暦のとおりの月。 */
function calCurYM(){ return ymOf(todayISO()); }
let calYM=calCurYM();       // 表示中の年月 "YYYY-MM"
let calSelected=null;       // 選択中の日付 "YYYY-MM-DD"
let calSeenDay=todayISO();  // 日またぎ検出用（PWAは開いたまま翌日になることがある）
/* 日をまたいでいたら、表示中の月を今月へ合わせ直す。
   calYM は読み込み時に1回だけ決まるため、開いたまま月をまたぐと
   （例：7/31に開いて8/1に見る）カレンダーだけ先月のままになっていた。 */
function calSyncToToday(){
  const now=todayISO();
  if(now===calSeenDay) return false;   // 同じ日のうちは、手で選んだ月をそのまま保つ
  calSeenDay=now;
  calYM=calCurYM();
  calSelected=null;
  return true;
}
function calShift(delta){
  const [y,m]=calYM.split("-").map(Number);
  const d=new Date(y, m-1+delta, 1);
  calYM=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
  calSelected=null;
}
function renderCalendar(){
  calSyncToToday();
  const [y,m]=calYM.split("-").map(Number);
  const first=new Date(y,m-1,1);
  const startDow=first.getDay();               // 0=日
  const days=new Date(y,m,0).getDate();         // 月末日
  const marks=Core.monthMarks(state, calYM);
  const cells=[];
  for(let i=0;i<startDow;i++) cells.push("");
  for(let d=1;d<=days;d++) cells.push(d);
  const dow=[0,1,2,3,4,5,6].map(i=>wd(i));
  const head=dow.map((w,i)=>`<div class="cal-dow" style="color:${i===0?'#c2694f':i===6?'#4f8ac2':'var(--sub)'}">${w}</div>`).join("");
  const body=cells.map(d=>{
    if(d==="") return `<div class="cal-cell empty"></div>`;
    const date=`${calYM}-${pad(d)}`;
    const mk=marks[date]||{};
    const dots=[mk.expense?'<span class="cd" style="background:#c2694f"></span>':'',
                mk.income?'<span class="cd" style="background:#6f9c78"></span>':'',
                mk.diary?'<span class="cd" style="background:#d0a050"></span>':'',
                mk.health?'<span class="cd" style="background:#4f8ac2"></span>':'',
                mk.plan?'<span class="cd" style="background:#8a76c4"></span>':''].join("");
    const isSel=date===calSelected;
    const isToday=date===todayISO();
    return `<div class="cal-cell${isSel?' sel':''}${isToday?' today':''}" data-act="cal-day" data-date="${date}">
      <span class="cal-num">${d}</span><span class="cal-dots">${dots}</span></div>`;
  }).join("");
  let detail="";
  if(calSelected){
    const dd=Core.dayDetail(state, calSelected);
    const md=Core.formatMonthDay(calSelected, state.settings);
    const rows=[];
    dd.income.forEach(t=>{ const c=catOf("income",t.cat);
      rows.push(`<div class="krow" data-act="cal-edit-tx" data-id="${t.id}" style="cursor:pointer"><span>${c.e} ${escapeHtml(t.memo||catN("income",t.cat))}</span><b class="mono inc">+${yen(t.amount)}</b></div>`); });
    dd.expense.forEach(t=>{ const c=catOf("expense",t.cat);
      rows.push(`<div class="krow" data-act="cal-edit-tx" data-id="${t.id}" style="cursor:pointer"><span>${c.e} ${escapeHtml(t.memo||catN("expense",t.cat))}</span><b class="mono">${yen(t.amount)}</b></div>`); });
    dd.plans.forEach(p=>{
      rows.push(`<div class="krow" data-act="cal-edit-plan" data-date="${calSelected}" style="cursor:pointer"><span>📝 ${p.time?`<b class="mono">${p.time}</b> `:""}${escapeHtml(p.text)}${p.done?"（済）":""}</span></div>`); });
    if(dd.diary) rows.push(`<div class="krow" data-act="cal-edit-diary" data-date="${calSelected}" style="cursor:pointer;align-items:flex-start"><span>📖 ${escapeHtml((dd.diary.text||"（写真のみ）").slice(0,40))}</span>${dd.diary.photo?'<span>🖼</span>':''}</div>`);
    if(dd.health){ const h=dd.health; const parts=[];
      if(h.weight!=null) parts.push(`体重 ${h.weight}kg`);
      if(h.bpHigh!=null||h.bpLow!=null) parts.push(`血圧 ${h.bpHigh||"-"}/${h.bpLow||"-"}`);
      rows.push(`<div class="krow" data-act="cal-edit-health" data-date="${calSelected}" style="cursor:pointer"><span>❤️ ${parts.join("・")}</span></div>`); }
    detail=`<div class="stitle">${T("cal.dayTitle",{date:md})}</div><div class="barlist">
      ${rows.length?rows.join(""):`<div class="muted" style="text-align:center;padding:10px;font-size:12.5px">${T("cal.dayEmpty")}</div>`}
      <div style="height:1px;background:var(--line2);margin:8px 0 4px"></div>
      <div class="krow" style="font-weight:800"><span>${T("cal.income")} ${yen(dd.incomeTotal)}${isEn()?" · ":" ／ "}${T("cal.expense")} ${yen(dd.expenseTotal)}</span><b></b></div>
    </div>
    <button class="btn-main" data-act="cal-edit-plan" data-date="${calSelected}" style="margin-top:10px">${T("cal.writePlan")}</button>`;
  }
  return `<div class="screen">
    <div class="cal-head">
      <button class="cal-nav" data-act="cal-prev">‹</button>
      <div class="cal-title">${Core.formatYearMonth(calYM, state.settings)}</div>
      <button class="cal-nav" data-act="cal-next">›</button>
    </div>
    <div class="cal-grid cal-dowrow">${head}</div>
    <div class="cal-grid">${body}</div>
    <div class="cal-legend"><span><span class="cd" style="background:#c2694f"></span>${T("cal.expense")}</span><span><span class="cd" style="background:#6f9c78"></span>${T("cal.income")}</span><span><span class="cd" style="background:#d0a050"></span>${T("cal.diary")}</span><span><span class="cd" style="background:#4f8ac2"></span>${T("cal.health")}</span><span><span class="cd" style="background:#8a76c4"></span>${T("cal.plan")}</span></div>
    ${detail}
  </div>`;
}
