function readSheetInputs(){
  const st=sheetState; if(!st) return;
  const a=$("s-amt"), d=$("s-date"), m=$("s-memo");
  if(a) st.amount=a.value; if(d) st.date=d.value||todayISO(); if(m) st.memo=String(m.value||"").slice(0,Core.MEMO_MAX);
}
function showSheet(on){ $("scrim").classList.toggle("show",on); $("sheet").classList.toggle("show",on);
  if(!on){ releaseOcrImage(sheetState); sheetState=null; clearPending(); } }

/* いま何が起きているかを必ず画面に出す（黙って失敗しない） */
function setStatus(msg){
  if(sheetState){ sheetState.ocrNote=msg; const n=$("ocrnote"); if(n){ n.textContent=msg; return; } }
  toast(msg);
}

/* ---------- カメラ起動でページが再読み込みされても記録を続けられるように ---------- */
const PENDING_KEY="kakeibo:v1:pending";
function savePending(){
  try{
    const st=sheetState; if(!st) return;
    const light={mode:st.mode,id:st.id||null,type:st.type,amount:st.amount,cat:st.cat,date:st.date,memo:st.memo};
    sessionStorage.setItem(PENDING_KEY, JSON.stringify(light));
  }catch(e){}
}
function loadPending(){
  try{ const raw=sessionStorage.getItem(PENDING_KEY); return raw?JSON.parse(raw):null; }catch(e){ return null; }
}
function clearPending(){ try{ sessionStorage.removeItem(PENDING_KEY); }catch(e){} }

/* 写真が届いたのにシートが消えていたら、作り直して必ず受け取る */
function ensureSheetForPhoto(){
  if(sheetState) return;
  const p=loadPending();
  sheetState = p
    ? {mode:p.mode||"add", id:p.id||undefined, type:p.type||"expense", amount:p.amount||"",
       cat:p.cat||"food", date:p.date||todayISO(), memo:p.memo||"", photo:null}
    : {mode:"add", type:"expense", amount:"", cat:"food", date:todayISO(), memo:"", photo:null};
  showSheet(true);
}

/* ---------- 写真＋OCR（任意・失敗しても写真は残る） ---------- */
function onPhotoPicked(file){
  const reader=new FileReader();
  ensureSheetForPhoto();
  const kb=Math.round((file.size||0)/1024);
  setStatus(`写真を受け取りました（${kb}KB / ${file.type||"形式不明"}）。準備中…`);
  reader.onerror=()=>{ setStatus("写真を読み込めませんでした。もう一度おねがいします"); };
  reader.onload=async()=>{
    try{
      setStatus("写真を準備中…");
      /* 表示・保存用は縮小版。読み取り用は高解像度版を別に持つ（保存しない）。 */
      const shrunk=await resizeDataUrl(reader.result, Core.PHOTO_VIEW_MAX, 0.85);
      const hires =await resizeDataUrl(reader.result, Core.PHOTO_OCR_MAX, 0.95);
      ensureSheetForPhoto();
      if(!shrunk || shrunk.length<100){ setStatus("この形式の写真は表示できませんでした。もう一度撮ってください"); return; }
      releaseOcrImage(sheetState);        // 前の写真の高解像度版を先に手放す
      sheetState.photo=shrunk;
      sheetState.photoHi=hires||shrunk;   // メモリ内だけ。localStorageには入れない
      sheetState.crop=Object.assign({},Core.CROP_DEFAULT);
      sheetState.ocrNote="枠を合計に合わせて、読み取りボタンを押してください";
      sheetState.ocrChoices=null;
      clearPending();
      renderSheet(); showSheet(true);
      loadTesseract().catch(()=>{});   // 枠を合わせている間に先読み
    }catch(e){ setStatus("写真を扱えませんでした。金額は手で入れられます"); }
  };
  reader.readAsDataURL(file);
}
/* 写真を指定の長辺まで縮める。保存領域を超えないための要。 */
function resizeDataUrl(src, maxEdge, quality){
  return new Promise((resolve)=>{
    const im=new Image();
    im.onload=()=>{
      try{
        const out=Core.fitSize(im.naturalWidth, im.naturalHeight, maxEdge);
        const cv=document.createElement("canvas"); cv.width=out.w; cv.height=out.h;
        const cx=cv.getContext("2d");
        cx.imageSmoothingEnabled=true; cx.imageSmoothingQuality="high";
        cx.drawImage(im,0,0,out.w,out.h);
        resolve(cv.toDataURL("image/jpeg", quality));
      }catch(e){ resolve(src); }
    };
    im.onerror=()=>resolve(src);
    im.src=src;
  });
}

/* 枠の中だけを切り出して読む。他の金額は物理的に視界に入らない。 */
/* 読み取り用の高解像度画像をメモリから手放す */
function releaseOcrImage(st){
  const t = st || sheetState;
  if(t && t.photoHi){ t.photoHi = null; }
}

async function readCrop(){
  const st=sheetState; if(!st||!st.photo) return;
  st.ocrChoices=null;
  setStatus("画像を調整しています…");
  renderSheet();
  try{
    const crop = st.crop||Core.CROP_DEFAULT;
    const source = st.photoHi || st.photo;

    /* 枠3種 × 画像処理 の切り抜きは、必要になったときだけ1回作って使い回す */
    const cache={};
    const imageFor = async (cropKey, style)=>{
      const key=cropKey+"|"+style;
      if(!cache[key]) cache[key] = await cropToDataUrl(source, Core.cropVariant(crop, cropKey), style);
      return cache[key];
    };

    const candidates=[];
    let runs=0;
    for(let i=0;i<Core.OCR_PLAN.length;i++){
      setStatus(i===0 ? "金額を確認しています…" : "もう少し詳しく確認しています…");
      const jobs=[];
      for(const step of Core.OCR_PLAN[i]){
        jobs.push({ img: await imageFor(step.crop, step.image), psm: step.psm });
      }
      const got = await ocrCandidates(jobs);
      runs += jobs.length;
      got.forEach(c=>candidates.push(c));
      if(Core.ocrEnough(candidates)) break;
    }

    /* 先頭の桁が欠けていそうなら、その1文字だけを画像から読み直す（最大1回） */
    const details = candidates.map(c=>c.detail).filter(Boolean);
    const plan = Core.reconstructionPlan(details, crop);
    const already4 = candidates.some(c=>Number(c.amount)>=1000);
    if(plan && !already4){
      setStatus("先頭の桁を読み直しています…");
      const base = candidates.filter(c=>c.amount===plan.base);
      const agree = base.length || 1;
      const conf  = base.reduce((a,c)=>Math.max(a,Number(c.confidence)||0),0);
      let digits = plan.digits || null;
      if(plan.kind==="strip"){
        try{
          const stripImg = await cropToDataUrl(source, plan.strip, "bw");
          const got = await ocrCandidates([{ img:stripImg, psm:"10" }], { raw:true });
          digits = Core.firstDigit(got);
        }catch(e){ digits = null; }
      }
      const rebuilt = Core.buildReconstructed(plan.base, digits, { confidence:conf, agree:agree, posScore:0.6 });
      if(rebuilt) candidates.push(rebuilt);
    }

    const ranked = Core.rankCandidates(candidates);
    if(!ranked.length){
      st.ocrChoices=null;
      setStatus("枠の中に数字が見つかりませんでした。枠を合計に合わせ直すか、金額を入れてね");
      renderSheet(); return;
    }
    if(Core.needsConfirmation(ranked)){
      st.ocrChoices = ranked.slice(0, Core.MAX_CHOICES).map(r=>r.amount);
      setStatus("どれが合計か選んでください");
      renderSheet(); return;
    }
    st.ocrChoices=null;
    st.amount=String(ranked[0].amount);
    setStatus(`金額を「${yen(ranked[0].amount)}」と読みました。ちがう時は直してね`);
    renderSheet();
  }catch(e){
    const why=(e&&e.message)?e.message:String(e||"原因不明");
    st.ocrChoices=null;
    setStatus(`読み取れませんでした：${why}。金額は手で入れられます`);
    renderSheet();
  }finally{
    /* 高解像度画像はここでは解放しない。
       枠を直してもう一度読み取るとき、表示用(1600px)へ落ちてしまうため。
       解放するのは：シートを閉じた時／写真を消した時／写真を撮り直した時／記録を確定した時。
       加工画像 cache はこの関数のローカル変数なので、抜ければ参照が消える。 */
  }
}

/* 枠の範囲を切り出し、拡大＋白黒コントラスト調整をしてから渡す */
function cropToDataUrl(src, crop, style){
  return new Promise((resolve,reject)=>{
    const im=new Image();
    im.onload=()=>{
      try{
        const nat={w:im.naturalWidth, h:im.naturalHeight};
        const r=Core.cropRect(crop, nat);
        const out=Core.cropOutputSize(r.w, r.h);
        const cv=document.createElement("canvas"); cv.width=out.w; cv.height=out.h;
        const cx=cv.getContext("2d");
        cx.imageSmoothingEnabled=true; cx.imageSmoothingQuality="high";
        cx.drawImage(im, r.x, r.y, r.w, r.h, 0, 0, out.w, out.h);
        try{
          const d=cx.getImageData(0,0,out.w,out.h);
          Core.prepareForOcr(d.data, out.w, out.h, style);  // 反転の判断もここ1か所だけ
          cx.putImageData(d,0,0);
        }catch(e){}
        resolve(cv.toDataURL("image/png"));
      }catch(e){ reject(e); }
    };
    im.onerror=reject;
    im.src=src;
  });
}

/* 読み取りライブラリの取得先。
   ①自分のサーバー（tess/ に置いた場合）→ ②jsDelivr → ③unpkg の順に試す。
   ①があれば外部CDNに一切依存せず、オフラインでも動く。 */
const TESSERACT_VERSION = "5.1.1";   // 完全固定（@5 のような範囲指定にしない）
const TESS_LOCAL_DIR = "./tess";
const TESSERACT_SOURCES = [
  { name:"この端末のサーバー", url: TESS_LOCAL_DIR + "/tesseract.min.js", local:true },
  /* 版は完全固定。jsDelivr と unpkg で同じ版を使う。
     worker / core / 言語データも、この版に付属するものが使われる。 */
  { name:"jsDelivr",          url:"https://cdn.jsdelivr.net/npm/tesseract.js@" + TESSERACT_VERSION + "/dist/tesseract.min.js" },
  { name:"unpkg",             url:"https://unpkg.com/tesseract.js@" + TESSERACT_VERSION + "/dist/tesseract.min.js" }
];
let tessSource=null;

/* 外部スクリプトを読み込む。読み込み完了かエラーかを必ず返す。 */
function loadScript(src){
  return new Promise((resolve,reject)=>{
    const existing=document.querySelector(`script[data-src="${src}"]`);
    if(existing){
      if(existing.dataset.loaded==="1") return resolve();
      existing.addEventListener("load",()=>resolve());
      existing.addEventListener("error",()=>reject(new Error("読み込み失敗")));
      return;
    }
    const el=document.createElement("script");
    el.src=src; el.async=true; el.dataset.src=src;
    el.onload=()=>{ el.dataset.loaded="1"; resolve(); };
    el.onerror=()=>reject(new Error("読み込み失敗"));
    document.head.appendChild(el);
  });
}

async function loadTesseract(){
  if(window.Tesseract) return window.Tesseract;
  const tried=[];
  for(const src of TESSERACT_SOURCES){
    try{
      await loadScript(src.url);
      if(window.Tesseract){ tessSource=src; return window.Tesseract; }
      tried.push(src.name+"：取得できたが中身が違う");
    }catch(e){ tried.push(src.name+"："+((e&&e.message)?e.message:"つながらない")); }
  }
  const online = (typeof navigator!=="undefined" && "onLine" in navigator) ? (navigator.onLine?"通信あり":"オフライン") : "通信状態不明";
  throw new Error(
    "初回のレシート読み取りにはインターネット接続が必要です。読み取れない場合は金額を手入力してください" +
    `（${online}／${tried.join(" ／ ")}）`
  );
}

/* 自前で置いた場合は、部品の場所も自分のサーバーに向ける */
function tessWorkerOptions(){
  if(tessSource && tessSource.local){
    return {
      workerPath: TESS_LOCAL_DIR + "/worker.min.js",
      corePath:   TESS_LOCAL_DIR + "/core",
      langPath:   TESS_LOCAL_DIR + "/lang"
    };
  }
  return {};
}

/* 数字だけを読む設定で、渡された「画像 × 読み取り方」の組を順に試す。
   偶然の誤読は重ならないので、同じ数字が複数回出たものを採用する。 */
async function ocrCandidates(jobs, opts){
  const T = await loadTesseract();
  const out=[];
  let worker=null;
  try{
    worker=await T.createWorker("eng", 1, Object.assign({}, tessWorkerOptions(), {
      logger: m=>{
        if(m && m.status && typeof m.progress==="number"){
          const pct=Math.round(m.progress*100);
          if(m.status.indexOf("load")>=0||m.status.indexOf("initial")>=0) setStatus(`読み取りの準備中… ${pct}%（初回だけ少し時間がかかります）`);
          else if(m.status.indexOf("recogniz")>=0) setStatus(`読み取り中… ${pct}%`);
        }
      }
    }));
    for(const job of jobs){
      try{
        await worker.setParameters({
          tessedit_pageseg_mode: job.psm,
          tessedit_char_whitelist: (opts&&opts.raw) ? "0123456789" : "0123456789,.¥￥"
        });
        const { data } = await worker.recognize(job.img);
        const conf = data.confidence||0;
        if(opts&&opts.raw){ out.push({ text:data.text, confidence:conf }); continue; }
        Core.amountDetails(data.text).forEach(d=>{
          out.push({
            amount:d.amount, raw:d.raw, confidence:conf,
            posScore:Core.textPositionScore(d),
            context:Core.totalHint(d),                 // ¥ / カンマ / 合計 などの手がかり
            truncated:!!Core.truncatedLeading(d),      // 先頭の桁が欠けている疑い
            detail:d,
            source:"ocr",
          });
        });
      }catch(e){}
    }
  } finally { if(worker){ try{ await worker.terminate(); }catch(e){} } }
  return out;
}

/* 枠のドラッグ（移動／左上・右下でサイズ変更）
   注意：setPointerCapture を画像全体にかけると、指を離したあとも
   タップが画像に吸われてボタンが押せなくなる。ドラッグ中だけ
   document で受けて、終わったら必ず外す。 */
function initCrop(){
  const wrap=$("cropwrap"), box=$("cropbox");
  if(!wrap||!box||!sheetState) return;
  const st=sheetState;
  if(!st.crop) st.crop=Object.assign({},Core.CROP_DEFAULT);
  const apply=()=>{ box.style.left=(st.crop.x*100)+"%"; box.style.top=(st.crop.y*100)+"%";
    box.style.width=(st.crop.w*100)+"%"; box.style.height=(st.crop.h*100)+"%"; };
  apply();

  let mode=null, start=null;

  const onMove=e=>{
    if(!mode||!start) return;
    const dx=(e.clientX-start.px)/start.w, dy=(e.clientY-start.py)/start.h;
    st.crop=Core.moveCrop(start.c, dx, dy, mode);
    apply();
    if(e.cancelable) e.preventDefault();
  };
  const onEnd=()=>{
    mode=null; start=null;
    document.removeEventListener("pointermove",onMove);
    document.removeEventListener("pointerup",onEnd);
    document.removeEventListener("pointercancel",onEnd);
  };

  wrap.addEventListener("pointerdown",e=>{
    const t=e.target;
    if(t.classList&&t.classList.contains("br")) mode="br";
    else if(t.classList&&t.classList.contains("tl")) mode="tl";
    else if(t===box) mode="move";
    else return;                      // 枠の外は無視（他のボタンを邪魔しない）
    const r=wrap.getBoundingClientRect();
    start={px:e.clientX, py:e.clientY, c:Object.assign({},st.crop), w:r.width||1, h:r.height||1};
    document.addEventListener("pointermove",onMove,{passive:false});
    document.addEventListener("pointerup",onEnd);
    document.addEventListener("pointercancel",onEnd);
    if(e.cancelable) e.preventDefault();
  });
}

/* ---------- 保存アクション ---------- */
async function saveTx(){
  readSheetInputs(); const st=sheetState;
  /* ＝ を押さずに「記録する」を押しても、待っている計算を済ませてから記録する */
  if(st.calc && st.calc.op) st.amount=String(Core.calcValue(st.calc));
  const amount=parseInt(String(st.amount).replace(/[^\d]/g,""),10);
  if(!amount||amount<=0){ toast("金額を入れてね"); const ai=$("s-amt"); if(ai) ai.focus(); return; }

  /* 保存用に写真を小さくする（そのままだと保存領域を超えて何も残らない）。
     読み取り用の高解像度画像は、保存が成功してから手放す。
     ここで手放すと、保存に失敗してシートが残ったとき、
     枠を直して読み直すと表示用(1600px)へ落ちてしまう。 */
  let photo = st.photo || null;
  if(photo) photo = await resizeDataUrl(photo, Core.PHOTO_STORE_MAX, 0.6);

  /* 「毎月固定」は支出だけの印。収入に切り替えていたら必ず落とす。 */
  const recurring = st.type==="expense" && st.recurring===true;

  const before = JSON.stringify(state.tx);
  if(st.mode==="edit"){
    const t=state.tx.find(x=>x.id===st.id);
    if(t){ t.type=st.type; t.amount=amount; t.cat=st.cat; t.date=st.date; t.memo=st.memo; t.photo=photo;
           if(recurring) t.recurring=true; else delete t.recurring; }
  } else {
    const rec={id:uid(),type:st.type,amount,cat:st.cat,date:st.date,memo:st.memo,photo:photo};
    if(recurring) rec.recurring=true;   // オフのときはキーごと持たない（保存を軽くする）
    state.tx.push(rec);
  }

  if(save()){
    releaseOcrImage(st);            // 記録が確定した。高解像度はここで手放す
    showSheet(false); render(); toast(st.mode==="edit"?"更新しました":"記録できました ✓");
    return;
  }

  /* 入りきらなかった。写真だけ落として、記録そのものは必ず残す。 */
  if(photo){
    const t2 = st.mode==="edit" ? state.tx.find(x=>x.id===st.id) : state.tx[state.tx.length-1];
    if(t2) t2.photo=null;
    if(save()){
      releaseOcrImage(st);          // 写真は諦めたが記録は確定した
      showSheet(false); render();
      toast("記録しました（写真は容量オーバーで保存できません）");
      return;
    }
  }

  /* それでも駄目なら元に戻して、理由をはっきり伝える。
     シートは開いたままなので、photoHi は解放しない（枠を直して読み直せるように）。 */
  state.tx = JSON.parse(before);
  const msg = isQuotaError(lastSaveError)
    ? "保存できません。せっていの「写真をすべて消す」で空きを作ってください"
    : "この端末では保存が使えません（プライベートブラウズ等）";
  toast(msg);
}

function delTx(){
  if(!sheetState||sheetState.mode!=="edit") return;
  const before = JSON.parse(JSON.stringify(state.tx));   // 失敗したら戻せるように退避
  state.tx = state.tx.filter(t=>t.id!==sheetState.id);
  if(!save()){
    state.tx = before;            // 消えたように見えて復活する、を防ぐ
    toast("削除できませんでした");
    return;                       // 編集シートは閉じない
  }
  showSheet(false); render(); toast("削除しました");
}

/* 予定を1件足す。保存に失敗したら、足す前に完全に戻す。 */
function addPlan(date){
  if(!date) return;
  const text=($("p-text")?$("p-text").value:"").trim();
  if(!text){ toast("予定を書いてください"); focusField("p-text"); return; }
  const before=JSON.parse(JSON.stringify(state.plans||{}));
  const list=(state.plans[date]||[]).slice();
  if(list.length>=Core.PLAN_PER_DAY_MAX){ toast(`1日に入れられるのは ${Core.PLAN_PER_DAY_MAX}件までです`); return; }
  list.push({ id:uid(), time:Core.normalizeTimeString($("p-time")?$("p-time").value:""),
              text:text.slice(0,Core.PLAN_TEXT_MAX), done:false });
  state.plans[date]=Core.sortPlans(list);
  if(!save()){ state.plans=before; toast("予定を保存できませんでした"); render(); return; }
  toast("予定を入れました ✓"); render();
}

/* 予定を1件消す */
function delPlan(date, id){
  if(!date||!id||!state.plans[date]) return;
  const before=JSON.parse(JSON.stringify(state.plans));
  state.plans[date]=state.plans[date].filter(p=>p.id!==id);
  if(!state.plans[date].length) delete state.plans[date];
  if(!save()){ state.plans=before; toast("消せませんでした"); }
  render();
}

/* 済み／未済を切り替える */
function togglePlan(date, id){
  if(!date||!id||!state.plans[date]) return;
  const before=JSON.parse(JSON.stringify(state.plans));
  state.plans[date]=state.plans[date].map(p=> p.id===id ? Object.assign({}, p, {done:!p.done}) : p);
  if(!save()){ state.plans=before; toast("保存できませんでした"); }
  render();
}

function saveSettings(){
  const g=id=>{ const el=$(id); return el?el.value:""; };
  const num=v=>{ const n=parseInt(String(v).replace(/[^\d]/g,""),10); return isNaN(n)?0:n; };

  /* 保存に失敗したときのために、変更前の設定をまるごと退避する */
  const before = JSON.parse(JSON.stringify(state.settings));

  const s=Object.assign({}, state.settings);
  s.savingsTarget=num(g("f-save"));
  s.nisaMonthly=num(g("f-nisa")); s.goalName=(g("f-gname")||"").slice(0,24);
  s.goalTarget=num(g("f-gtarget")); s.goalCurrent=num(g("f-gcur"));
  s.cycleStart=Core.normalizeCycleStart(g("f-cycle"));
  /* normalizeSettings が新しい設定オブジェクトを返すので、旧フィールドはここで消える */
  state.settings = Core.normalizeSettings(s);

  if(!save()){
    state.settings = before;      // 画面と保存データが食い違わないよう完全に戻す
    toast("設定を保存できませんでした");
    return;                       // 設定画面は閉じない
  }
  toast("保存しました ✓"); view="home"; render();
}

/* ---------- 連携：ライフプラン形式の月次スナップショット ---------- */
function buildSnapshot(){
  return Core.buildSnapshot(state.settings, state.tx, curYM());
}
function exportSnapshot(){
  const snap=buildSnapshot(); const text=JSON.stringify(snap,null,2);
  downloadText(`lifeplan-snapshot-${snap.year_month}.json`, text);
  toast("連携データを書き出しました 📤");
}
function purgePhotos(){
  const n=state.tx.filter(t=>t.photo).length;
  if(!n){ toast("消せる写真はありません"); return; }   // 保存処理そのものを行わない
  const before = JSON.parse(JSON.stringify(state.tx)); // 失敗したら戻せるように退避
  state.tx.forEach(t=>{ t.photo=null; });
  if(!save()){
    state.tx = before;            // 写真をすべて元へ戻す
    toast("写真を消せませんでした");
    return;                       // 再描画しない
  }
  render(); toast(`写真${n}枚を消しました（記録は残っています）`);
}
function exportBackup(){
  downloadText(`kakeibo-backup-${todayISO()}.json`, JSON.stringify(Core.buildBackup(state), null, 2));
  toast("バックアップを書き出しました");
}

/* --- バックアップの読み込み（復元） --- */
function pickBackup(){ const el=$("backupInput"); if(el){ el.value=""; el.click(); } }

function onBackupPicked(file){
  const el=$("backupInput");
  const clear=()=>{ if(el) el.value=""; };   // 同じファイルをもう一度選べるようにする
  if(!file){ clear(); return; }
  const reader=new FileReader();
  reader.onerror=()=>{ toast("ファイルを読み込めませんでした"); clear(); };
  reader.onload=()=>{
    let restored;
    try{
      const raw = Core.parseBackupJson(reader.result);
      restored = Core.normalizeBackup(raw);         // ここで壊れた値を安全な形に整える
    }catch(e){
      toast(`読み込めません：${(e&&e.message)||"形式が違います"}`);
      clear(); return;                              // 現在のデータは一切変更しない
    }

    const ok = confirm(
      "現在のデータを上書きします。\n先にバックアップを書き出すことをおすすめします。\n\n" +
      `復元する記録：${restored.tx.length}件` +
      (restored.dropped ? `（読み取れなかった${restored.dropped}件は除外）` : "") +
      "\n\n続けますか？"
    );
    if(!ok){ clear(); return; }                     // キャンセル：何も変えない

    const before = JSON.parse(JSON.stringify(state));
    state.settings = restored.settings;
    state.tx = restored.tx;
    state.health = restored.health || {};
    state.diary = restored.diary || {};
    if(!save()){
      state = before;                               // 保存できないなら元のまま
      toast("バックアップを復元できませんでした");
      clear(); return;
    }
    view="home"; render();
    toast(`バックアップを復元しました（${restored.tx.length}件）`);
    clear();
  };
  reader.readAsText(file);
}
function downloadText(name,text){
  const blob=new Blob([text],{type:"application/json"}); const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },500);
}

function focusField(id){
  if(!id) return;
  setTimeout(()=>{ const el=$(id); if(!el) return;
    el.scrollIntoView({block:"center",behavior:"smooth"});
    try{ el.focus({preventScroll:true}); }catch(e){ el.focus(); } }, 60);
}

/* ---------- ちいさなUI ---------- */
let toastT=null;
function toast(msg){ const el=$("toast"); el.innerHTML=`<span class="ck">✓</span>${escapeHtml(msg).replace("✓","")}`;
  el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),1900); }
function escapeHtml(s){ return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function escapeAttr(s){ return escapeHtml(s).replace(/"/g,"&quot;"); }

/* ---------- イベント（委譲） ---------- */
document.addEventListener("click",e=>{
  const nav=e.target.closest("#nav button"); if(nav){ showSheet(false); view=nav.dataset.nav; render(); return; }
  const go=e.target.closest("[data-go]"); if(go){ showSheet(false); view=go.dataset.go; render(); focusField(go.dataset.focus); return; }
  const pick=e.target.closest("[data-pick]");
  if(pick&&sheetState){ readSheetInputs();
    sheetState.amount=String(pick.dataset.pick);
    sheetState.calc=Core.calcFrom(sheetState.amount);
    sheetState.ocrChoices=null;
    sheetState.ocrNote="金額を入れました。内容を確かめて「記録する」を押してください";
    renderSheet(); return; }
  const act=e.target.closest("[data-act]"); if(act){ handleAct(act.dataset.act,e); return; }
  const edit=e.target.closest("[data-edit]"); if(edit){ openRecord(edit.dataset.edit); return; }
  const type=e.target.closest("[data-type]"); if(type&&sheetState){ readSheetInputs(); sheetState.type=type.dataset.type; renderSheet(); return; }
  const cat=e.target.closest("[data-cat]"); if(cat&&sheetState){ readSheetInputs(); sheetState.cat=cat.dataset.cat; renderSheet(); return; }
  if(e.target.id==="scrim") showSheet(false);
});
function handleAct(a,e){
  if(a==="open-record") return openRecord(null);
  if(a==="close-sheet") return showSheet(false);
  if(a==="save-tx") return saveTx();
  if(a==="del-tx") return delTx();
  if(a==="rm-photo"){ if(sheetState){ readSheetInputs(); releaseOcrImage(sheetState); sheetState.photo=null; sheetState.crop=null; sheetState.ocrNote=""; sheetState.ocrChoices=null; renderSheet(); } return; }
  if(a==="shot-total"){ readSheetInputs(); savePending(); $("camInput").value=""; $("camInput").click(); return; }
  if(a==="read-crop"){ readSheetInputs(); return readCrop(); }
  if(a==="manual-amount"){ if(sheetState){ readSheetInputs(); sheetState.ocrChoices=null;
      sheetState.ocrNote="金額を入れてください"; renderSheet(); focusField("s-amt"); } return; }
  if(a==="calc"){
    if(!sheetState) return;
    const el=e&&e.target&&e.target.closest("[data-key]");
    if(!el) return;
    readSheetInputs();                       // 日付・メモの打ちかけを失わない
    sheetState.calc=Core.calcPress(sheetState.calc, el.dataset.key);
    sheetState.amount=Core.calcDisplay(sheetState.calc);
    renderSheet(); return;
  }
  if(a==="sci"){
    const el=e&&e.target&&e.target.closest("[data-key]"); if(!el) return;
    const before=sci();
    sciState=Core.sciPress(before, el.dataset.key);
    /* 履歴が増えたときだけ端末に残す */
    if(sciState.history.length!==before.history.length){
      state.calcHistory=sciState.history.slice();
      if(!save()){ state.calcHistory=before.history.slice(); toast("履歴を保存できませんでした"); }
    }
    render(); return;
  }
  if(a==="sci-use"){
    const el=e&&e.target&&e.target.closest("[data-i]"); if(!el) return;
    const h=sci().history[Number(el.dataset.i)];
    if(!h) return;
    sciState=Object.assign({}, sci(), { tokens:String(h.expr).split(""), result:null, error:"" });
    render(); return;
  }
  if(a==="sci-clear"){
    const before=sci();
    sciState=Core.sciClearHistory(before);
    state.calcHistory=[];
    if(!save()){ state.calcHistory=before.history.slice(); sciState=before; toast("消せませんでした"); }
    render(); return;
  }
  if(a==="sci-record"){
    const amount=Core.sciAmount(sci());
    if(amount===null){ toast("先に ＝ を押してください"); return; }
    openRecord(null);
    sheetState.amount=String(amount);
    sheetState.calc=Core.calcFrom(amount);
    renderSheet(); return;
  }
  if(a==="save-settings") return saveSettings();
  if(a==="export-snapshot") return exportSnapshot();
  if(a==="export-backup") return exportBackup();
  if(a==="purge-photos") return purgePhotos();
  if(a==="import-backup") return pickBackup();
  if(a==="save-health") return saveHealth();
  if(a==="cal-prev"){ calShift(-1); render(); return; }
  if(a==="cal-next"){ calShift(1); render(); return; }
  if(a==="cal-day"){ const el=e&&e.target&&e.target.closest("[data-date]"); const d=el&&el.dataset.date; calSelected=(calSelected===d?null:d); render(); return; }
  if(a==="cal-edit-tx"){ const el=e&&e.target&&e.target.closest("[data-id]"); const id=el&&el.dataset.id; if(id) openRecord(id); return; }
  if(a==="cal-edit-diary"){ const el=e&&e.target&&e.target.closest("[data-date]"); diaryEditDate=el&&el.dataset.date; diaryPhotoPending=undefined; view="diary"; render(); return; }
  if(a==="cal-edit-health"){ view="health"; render(); return; }
  if(a==="save-diary") return saveDiary();
  if(a==="plan-add"){ const el=e&&e.target&&e.target.closest("[data-date]"); return addPlan(el&&el.dataset.date); }
  if(a==="plan-del"){ const el=e&&e.target&&e.target.closest("[data-id]"); return delPlan(el&&el.dataset.date, el&&el.dataset.id); }
  if(a==="plan-toggle"){ const el=e&&e.target&&e.target.closest("[data-id]"); return togglePlan(el&&el.dataset.date, el&&el.dataset.id); }
  if(a==="cal-edit-plan"){ const el=e&&e.target&&e.target.closest("[data-date]");
    diaryEditDate=(el&&el.dataset.date)||null; diaryPhotoPending=undefined; view="diary"; render();
    focusField("p-text"); return; }
  if(a==="new-diary"){ diaryEditDate=null; diaryPhotoPending=undefined; render(); return; }
  if(a==="edit-diary"){ const el=e&&e.target&&e.target.closest("[data-date]"); diaryEditDate=(el&&el.dataset.date)||null; diaryPhotoPending=undefined; render(); return; }
  if(a==="add-diary-photo"){ const el=$("diaryPhotoInput"); if(el){ el.value=""; el.click(); } return; }
  if(a==="rm-diary-photo"){ diaryPhotoPending=null; render(); return; }
  if(a==="toggle-recurring"){ if(sheetState){ readSheetInputs(); sheetState.recurring=!sheetState.recurring; renderSheet(); } return; }
  if(a==="task"){ const el=e&&e.target&&e.target.closest("[data-task]"); if(el) goTask(el.dataset.task); return; }
  if(a==="carry-recurring") return carryRecurring();
  if(a==="sum-tab"){ const el=e&&e.target&&e.target.closest("[data-tab]"); sumTab=(el&&el.dataset.tab)||"month"; render(); return; }
  if(a==="health-range"){ const el=e&&e.target&&e.target.closest("[data-range]"); healthRange=(el&&el.dataset.range)||"month"; render(); return; }
}
$("camInput").addEventListener("change",e=>{ const f=e.target.files&&e.target.files[0]; if(f) onPhotoPicked(f); });
$("backupInput").addEventListener("change",e=>{ onBackupPicked(e.target.files&&e.target.files[0]); });
$("diaryPhotoInput").addEventListener("change",e=>{ const f=e.target.files&&e.target.files[0]; if(!f) return;
  const tEl=$("d-text"); const keepText=tEl?tEl.value:"";   // 入力中の本文を失わない
  const r=new FileReader();
  r.onload=()=>{ diaryPhotoPending=r.result;
    const cur=state.diary[diaryEditDate||todayISO()]||{}; cur.text=keepText;   // 本文を保って再描画
    render(); const t2=$("d-text"); if(t2) t2.value=keepText; };
  r.onerror=()=>toast("写真を読み込めませんでした");
  r.readAsDataURL(f);
});

/* ---------- 起動 ---------- */
render();
/* カメラでページが再読み込みされた場合、記録の途中から戻す */
(function restorePending(){
  const p=loadPending(); if(!p) return;
  sheetState={mode:p.mode||"add", id:p.id||undefined, type:p.type||"expense", amount:p.amount||"",
              cat:p.cat||"food", date:p.date||todayISO(), memo:p.memo||"", photo:null,
              ocrNote:"カメラから戻りました。もう一度「レシートを撮る」を押してください"};
  renderSheet(); showSheet(true);
})();
/* --- SW-REGISTRATION-START ---
   iPhone の Safari は sw.js 自体をキャッシュすることがあり、
   放っておくと古い画面・古い core.js がいつまでも残る。
     ・updateViaCache:"none" で sw.js を必ず取り直す
     ・登録直後に update() で更新確認を明示する
     ・新しい Service Worker に切り替わったら画面を1回だけ読み直す
     ・再読み込み済みの印を必ず持ち、繰り返しを防ぐ
     ・初めて開いた人（もともと controller が無い人）は読み直さない。
       初回登録でも controllerchange は発火するため、そのままだと
       余計なリロードが1回入ってしまう。                      */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", async () => {
    try {
      // 登録する前に「すでに Service Worker に制御されていたか」を控えておく
      const hadController = !!navigator.serviceWorker.controller;

      const registration = await navigator.serviceWorker.register("./sw.js", {
        updateViaCache: "none"
      });

      await registration.update();

      let refreshing = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (!hadController) return;  // ← 初回登録。更新ではないので読み直さない
        if (refreshing) return;      // ← 無限に読み直さないための印
        refreshing = true;
        window.location.reload();
      });
    } catch (error) {
      console.error("Service Worker registration failed:", error);
    }
  });
}
/* --- SW-REGISTRATION-END --- */

/* テスト用フック（本番挙動には影響しない） */
