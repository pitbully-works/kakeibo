<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="かけいぼ">
<meta name="theme-color" content="#3f826a">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>かけいぼ ― 夢に近づく家計簿</title>
<style>
  :root{
    --bg:#f4f7f5; --card:#ffffff; --ink:#1e2a28; --sub:#647476; --line:#e7ecee; --line2:#eef2f0;
    --green:#6fa88a; --green-d:#3f826a; --green-dd:#356e59; --green-l:#e6f1eb;
    --sage:#8fbf7f; --gold:#d9a54f; --gold-d:#b4842f; --gold-l:#f8efd9;
    --blue:#4fa8d8; --blue-l:#e4f1f9; --amber:#e0972b; --amber-l:#fbeed4;
    --terra:#c2694f; --terra-l:#f6e5df; --pink:#e2739a; --pink-l:#fbe8f0;
    --shadow:0 1px 3px rgba(20,40,38,.05),0 10px 26px rgba(20,40,38,.07);
    --radius:16px; --nav-h:64px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
    color:var(--ink);background:var(--bg);line-height:1.7;font-size:16px;-webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none}
  .mono{font-family:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,"Roboto Mono",monospace;letter-spacing:-.02em}
  button{font-family:inherit;cursor:pointer;border:0;background:none}
  input,select,textarea{font-family:inherit;font-size:16px}

  #app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;
    padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 8px)}
  .screen{padding:16px 16px 8px;animation:fadein .28s cubic-bezier(.2,.7,.3,1)}
  @keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* top greeting */
  .greet{padding:10px 4px 2px}
  .greet .g{font-size:12.5px;color:var(--sub);font-weight:700}
  .greet .date{font-size:27px;font-weight:800;line-height:1.25;letter-spacing:-.01em;margin-top:1px}
  .greet .date .wd{font-size:17px;margin-left:4px;color:var(--sub)}
  .greet .d{font-size:12px;color:var(--sub);margin-top:1px}

  /* hero */
  .hero{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 18px 18px;text-align:center;box-shadow:var(--shadow);margin-top:8px}
  .hero .l{font-size:13px;color:var(--sub)}
  .hero .n{font-size:44px;font-weight:800;color:var(--green-d);line-height:1.12;margin:4px 0;word-break:keep-all}
  .hero .n.amber{color:var(--amber)}
  .hero .n.over{color:var(--terra)}
  .hero .u{font-size:12.5px;color:var(--sub);min-height:18px}
  .hero .ok{display:inline-block;margin-top:8px;font-size:12px;border-radius:999px;padding:5px 14px;font-weight:800}
  .hero .ok.good{background:var(--green-l);color:var(--green-d)}
  .hero .ok.warn{background:var(--amber-l);color:var(--amber)}
  .hero .ok.over{background:var(--terra-l);color:var(--terra)}
  .heromini{display:flex;gap:8px;padding:10px 14px 0;justify-content:center;flex-wrap:wrap}
  .heromini .m{font-size:11px;color:var(--sub);background:#f6f8f7;border-radius:9px;padding:5px 9px}
  .heromini .m b{color:var(--ink);font-weight:800}

  /* dream strip */
  .dreamlbl{text-align:center;font-size:10px;color:#9aa6a3;margin:16px 0 6px;letter-spacing:.05em}
  .dreamstrip{display:flex;gap:8px}
  .ds{flex:1;min-width:0;border-radius:14px;padding:10px 8px 11px;text-align:center;background:var(--card);border:1px solid var(--line);
    transition:transform .12s cubic-bezier(.2,.7,.3,1)}
  .ds:active{transform:scale(.97)}
  .ds .tapin{font-size:9px;color:#a7b2af;margin-top:5px}
  .ds .di{font-size:16px}
  .ds .dk{font-size:9.5px;color:var(--sub);margin-top:2px}
  .ds .dv{font-size:12.5px;font-weight:800;white-space:nowrap;margin-top:1px}
  .ds.gold .dv{color:var(--gold-d)}.ds.blue .dv{color:#2f7fad}.ds.green .dv{color:var(--green-d)}
  .ds .track{height:5px;background:#ecefed;border-radius:3px;overflow:hidden;margin-top:7px}
  .ds .track>i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#e7c06f,var(--gold));transition:width .5s cubic-bezier(.2,.7,.3,1)}

  /* big record button */
  .recordbtn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;margin-top:18px;
    background:var(--green-d);color:#fff;border-radius:18px;padding:17px;font-size:16.5px;font-weight:800;
    box-shadow:0 8px 18px rgba(63,130,106,.32);transition:transform .12s cubic-bezier(.2,.7,.3,1)}
  .recordbtn:active{transform:scale(.975)}
  .subrow{display:flex;justify-content:center;gap:26px;margin-top:14px}
  .subrow button{font-size:12.5px;color:var(--green-d);font-weight:700;display:flex;align-items:center;gap:5px}

  /* section titles */
  .stitle{font-size:13px;font-weight:800;color:var(--sub);margin:20px 4px 8px}

  /* records list */
  .daygroup{margin-bottom:14px}
  .dayhd{font-size:11.5px;color:var(--sub);font-weight:700;padding:0 4px 6px;display:flex;justify-content:space-between}
  .txcard{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .tx{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line2)}
  .tx:last-child{border-bottom:0}
  .tx .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex:0 0 auto;background:#f4f7f5}
  .tx .mid{flex:1;min-width:0}
  .tx .t1{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tx .t2{font-size:11px;color:var(--sub)}
  .tx .amt{font-size:15px;font-weight:800;white-space:nowrap}
  .tx .amt.exp{color:var(--ink)}
  .tx .amt.inc{color:var(--green-d)}

  .empty{text-align:center;color:var(--sub);font-size:13.5px;padding:34px 16px;background:var(--card);border:1px dashed var(--line);border-radius:16px}
  .empty .e{font-size:30px;display:block;margin-bottom:8px}

  /* summary */
  /* 横1列に4枚並べると、金額が長い月に右端がはみ出して切れる。
     枚数に関係なく収まるよう、2列のグリッドで折り返す。 */
  .sumcards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .sc{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px 12px;text-align:center}
  .sc .l{font-size:10.5px;color:var(--sub)}
  .sc .v{font-size:18px;font-weight:800;margin-top:2px;overflow-wrap:anywhere}
  /* 3枚のときは、最後の1枚を横いっぱいに（2枚＋1枚で座りをよくする） */
  .sumcards.three .sc:last-child{grid-column:1 / -1}
  .sc .v.inc{color:var(--green-d)}.sc .v.exp{color:var(--terra)}.sc .v.net{color:var(--gold-d)}
  .barlist{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin-top:12px}
  .brow{display:flex;align-items:center;gap:9px;margin:9px 0;font-size:12px}
  .brow .bt{width:64px;flex:0 0 auto;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brow .track{flex:1;height:10px;background:#eef1ef;border-radius:6px;overflow:hidden}
  .brow .fill{display:block;height:100%;border-radius:6px}
  .brow .bv{width:58px;text-align:right;flex:0 0 auto;font-weight:800}
  .segbtns{display:flex;background:#eaeeec;border-radius:12px;padding:3px;margin:4px 0 2px}
  .segbtns button{flex:1;padding:8px;border-radius:9px;font-size:13px;font-weight:800;color:var(--sub)}
  .segbtns button.on{background:#fff;color:var(--green-d);box-shadow:0 1px 3px rgba(0,0,0,.06)}

  /* settings */
  .field{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .field label{font-size:12px;color:var(--sub);font-weight:700;display:block;margin-bottom:4px}
  .field .row{display:flex;align-items:center;gap:8px}
  .field .yen{font-size:16px;color:var(--sub);font-weight:800}
  .field input,.field select{width:100%;border:0;border-bottom:2px solid var(--line);padding:6px 2px;background:transparent;font-weight:700;color:var(--ink);outline:none}
  .field input:focus,.field select:focus{border-color:var(--green)}
  .field input.mono{font-size:20px}
  .fhelp{font-size:11px;color:var(--sub);margin-top:5px}
  .savebar{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding-top:8px}
  .btn-primary{width:100%;background:var(--green-d);color:#fff;border-radius:15px;padding:15px;font-size:15.5px;font-weight:800;box-shadow:0 6px 14px rgba(63,130,106,.28)}
  .btn-ghost{width:100%;background:#fff;color:var(--green-d);border:1.5px solid #bfe0d3;border-radius:15px;padding:13px;font-size:14px;font-weight:800;margin-top:8px}
  .btn-quiet{width:100%;color:var(--sub);font-size:12.5px;padding:10px;font-weight:700;margin-top:2px}

  /* bottom nav */
  /* 下のタブ。iOSでは、半透明＋ぼかし（backdrop-filter）の固定要素は
     スクロール中に描き直しが追いつかず、画面の途中に取り残されて見えることがある。
     そのため、ぼかしをやめて色を透かさず、独立した層に固定して常にいちばん上へ置く。 */
  .nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));
    padding-bottom:env(safe-area-inset-bottom,0px);background:var(--card);
    border-top:1px solid var(--line);display:flex;
    transform:translateZ(0);-webkit-backface-visibility:hidden;backface-visibility:hidden;will-change:transform;
    z-index:100}
  .nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    color:var(--sub);font-size:9.5px;font-weight:700;letter-spacing:-.02em;padding:0 1px}
  .nav button .ni{font-size:19px;line-height:1}
  .nav button.on{color:var(--green-d)}
  .rgbtn{flex:1;padding:7px 0;border:1px solid var(--line2);border-radius:9px;background:#fff;color:var(--sub);font-weight:700;font-size:12.5px}
  .rgbtn.on{background:var(--green-d);color:#fff;border-color:var(--green-d)}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
  .cal-title{font-weight:800;font-size:16px}
  .cal-nav{width:40px;height:36px;border:1px solid var(--line2);border-radius:9px;background:#fff;font-size:20px;color:var(--ink)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .cal-dowrow{margin-bottom:4px}
  .cal-dow{text-align:center;font-size:11px;font-weight:700;padding:2px 0}
  .cal-cell{aspect-ratio:1;border-radius:8px;background:#fff;border:1px solid var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:4px;gap:2px}
  .cal-cell.empty{background:transparent;border:none}
  .cal-cell.today{border-color:var(--green-d);border-width:2px}
  .cal-cell.sel{background:var(--green-d)}
  .cal-cell.sel .cal-num{color:#fff}
  .cal-num{font-size:13px;font-weight:700}
  .cal-dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:90%}
  .cd{display:inline-block;width:5px;height:5px;border-radius:50%}
  .cal-legend{display:flex;gap:12px;justify-content:center;font-size:11px;color:var(--sub);margin:10px 0 4px}
  .cal-legend span{display:inline-flex;align-items:center;gap:3px}

  /* sheet (record / edit) */
  .scrim{position:fixed;inset:0;background:rgba(15,25,23,.4);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
  .scrim.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));
    max-width:520px;margin:0 auto;background:var(--bg);
    border-radius:24px 24px 0 0;z-index:51;transform:translateY(110%);transition:transform .3s cubic-bezier(.2,.8,.25,1);
    max-height:calc(100vh - var(--nav-h) - env(safe-area-inset-bottom,0px) - 24px);
    max-height:calc(100dvh - var(--nav-h) - env(safe-area-inset-bottom,0px) - 24px);
    overflow-y:auto;padding:8px 16px 20px}
  .sheet.show{transform:translateY(0)}
  /* シートの見出し。左に余白、右に閉じる */
  .sheethd{position:relative;display:flex;align-items:center;justify-content:center;margin:2px 0 12px}
  .sheethd h3{font-size:16px;font-weight:800;margin:0}
  .sheethd .close{position:absolute;right:-4px;top:50%;transform:translateY(-50%);
    width:34px;height:34px;border-radius:999px;background:#fff;border:1px solid var(--line);
    color:var(--sub);font-size:16px;font-weight:800;display:grid;place-items:center}
  .grip{width:40px;height:4px;background:#d3dbd8;border-radius:2px;margin:8px auto 6px}
  .sheet h3{font-size:16px;font-weight:800;text-align:center;margin:2px 0 12px}
  .typetog{display:flex;background:#eaeeec;border-radius:12px;padding:3px;margin-bottom:14px}
  .typetog button{flex:1;padding:9px;border-radius:9px;font-size:13.5px;font-weight:800;color:var(--sub)}
  .typetog button.on.exp{background:#fff;color:var(--terra)}
  .typetog button.on.inc{background:#fff;color:var(--green-d)}
  .amtbox{text-align:center;padding:6px 0 12px}
  .amtbox .lab{font-size:11px;color:var(--sub)}
  .amtbox .amtinput{border:0;text-align:center;font-size:44px;font-weight:800;color:var(--ink);width:100%;outline:none;background:transparent}
  .amtbox .amtinput::placeholder{color:#c8d2cf}
  .catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 12px}
  .catbtn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 4px;text-align:center;font-size:11px;color:var(--sub);font-weight:700}
  .catbtn .ce{font-size:19px;display:block}
  .catbtn.on{background:var(--green-l);border-color:#bfe0d3;color:var(--green-d)}
  .row2{display:flex;gap:10px;margin-bottom:12px}
  .row2 .field{flex:1;margin-bottom:0}
  .photobtn{display:block;width:100%;border:1.5px dashed #c3d3ce;border-radius:14px;padding:12px;color:var(--green-d);font-weight:800;font-size:13.5px;background:#fff;margin-bottom:8px;text-align:center}
  .photobtn.main{border-style:solid;border-color:var(--green);background:var(--green-l)}
  .photobtn.big{padding:16px 12px;font-size:15px;margin-bottom:14px}
  .photobtn .sm{display:block;font-size:10.5px;font-weight:700;color:var(--sub);margin-top:2px}
  .shothint{font-size:11px;color:var(--sub);text-align:center;margin:0 0 12px;line-height:1.6}
  /* 読み取り候補 */
  .choices{margin:2px 0 12px}
  .choices .cl{font-size:11px;color:var(--sub);text-align:center;margin-bottom:7px}
  .choice{display:block;width:100%;background:#fff;border:1.5px solid #bfe0d3;border-radius:14px;
    padding:14px;font-size:19px;font-weight:800;color:var(--green-d);margin-bottom:8px}
  .choice:active{transform:scale(.985)}
  .choice.manual{font-size:13.5px;font-weight:700;color:var(--sub);border-style:dashed;border-color:var(--line);padding:12px}
  /* 切り取り枠 */
  .cropwrap{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);
    background:#11201c;margin-bottom:8px;touch-action:none;user-select:none;-webkit-user-select:none}
  .cropwrap img{width:100%;display:block;max-height:44vh;object-fit:contain;pointer-events:none}
  .cropbox{position:absolute;border:2.5px solid #fff;border-radius:5px;
    box-shadow:0 0 0 9999px rgba(10,20,18,.55);cursor:move}
  .cropbox .h{position:absolute;width:34px;height:34px;background:#fff;border-radius:10px;
    border:1px solid rgba(0,0,0,.12);box-shadow:0 2px 6px rgba(0,0,0,.25)}
  .cropbox .h.tl{left:-17px;top:-17px}
  .cropbox .h.br{right:-17px;bottom:-17px}
  .cropbox .h::after{content:"";position:absolute;inset:11px;border-radius:3px;background:#9fb0ab}
  .photoprev{position:relative;margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
  .photoprev img{width:100%;display:block;max-height:180px;object-fit:cover}
  .photoprev .rm{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;width:28px;height:28px;font-size:15px}
  .ocrnote{font-size:11.5px;color:var(--sub);text-align:center;margin:-4px 0 10px}
  .delbtn{width:100%;color:var(--terra);font-size:13px;font-weight:700;padding:12px;margin-top:2px}
  /* 記録ボタンはシートの下に貼り付けて、どこまでスクロールしても押せるように */
  .sheetsave{position:sticky;bottom:0;z-index:3;padding:12px 0 6px;margin-top:10px;background:var(--bg);
    box-shadow:0 -10px 14px -6px rgba(244,247,245,.95)}

  .toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px);transform:translateX(-50%) translateY(20px);
    background:var(--green-dd);color:#fff;font-size:13.5px;font-weight:700;padding:11px 20px;border-radius:999px;
    z-index:120;opacity:0;transition:all .3s cubic-bezier(.2,.7,.3,1);box-shadow:0 8px 20px rgba(20,40,38,.25);white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast .ck{display:inline-block;margin-right:6px}

  /* summary: 内わけ行・タグ・計算式メモ */
  .krow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;padding:5px 0;color:var(--ink)}
  .krow span{color:var(--sub)}
  .krow b{font-weight:800;white-space:nowrap}
  .krow.sub{padding:0 0 4px;font-size:11px}
  .tag{display:inline-block;margin-left:6px;font-size:9.5px;font-weight:800;border-radius:999px;padding:1px 7px;vertical-align:1px}
  .tag.pl{background:#eef2f0;color:var(--sub)}
  .tag.act{background:var(--green-l);color:var(--green-d)}
  .calcnote{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-top:10px;
    font-size:11.5px;color:var(--sub);line-height:1.75}
  .calcnote b{color:var(--ink);font-weight:800}
  .catlbl{grid-column:1/-1;font-size:10.5px;color:var(--sub);font-weight:800;margin:2px 2px -2px}

  /* 毎月固定のスイッチ */
  .fixtog{display:inline-flex;align-items:center;gap:6px;margin-top:2px;padding:6px 12px;border-radius:999px;
    border:1px solid var(--line2);background:#fff;color:var(--sub);font-size:12px;font-weight:800}
  .fixtog .sw{display:inline-block;width:26px;height:15px;border-radius:999px;background:#dfe5e2;position:relative;transition:background .15s}
  .fixtog .sw i{position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:#fff;transition:left .15s}
  .fixtog.on{border-color:var(--green-d);background:var(--green-l);color:var(--green-d)}
  .fixtog.on .sw{background:var(--green-d)}
  .fixtog.on .sw i{left:13px}
  .fixhint{font-size:10.5px;color:var(--sub);margin-top:4px}
  .tag.fx{background:var(--green-l);color:var(--green-d)}
  /* 今日やることカード */
  .todos{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 13px;margin-top:12px}
  .todos .hd{font-size:11.5px;color:var(--sub);font-weight:800;margin-bottom:6px}
  .todo{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 2px;border-top:1px solid var(--line);background:none}
  .todo.first{border-top:none;padding-top:2px}
  .todo .ti{flex:0 0 auto;font-size:19px;line-height:1.2}
  .todo .tm{flex:1;min-width:0}
  .todo .t1{display:block;font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.4}
  .todo .t2{display:block;font-size:10.5px;color:var(--sub);margin-top:1px}
  .todo .tg{flex:0 0 auto;color:#c3ccc8;font-size:17px;font-weight:800}
  /* 分析タブ */
  .seg{display:flex;gap:6px;margin:6px 0 2px}
  .mbars{display:flex;gap:6px;align-items:flex-end;height:104px;margin:8px 0 2px}
  .mcol{flex:1;height:100%;display:flex;flex-direction:column;align-items:center}
  .mpair{height:calc(100% - 15px);width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px}
  .mbar{width:10px;border-radius:3px 3px 0 0;background:#cfd8d4}
  .mlbl{font-size:10px;color:var(--sub);font-weight:700;line-height:15px}
  .ins{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:8px 0;border-top:1px solid var(--line);line-height:1.5}
  .ins.first{border-top:none;padding-top:2px}
  .ins .ii{flex:0 0 auto;font-size:14px;line-height:1.35}
  .ins.warn{color:#a8543c}
  .ins.good{color:#3f7a52}
  .crow{margin:11px 0}
  .crow .chd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px}
  .crow .cn{color:var(--ink);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .crow .cv{flex:0 0 auto;font-weight:800}
  .crow .track{display:block;height:8px;background:#eef1ef;border-radius:6px;overflow:hidden;margin:4px 0 3px}
  .crow .fill{display:block;height:100%;border-radius:6px}
  .crow .csub{font-size:10.5px;color:var(--sub)}
  .dif{display:inline-block;margin-left:6px;font-size:10px;font-weight:800;border-radius:999px;padding:1px 6px}
  .dif.up{background:#fbeae4;color:#b35c42}
  .dif.dn{background:#e8f2ea;color:#3f7a52}
  .dif.eq{background:#eef1ef;color:var(--sub)}
  /* 資産形成 総合ライフプランへの入口（ホームのいちばん下）
     色はすべて既存の変数（--card / --line / --sub / --green-d）だけで作る。
     テーマの色を差し替えれば、このカードもそのまま追従する。 */
  .lpcard{display:flex;align-items:center;gap:12px;width:100%;min-height:66px;margin-top:16px;
    text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);
    transition:transform .12s cubic-bezier(.2,.7,.3,1)}
  .lpcard:active{transform:scale(.985)}
  .lpcard .lpi{flex:none;font-size:22px;line-height:1}
  .lpcard .lpt{flex:1;min-width:0}
  .lpcard .lpt b{display:block;font-size:14.5px;font-weight:800;line-height:1.45}
  .lpcard .lpt i{display:block;font-style:normal;font-size:11.5px;color:var(--sub);margin-top:1px}
  .lpcard .lpar{flex:none;font-size:18px;font-weight:800;color:var(--sub)}

  /* アプリ情報（About）。せっていのいちばん下に置く小さなカード。 */
  .about{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 16px 14px;text-align:center;box-shadow:var(--shadow)}
  .about .an{font-size:14.5px;font-weight:800}
  .about .av{font-size:12px;color:var(--sub);margin-top:2px}
  .about .aline{border:0;border-top:1px solid var(--line2);margin:12px 0 10px}
  .about .ac{font-size:11px;line-height:1.9;color:var(--sub)}
  /* 連絡先は指で押しやすいよう、1行あたり40px以上の高さを取る */
  .about .alink{display:inline-flex;align-items:center;justify-content:center;min-height:40px;
    padding:2px 12px;font-size:11.5px;font-weight:700;color:var(--green-d);text-decoration:none}
  .about .alink:active{opacity:.6}
  /* 金額の電卓（iPhoneのキーボードは出さず、これだけで打つ） */
  .amtbox .calcexpr{min-height:16px;text-align:center;font-size:12.5px;font-weight:700;color:var(--sub);letter-spacing:.02em}
  .amtbox .calcerr{text-align:center;font-size:11.5px;font-weight:800;color:var(--terra);min-height:14px}
  .calcpad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
  .calcpad button{min-height:52px;border-radius:12px;background:var(--card);border:1px solid var(--line);
    font-size:19px;font-weight:800;color:var(--ink);transition:transform .1s cubic-bezier(.2,.7,.3,1)}
  .calcpad button:active{transform:scale(.95)}
  .calcpad .fn{background:#eef1ef;color:var(--sub);font-size:16px}
  .calcpad .op{background:var(--green-l);color:var(--green-dd)}
  .calcpad .op.on{background:var(--green-d);color:#fff}
  .calcpad .eq{grid-row:span 2;background:var(--green-d);color:#fff}
  .calcpad .zero{font-size:17px}

  /* 関数電卓 */
  .scidisp{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 14px 10px;box-shadow:var(--shadow);margin-top:6px}
  .sciunit{position:absolute;left:12px;top:10px;font-size:11px;font-weight:800;color:var(--green-d);
    border:1px solid var(--line2);border-radius:8px;padding:4px 10px;min-height:28px}
  .sciexpr{text-align:right;font-size:14px;font-weight:700;color:var(--sub);min-height:20px;word-break:break-all;line-height:1.5}
  .scians{text-align:right;font-size:30px;font-weight:800;color:var(--ink);min-height:36px;word-break:break-all;line-height:1.2}
  .scierr{text-align:right;font-size:11.5px;font-weight:800;color:var(--terra);min-height:14px}
  .scifn{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
  .scifn button{min-height:44px;border-radius:10px;background:var(--green-l);border:1px solid var(--line);
    font-size:13px;font-weight:800;color:var(--green-dd)}
  .scipad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
  .scipad button{min-height:52px;border-radius:12px;background:var(--card);border:1px solid var(--line);
    font-size:19px;font-weight:800;color:var(--ink)}
  .scifn button:active,.scipad button:active,.scieq:active{transform:scale(.95)}
  .scipad .fn{background:#eef1ef;color:var(--sub);font-size:16px}
  .scipad .fn.ac{color:var(--terra)}
  .scipad .op{background:var(--green-l);color:var(--green-dd)}
  .scieq{margin-top:8px}
  .sciuse{margin-top:10px;background:var(--gold)}
  .shrow{display:flex;align-items:baseline;gap:10px;width:100%;padding:9px 0;border-bottom:1px solid var(--line2);text-align:left}
  .shrow:last-of-type{border-bottom:0}
  .shrow .se{flex:1;min-width:0;font-size:12px;color:var(--sub);word-break:break-all}
  .shrow .sv{flex:none;font-size:14px;font-weight:800;color:var(--ink)}

  /* ホームの「今月の予定」 */
  .mpday{font-size:11.5px;font-weight:800;color:var(--sub);margin:10px 0 2px}
  .mpday:first-child{margin-top:0}
  .mpday.today{color:var(--green-d)}
  .mplink{text-align:left;font:inherit;color:inherit;padding:0;background:none;border:0}
  .mpmore{display:block;width:100%;text-align:center;font-size:12px;font-weight:700;color:var(--green-d);padding:10px 0 2px}

  /* 予定（スケジュール） */
  .prow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line2)}
  .prow:last-of-type{border-bottom:0}
  .prow.done .ptext{text-decoration:line-through;color:var(--sub)}
  .pchk{flex:none;font-size:19px;line-height:1;padding:6px 2px;color:var(--green-d);min-width:32px;text-align:left}
  .ptime{flex:none;min-width:44px;font-size:12px;font-weight:800;color:var(--sub)}
  .ptext{flex:1;min-width:0;font-size:13.5px;line-height:1.5;word-break:break-word}
  .pdel{flex:none;padding:6px 4px;font-size:13px;color:var(--sub);min-width:30px}
  .prowadd{display:flex;gap:8px;align-items:center}
  .prowadd input[type="time"]{flex:0 0 96px;border:1px solid var(--line2);border-radius:10px;padding:9px 8px;background:var(--card);color:var(--ink);font-weight:700}
  .prowadd input#p-text{flex:1;min-width:0;border:1px solid var(--line2);border-radius:10px;padding:9px 10px;background:var(--card);color:var(--ink)}
  .hidden{display:none !important}
</style>
</head>
<body>
<div id="app"></div>
<nav class="nav" id="nav">
  <button data-nav="home" class="on"><span class="ni">🏠</span>ホーム</button>
  <button data-nav="summary"><span class="ni">📊</span>まとめ</button>
  <button data-nav="calendar"><span class="ni">📅</span>カレンダー</button>
  <button data-nav="diary"><span class="ni">📖</span>日記</button>
  <button data-nav="health"><span class="ni">❤️</span>健康</button>
  <button data-nav="calc"><span class="ni">🧮</span>電卓</button>
  <button data-nav="settings"><span class="ni">⚙️</span>せってい</button>
</nav>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<input type="file" id="camInput" accept="image/*" capture="environment" class="hidden">
<input type="file" id="diaryPhotoInput" accept="image/*" class="hidden">
<input type="file" id="backupInput" accept="application/json,.json" class="hidden">

<script src="./core.js"></script>
<script>
/* =========================================================================
   かけいぼ ― 夢に近づく家計簿（MVP）
   ・ビルド不要の自己完結アプリ。データは端末内(localStorage)にのみ保存。
   ・「資産形成総合ライフプラン」へ渡す月次スナップショット書き出しに対応。
   ========================================================================= */
"use strict";
const STORE_KEY = "kakeibo:v1:state";

/* ---------- 分類・計算はすべて core.js（唯一の正）から取る ---------- */
const Core = window.KakeiboCore;
const EXP_CATS = Core.EXP_CATS;         // 表示・集計に使う支出カテゴリ（過去の記録のぶんも含む）
const EXP_PICK_CATS = Core.EXP_PICK_CATS;  // 記録シートで選べるカテゴリ（重複する「その他」を出さない）
const INC_CATS    = Core.INC_CATS;      // 収入のカテゴリ
const catOf       = Core.catOf;

/* ---------- 状態 ---------- */
const defaultState = ()=>({
  settings: Core.normalizeSettings({}),
  tx:[],  // {id,type:'expense'|'income',amount,cat,date:'YYYY-MM-DD',memo,photo?}
  health:{},  // { 'YYYY-MM-DD': {weight,bpHigh,bpLow} } 1日1件・上書き
  diary:{},  // { 'YYYY-MM-DD': '本文' } 1日1件・編集可
  plans:{},  // { 'YYYY-MM-DD': [{id,time,text,done}] } 予定。1日に何件でも
  calcHistory:[]  // 関数電卓の履歴 [{expr,value}]。式そのものは持ち歩かない
});
let state = load();
let view = "home";
let sumTab = "month";   // まとめ画面のタブ： "month"（今月）／"analysis"（分析）

function load(){
  try{ const raw = localStorage.getItem(STORE_KEY); if(raw){ const s=JSON.parse(raw);
    /* normalizeSettings が旧形式の設定を安全な形へ移行する */
    return { settings:Core.normalizeSettings(s.settings||{}), tx:Array.isArray(s.tx)?s.tx:[], health:Core.normalizeHealth(s.health), diary:Core.normalizeDiary(s.diary), plans:Core.normalizePlans(s.plans), calcHistory:Core.normalizeSciHistory(s.calcHistory) }; } }
  catch(e){ /* ignore */ }
  return defaultState();
}
let lastSaveError=null;
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); lastSaveError=null; return true; }
  catch(e){ lastSaveError=e; return false; }
}
function isQuotaError(e){
  if(!e) return false;
  return e.name==="QuotaExceededError" || e.name==="NS_ERROR_DOM_QUOTA_REACHED" || e.code===22 || e.code===1014;
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ---------- 日付・お金ヘルパ ---------- */
const pad=n=>String(n).padStart(2,"0");
function todayISO(d=new Date()){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function ymOf(iso){ return iso.slice(0,7); }
/* 月の区切りの起点日（設定。既定は1日＝暦の月）。計算のしかたは core.js が唯一の正。 */
function cycleStart(){ return Core.normalizeCycleStart(state.settings && state.settings.cycleStart); }
/* 今いる区切りのキー。起点が1日なら、これまでどおり今月の "YYYY-MM"。 */
function curYM(){ return Core.cycleOf(todayISO(), cycleStart()); }
function yen(v){ const n=Math.round(Number(v)||0); return "¥"+n.toLocaleString("en-US"); }
/* 今の区切りが終わるまで、あと何日か */
function daysLeftInCycle(){
  const r=Core.cycleRange(curYM(), cycleStart());
  return Math.max(0, Core.daysApart(todayISO(), r.to));
}
function weekRange(){ const d=new Date(); const day=(d.getDay()+6)%7; /*Mon=0*/ const mon=new Date(d); mon.setDate(d.getDate()-day);
  const sun=new Date(mon); sun.setDate(mon.getDate()+6); return {from:todayISO(mon),to:todayISO(sun)}; }

/* ---------- 集計（計算式は core.js が唯一の正。ここでは足し引きしない） ---------- */
function compute(){
  const c = Core.computeMonth(state.settings, state.tx, curYM());
  const {from,to} = weekRange();
  c.weekSpent = Core.weekSpent(state.tx, from, to);
  return c;
}

/* ---------- ルート描画 ---------- */
const $=id=>document.getElementById(id);
function render(){
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on", b.dataset.nav===view));
  const app=$("app");
  if(view==="home") app.innerHTML=renderHome();
  else if(view==="summary") app.innerHTML = sumTab==="analysis" ? renderAnalysis() : renderSummary();
  else if(view==="calendar") app.innerHTML=renderCalendar();
  else if(view==="diary") app.innerHTML=renderDiary();
  else if(view==="health") app.innerHTML=renderHealth();
  else if(view==="calc") app.innerHTML=renderSci();
  else if(view==="settings") app.innerHTML=renderSettings();
  window.scrollTo(0,0);
}

/* 今日やることカード。やることが無いときは、何も出さない。 */
function taskCard(){
  const today=todayISO();
  const tasks=Core.todayTasks(state, today);
  /* 今日の予定（まだ済んでいないもの）。タップでその場でチェックできる。 */
  const plans=Core.todayPlans(state, today);
  const shown=plans.slice(0, Core.PLAN_SHOW_MAX);
  if(!tasks.length && !shown.length) return "";
  const planRows=shown.map((p,i)=>`<button class="todo${i===0?" first":""}" data-act="plan-toggle" data-date="${today}" data-id="${p.id}">
      <span class="ti">☐</span>
      <span class="tm"><span class="t1">${p.time?`${p.time}　`:""}${escapeHtml(p.text)}</span><span class="t2">今日の予定</span></span>
      <span class="tg">✓</span>
    </button>`).join("");
  const more = plans.length>shown.length
    ? `<button class="todo" data-act="task" data-task="diary"><span class="ti">📝</span>
        <span class="tm"><span class="t1">ほか ${plans.length-shown.length}件 の予定があります</span></span><span class="tg">›</span></button>`
    : "";
  const rows=tasks.map((t,i)=>`<button class="todo${(i===0&&!planRows)?" first":""}" data-act="task" data-task="${t.act}">
      <span class="ti">${t.icon}</span>
      <span class="tm"><span class="t1">${escapeHtml(t.text)}</span>${t.sub?`<span class="t2">${escapeHtml(t.sub)}</span>`:""}</span>
      <span class="tg">›</span>
    </button>`).join("");
  return `<div class="todos"><div class="hd">今日やること</div>${planRows}${more}${rows}</div>`;
}

/* やることをタップしたときの行き先。ここでは記録を書き換えない。 */
function goTask(act){
  if(act==="carry"){ view="summary"; sumTab="month"; render(); return; }
  if(act==="record"){ openRecord(null); return; }
  if(act==="salary"){
    openRecord(null);
    sheetState.type="income"; sheetState.cat="salary";
    renderSheet(); return;
  }
  if(act==="diary"){ diaryEditDate=null; diaryPhotoPending=undefined; view="diary"; render(); return; }
  if(act==="health"){ view="health"; render(); return; }
}

/* ---------- 外部アプリ（資産形成 総合ライフプラン）への入口 ----------
   別プロジェクトとして公開しているサイトへ、リンクで移動するだけ。
   家計簿の計算・保存データには一切関わらない。 */
const LIFEPLAN_URL="https://pitbully-works.jp/";
const SITE_LABEL="pitbully-works.jp";   // アプリ情報に出す表示用の文字（リンク先は LIFEPLAN_URL と同じ）
const CONTACT_MAIL="pdr.gifu@gmail.com";

/* ホーム画面に追加したPWA（standalone表示）で開いているかどうか。
   iPhoneでは開き方によって戻りやすさが変わるので、これで target を切り替える。
     ・PWA        … target="_blank"。iOSはアプリ内のブラウザで開き、「完了」や
                    左端スワイプでかけいぼへ戻れる。入力中の画面も残る。
     ・Safariのタブ … 同じタブ。戻るボタン／左端スワイプ一発で戻れ、タブも増えない。
   テスト用の最小DOMのように matchMedia が無い環境でも落ちないようにする。 */
function isStandalonePWA(){
  try{
    if(typeof navigator!=="undefined" && navigator && navigator.standalone===true) return true;
    if(typeof window==="undefined" || !window || typeof window.matchMedia!=="function") return false;
    return window.matchMedia("(display-mode: standalone)").matches===true;
  }catch(e){ return false; }
}
function extTarget(){ return isStandalonePWA() ? "_blank" : "_self"; }

/* ホームのいちばん下に置く、ライフプランへの入口カード */
function lifePlanCard(){
  return `<a class="lpcard" href="${LIFEPLAN_URL}" target="${extTarget()}" rel="noopener noreferrer">
    <span class="lpi">📊</span>
    <span class="lpt"><b>将来のお金を試算する</b><i>資産形成 総合ライフプラン</i></span>
    <span class="lpar">›</span>
  </a>`;
}

/* せっていのいちばん下に置く、アプリ情報（About） */
function aboutCard(){
  return `<div class="about">
    <div class="an">家計簿アプリ</div>
    <div class="av mono">Version ${escapeHtml(Core.APP_VERSION)}</div>
    <hr class="aline">
    <div class="ac mono">© 2026 Kunihiko Hioki<br>Developed by Kunihiko Hioki</div>
    <div><a class="alink" href="mailto:${CONTACT_MAIL}">📧 ${CONTACT_MAIL}</a></div>
    <div><a class="alink" href="${LIFEPLAN_URL}" target="${extTarget()}" rel="noopener noreferrer">🌐 ${SITE_LABEL}</a></div>
  </div>`;
}

/* ホームのいちばん下に出す「今月の予定」。暦の月（1日〜月末）で見る。
   済んだ予定はグレーで残す。 */
function monthPlanCard(){
  const today=todayISO();
  const ym=today.slice(0,7);
  const m=Core.monthPlans(state, ym);
  if(!m.total) return "";
  const WD=["日","月","火","水","木","金","土"];
  /* いったん1行ずつに開いてから、出す行数をここで1回だけ決める */
  const rows=[];
  for(const d of m.days) for(const p of d.plans) rows.push({date:d.date, plan:p});
  const shownRows=rows.slice(0, Core.PLAN_HOME_MAX);
  let html="", lastDate="";
  for(const r of shownRows){
    if(r.date!==lastDate){
      lastDate=r.date;
      const [yy,mm,dd]=r.date.split("-").map(Number);
      const wd=WD[new Date(yy,mm-1,dd).getDay()];
      html+=`<div class="mpday${r.date===today?" today":""}">${mm}/${dd}（${wd}）${r.date===today?" 今日":""}</div>`;
    }
    const p=r.plan;
    html+=`<div class="prow${p.done?" done":""}">
      <button class="pchk" data-act="plan-toggle" data-date="${r.date}" data-id="${p.id}" aria-label="済みにする">${p.done?"☑":"☐"}</button>
      <span class="ptime mono">${p.time||"—"}</span>
      <button class="ptext mplink" data-act="cal-edit-plan" data-date="${r.date}">${escapeHtml(p.text)}</button>
    </div>`;
  }
  const rest=rows.length-shownRows.length;
  return `<div class="stitle">今月の予定（${Number(ym.slice(5,7))}月）</div>
    <div class="barlist">
      <div style="font-size:11.5px;color:var(--sub);margin-bottom:2px">${m.total}件　のこり <b style="color:var(--ink)">${m.left}件</b></div>
      ${html}
      ${rest>0?`<button class="mpmore" data-nav="calendar">ほか ${rest}件 をカレンダーで見る</button>`:""}
    </div>`;
}

function renderHome(){
  const c=compute(), s=state.settings;
  const d=new Date();
  const WD=["日","月","火","水","木","金","土"];
  const dateBig=`${d.getMonth()+1}月${d.getDate()}日<span class="wd">（${WD[d.getDay()]}）</span>`;
  const period=Core.cycleLabel(curYM(), cycleStart());
  const monthLabel=`今月ののこり ${daysLeftInCycle()}日${period?`　（${period}）`:""}`;

  let heroN, heroCls="", ok="", note;
  if(c.hasIncome){
    heroN=yen(c.available);
    note="先取り貯金・NISA積立の予定額を除いています";
    if(c.available<0){ heroCls="over"; ok=`<span class="ok over">今月は少し使いすぎ。来月そっと調整🍀</span>`; }

/* 収入を100%とした割合のドーナツ円グラフ（SVG・外部ライブラリなし） */
function donutChart(bd){
  const R=52, C=Math.PI*2*R, cx=60, cy=60;
  let acc=0;
  const total=bd.parts.reduce((s,p)=>s+p.amount,0);
  const segs = total>0 ? bd.parts.filter(p=>p.amount>0).map(p=>{
    const frac=p.amount/Math.max(total, bd.base);
    const len=C*frac;
    const seg=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${p.color}" stroke-width="14"
      stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}"
      transform="rotate(-90 ${cx} ${cy})"></circle>`;
    acc+=len; return seg;
  }).join("") : `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--line2)" stroke-width="14"></circle>`;
  const legend=bd.parts.map(p=>`<div style="display:flex;align-items:center;gap:6px;font-size:12px">
    <span style="width:10px;height:10px;border-radius:3px;background:${p.color};flex:0 0 auto"></span>
    <span style="flex:1">${p.name}</span><b class="mono">${p.pct}%</b></div>`).join("");
  return `<div style="display:flex;align-items:center;gap:16px">
    <svg viewBox="0 0 120 120" style="width:120px;height:120px;flex:0 0 auto">${segs}
      <text x="60" y="56" text-anchor="middle" style="font-size:11px;fill:var(--sub)">収入</text>
      <text x="60" y="72" text-anchor="middle" style="font-size:13px;font-weight:800;fill:var(--ink)" class="mono">${yen(bd.income)}</text>
    </svg>
    <div style="flex:1;display:flex;flex-direction:column;gap:6px">${legend}
      ${bd.over>0?`<div style="font-size:11px;color:#c2694f">⚠️ 収入を ${yen(bd.over)} 超えています</div>`:""}
    </div>
  </div>`;
}
/* 先月の「🔁 毎月固定」を今月へまとめて入れるカード。
   入れるものが無いときは、何も出さない（済んだら消える）。 */
function carryCard(){
  const plan=Core.recurringCarryPlan(state.tx, curYM(), cycleStart());
  if(!plan.toAdd.length) return "";
  const names=plan.toAdd.slice(0,4).map(i=>`${i.emoji} ${escapeHtml(i.name)} ${yen(i.amount)}`).join(" ・ ");
  const more=plan.toAdd.length>4?` ほか${plan.toAdd.length-4}件`:"";
  return `<div class="barlist" style="margin-top:10px">
    <div style="font-size:13px;font-weight:800;color:var(--ink);margin-bottom:4px">🔁 先月の毎月固定が ${plan.toAdd.length}件 あります</div>
    <div style="font-size:11.5px;color:var(--sub);margin-bottom:10px">${names}${more}　合計 <b class="mono" style="color:var(--ink)">${yen(plan.total)}</b>${plan.skipped>0?`<br>今月すでに入っている ${plan.skipped}件 は、はぶきます`:""}</div>
    <button class="btn-main" data-act="carry-recurring">今月にまとめて入れる</button>
    <div style="font-size:10.5px;color:var(--sub);margin-top:6px">金額は先月と同じで入ります。ちがうときは、入れたあとで直してください。</div>
  </div>`;
}

/* まとめて入れる。1件でも保存に失敗したら、1件も増やさずに戻す。 */
function carryRecurring(){
  const plan=Core.recurringCarryPlan(state.tx, curYM(), cycleStart());
  if(!plan.toAdd.length){ toast("入れるものはありません"); return; }
  const lines=plan.toAdd.map(i=>`${i.emoji} ${i.name} ${yen(i.amount)}`).join("\n");
  const ok=confirm(
    `先月（${plan.from.replace("-","年")}月）の毎月固定を、今月へ入れます。\n\n${lines}\n\n合計 ${yen(plan.total)}\n\n` +
    "金額は先月と同じです。ちがうときは、入れたあとで直してください。\n\n続けますか？"
  );
  if(!ok) return;                                   // キャンセル：何も変えない
  const before = JSON.parse(JSON.stringify(state.tx));   // 失敗したら戻せるように退避
  plan.toAdd.forEach(i=>{
    state.tx.push({id:uid(),type:"expense",amount:i.amount,cat:i.cat,date:i.date,memo:i.memo,photo:null,recurring:true});
  });
  if(!save()){
    state.tx = before;            // 途中まで増えた状態を残さない
    toast("入れられませんでした（空き容量をご確認ください）");
    return;
  }
  render(); toast(`${plan.toAdd.length}件を今月に入れました ✓`);
}

function renderSummary(){
  const c=compute();
  /* ホームと同じ定義。のこり ＝ 収入 － 支出 － 先取り ＝ c.available */
  const net=c.available;
  // 直近の記録（新しい順、日付グループ）
  const list=[...state.tx].sort((a,b)=> a.date<b.date?1:a.date>b.date?-1: (a.id<b.id?1:-1));
  let recHtml="";
  if(list.length===0){
    recHtml=`<div class="empty"><span class="e">🧾</span>まだ記録がありません。<br>ホームの「記録する」から、はじめの一歩を。</div>`;
  } else {
    const groups={}; list.forEach(t=>{ (groups[t.date]=groups[t.date]||[]).push(t); });
    recHtml = Object.keys(groups).sort().reverse().slice(0,60).map(date=>{
      const items=groups[date];
      const dayTotal=items.filter(t=>t.type==="expense").reduce((a,t)=>a+Number(t.amount),0);
      const md=date.slice(5).replace("-","/");
      const rows=items.map(t=>{ const cat=catOf(t.type,t.cat);
        return `<div class="tx" data-edit="${t.id}"><div class="ic">${t.type==="income"?"💴":cat.e}</div>
          <div class="mid"><div class="t1">${escapeHtml(t.memo|| (t.type==="income"?cat.n:cat.n))}</div>
          <div class="t2">${t.type==="income"?"収入・":""}${cat.n}${t.photo?" ・📷":""}${t.recurring?`<span class="tag fx">🔁 毎月固定</span>`:""}</div></div>
          <div class="amt ${t.type}">${t.type==="income"?"+":""}${yen(t.amount)}</div></div>`;
      }).join("");
      return `<div class="daygroup"><div class="dayhd"><span>${md}</span><span>支出 ${yen(dayTotal)}</span></div>
        <div class="txcard">${rows}</div></div>`;
    }).join("");
  }
  // カテゴリ内訳バー
  const cats=Object.entries(c.byCat).sort((a,b)=>b[1]-a[1]);
  /* 棒の基準は「収入」。収入に対して各カテゴリが何%かを見せる。
     収入がまだ無い月は、支出のいちばん大きい項目を基準にして形だけ見せる。 */
  const barBase = c.incomeTotal>0 ? c.incomeTotal : (cats.length?cats[0][1]:1);
  const PIE={food:"#8fbf7f",eatout:"#d9a54f",daily:"#4fa8d8",rent:"#7f9cc0",power:"#e0c060",gas:"#d98a5f",water:"#5fb0d0",comm:"#9a8fd0",insure:"#78b89a",transit:"#b08fd6",car:"#8a9a70",medical:"#c2694f",clothes:"#c98fb0",social:"#6fa88a",hobby:"#e6b0a6",pet:"#b89a70",pension:"#d0b060",tax:"#a0a0a8",subs:"#8fb0c0",other:"#9fb0ab"};
  const bars = cats.length? cats.map(([k,v])=>{ const cat=catOf("expense",k);
      const pct = Math.round(v/barBase*100);
      return `<div class="brow"><span class="bt">${cat.e} ${cat.n}</span><span class="track"><span class="fill" style="width:${Math.max(3,Math.min(100,pct))}%;background:${PIE[k]||"#9fb0ab"}"></span></span><span class="bv mono">${yen(v)}<span style="color:var(--sub);font-weight:600;font-size:11px"> ${pct}%</span></span></div>`;
    }).join("") : `<div class="muted" style="font-size:12.5px;text-align:center;padding:6px">今月の支出はまだありません</div>`;

  return `<div class="screen">
    ${sumTabs()}
    ${carryCard()}
    <div class="stitle" style="margin-top:6px">今月のまとめ（${Number(curYM().slice(5,7))}月${Core.cycleLabel(curYM(), cycleStart())?`・${Core.cycleLabel(curYM(), cycleStart())}`:""}）</div>
    <div class="sumcards">
      <div class="sc"><div class="l">収入</div><div class="v inc mono">${yen(c.incomeTotal)}</div></div>
      <div class="sc"><div class="l">支出</div><div class="v exp mono">${yen(c.spendTotal)}</div></div>
      <div class="sc"><div class="l">先取り（予定）</div><div class="v mono">${yen(c.setAside)}</div></div>
      <div class="sc"><div class="l">のこり</div><div class="v net mono">${net>=0?"+":""}${yen(net)}</div></div>
    </div>
    <div class="calcnote">収入 ${yen(c.incomeTotal)} － 支出 ${yen(c.spendTotal)} － 先取り ${yen(c.setAside)} ＝ <b>${yen(net)}</b><br>
      この「のこり」は、ホームの「今月あと つかえるお金」と同じ金額です。</div>
    <div class="barlist">
      <div style="font-size:11.5px;color:var(--sub);margin-bottom:8px">収入の使いみち（支出・先取り・のこり）</div>
      ${donutChart(Core.budgetBreakdown(c))}
    </div>
    <div class="barlist">
      <div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--sub);margin-bottom:4px">
        <span>収入の内わけ</span><span></span></div>
      <div class="krow"><span>通常収入（記録した給与）${c.incomeRegularRecorded?"":`<span class="tag pl">未記録</span>`}</span><b class="mono">${yen(c.incomeRegular)}</b></div>
      <div class="krow"><span>臨時収入</span><b class="mono">${yen(c.incomeExtra)}</b></div>
    </div>
    <div class="barlist">
      <div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--sub);margin-bottom:6px">
        <span>支出の内わけ（今月）${c.incomeTotal>0?"　棒は収入に対する割合":""}</span>
        <span class="mono" style="font-weight:800;color:var(--ink)">${yen(c.spendTotal)}</span></div>
      ${c.recurringSpend>0?`<div class="krow"><span>🔁 毎月固定</span><b class="mono">${yen(c.recurringSpend)}</b></div>
      <div class="krow" style="border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:4px"><span>それ以外</span><b class="mono">${yen(c.spotSpend)}</b></div>`:""}
      ${bars}
    </div>
    <div class="stitle">記録（タップで編集）</div>
    ${recHtml}
  </div>`;
}




/* =========================================================================
   分析タブ（詳細分析）

   計算はしない。core.js の analyzeMonth() が返したものを描くだけ。

function sumTabs(){
  const b=(k,label)=>`<button data-act="sum-tab" data-tab="${k}" class="rgbtn${sumTab===k?" on":""}">${label}</button>`;
  return `<div class="seg">${b("month","今月")}${b("analysis","📈 分析")}</div>`;
}

/* 使うペース：つかった累計の線と、予算のペース（点線）を重ねる */
function paceChart(p){
  if(!p.daily.length || p.spendTotal<=0) return `<div class="muted" style="text-align:center;padding:14px;font-size:12.5px">まだ支出の記録がありません</div>`;
  const W=320,H=132,padL=6,padR=6,padT=10,padB=16;
  const last=p.daily[p.daily.length-1];
  const hi=Math.max(last.cum, p.budget>0?p.budget:0, p.forecast, 1);
  const col=(p.over!==null&&p.over>0)?"#c2694f":"#6f9c78";
  const x=d=>padL+(W-padL-padR)*((d-1)/Math.max(1,p.days-1));
  const y=v=>H-padB-(H-padT-padB)*(v/hi);
  const pts=p.daily.map(d=>`${x(d.day).toFixed(1)},${y(d.cum).toFixed(1)}`).join(" ");
  const budgetLine=p.budget>0
    ? `<line x1="${x(1).toFixed(1)}" y1="${y(p.budgetPerDay).toFixed(1)}" x2="${x(p.days).toFixed(1)}" y2="${y(p.budget).toFixed(1)}" stroke="#9fb0ab" stroke-width="1.5" stroke-dasharray="4 4"></line>` : "";
  const foreLine=(p.isCurrent&&p.elapsed<p.days)
    ? `<line x1="${x(p.elapsed).toFixed(1)}" y1="${y(last.cum).toFixed(1)}" x2="${x(p.days).toFixed(1)}" y2="${y(p.forecast).toFixed(1)}" stroke="${col}" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.55"></line>` : "";
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    ${budgetLine}${foreLine}
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></polyline>
    <circle cx="${x(last.day).toFixed(1)}" cy="${y(last.cum).toFixed(1)}" r="3" fill="${col}"></circle>
  </svg>
  <div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--sub);margin-top:2px">
    <span>1日</span><span>― つかった累計　┄ 予算のペース</span><span>${p.days}日</span>
  </div>`;
}

/* 月ごとの推移：収入（緑）と支出（赤）を並べた棒 */
function trendChart(trend){
  const max=Math.max(1,...trend.map(m=>Math.max(m.income,m.spend)));
  const h=v=>v>0?Math.max(4,Math.round(v/max*100)):0;
  const cols=trend.map(m=>`<div class="mcol"><div class="mpair">
      <span class="mbar" style="height:${h(m.income)}%;background:#6f9c78"></span>
      <span class="mbar" style="height:${h(m.spend)}%;background:#c2694f"></span>
    </div><span class="mlbl">${m.label}</span></div>`).join("");
  return `<div class="mbars">${cols}</div>
  <div style="display:flex;gap:12px;justify-content:center;font-size:10.5px;color:var(--sub)">
    <span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#6f9c78"></span> 収入</span>
    <span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#c2694f"></span> 支出</span>
  </div>`;
}

const CAT_COLOR={food:"#8fbf7f",eatout:"#d9a54f",daily:"#4fa8d8",rent:"#7f9cc0",power:"#e0c060",gas:"#d98a5f",water:"#5fb0d0",comm:"#9a8fd0",insure:"#78b89a",transit:"#b08fd6",car:"#8a9a70",medical:"#c2694f",clothes:"#c98fb0",social:"#6fa88a",hobby:"#e6b0a6",pet:"#b89a70",pension:"#d0b060",tax:"#a0a0a8",subs:"#8fb0c0",other:"#9fb0ab"};
function diffTag(diff, hadPrev){
  if(!hadPrev) return `<span class="dif eq">はじめて</span>`;
  if(diff>0) return `<span class="dif up">+${yen(diff)}</span>`;
  if(diff<0) return `<span class="dif dn">−${yen(-diff)}</span>`;
  return `<span class="dif eq">±0</span>`;
}

function renderAnalysis(){
  const a=Core.analyzeMonth(state.settings, state.tx, curYM(), {today:todayISO()});
  const p=a.pace;
  const mon=Number(curYM().slice(5,7));

  const insHtml = a.insights.length
    ? a.insights.map((s,i)=>{ const icon=s.level==="warn"?"⚠️":s.level==="good"?"🌱":"💡";

    : `<div class="muted" style="font-size:12.5px;text-align:center;padding:6px">今月の支出はまだありません</div>`;

  return `<div class="screen">
    ${sumTabs()}

    ${p.periodLabel?`<div class="calcnote" style="margin:-4px 0 10px">この「${mon}月」は ${p.periodLabel} の分です</div>`:""}
    <div class="barlist" style="margin-top:0">${insHtml}</div>

    <div class="stitle">つかうペース</div>
    <div class="sumcards three">
      <div class="sc"><div class="l">これまで</div><div class="v exp mono">${yen(p.spendTotal)}</div></div>
      <div class="sc"><div class="l">1日あたり</div><div class="v mono">${yen(p.perDay)}</div></div>
      ${forecastCard}
    </div>
    <div class="barlist">
      ${paceChart(p)}
      <div class="calcnote" style="margin:10px 0 0">${p.hasIncome
        ? `つかってよい額 ${yen(p.budget)}（収入 ${yen(a.month.incomeTotal)} － 先取り ${yen(a.month.setAside)}）。1日あたり ${yen(p.budgetPerDay)} のペースです。`
        : `給料を記録すると、予算のペース（点線）が出ます。`}<br>
        記録があった日 ${p.spendDays}日 ／ つかわなかった日 ${p.noSpendDays}日${p.recurringSoFar>0
          ? `<br>🔁 毎月固定の ${yen(p.recurringSoFar)} は、日割りせずそのまま数えています。`
          : ``}</div>

    <div class="stitle">${a.trend.length}か月の推移</div>

async function saveDiary(){
  const el=$("d-text"); const text=el?el.value:"";
  const date=diaryEditDate||todayISO();
  const cur=state.diary[date]||{};
  /* 写真：未変更なら今の写真、null なら外す、文字列なら新規（縮小してから） */
  let photo = diaryPhotoPending!==undefined ? diaryPhotoPending : (cur.photo||null);
  if(photo && diaryPhotoPending) photo = await resizeDataUrl(photo, Core.PHOTO_STORE_MAX, 0.6);

  const before=JSON.parse(JSON.stringify(state.diary));
  const build=(withPhoto)=>{
    const next=Object.assign({}, state.diary);
    if(text.trim()==="" && !(withPhoto&&photo)){ delete next[date]; }   // 本文も写真も無ければ消す
    else {
      const e={ text:text.slice(0,Core.DIARY_MAX) };
      if(withPhoto && photo) e.photo=photo;
      next[date]=e;
    }
    return next;
  };
  state.diary=build(true);
  if(save()){
    diaryEditDate=null; diaryPhotoPending=undefined;
    render(); toast((text.trim()===""&&!photo)?"日記を消しました":"日記を保存しました ✓");
    return;
  }
  /* 容量オーバー：写真を落として本文だけで再挑戦 */
  state.diary=build(false);
  if(photo && save()){
    diaryEditDate=null; diaryPhotoPending=undefined;
    render(); toast("日記を保存しました（写真は容量オーバーで保存できません）");
    return;
  }
  state.diary=before;   // それでも駄目なら完全に戻す
  toast("日記を保存できませんでした");
}

/* ---------- 健康ページ ---------- */
let healthRange="month";   // day / week / month
function healthFromDate(){
  const now=new Date(); const d=new Date(now);
  if(healthRange==="day") d.setDate(now.getDate()-1);
  else if(healthRange==="week") d.setDate(now.getDate()-7);
  else d.setMonth(now.getMonth()-1);
  return d.toISOString().slice(0,10);
}
/* 折れ線グラフを SVG で描く（外部ライブラリなし） */
function lineChart(series, color, unit){
  if(!series.length) return `<div class="muted" style="text-align:center;padding:14px;font-size:12.5px">この期間の記録はまだありません</div>`;
  const W=300,H=120,pad=8;
  const vals=series.map(p=>p.value);
  let lo=Math.min(...vals), hi=Math.max(...vals);
  if(lo===hi){ lo-=1; hi+=1; }
  const nx=series.length>1 ? series.length-1 : 1;
  const x=i=>pad + (W-pad*2)*(series.length>1?i/nx:0.5);
  const y=v=>H-pad - (H-pad*2)*((v-lo)/(hi-lo));
  const pts=series.map((p,i)=>`${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(" ");
  const dots=series.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.value).toFixed(1)}" r="2.5" fill="${color}"></circle>`).join("");
  const last=series[series.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></polyline>
    ${dots}
  </svg>
  <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:2px">
    <span>${series[0].date.slice(5).replace("-","/")}</span>
    <span>最新 <b class="mono" style="color:var(--ink)">${last.value}${unit}</b></span>
    <span>${last.date.slice(5).replace("-","/")}</span>
  </div>`;
}

/* 起点日の選択肢。1日は「これまでどおり」と分かるように書く。 */
function cycleOptions(cur){
  const now=Core.normalizeCycleStart(cur);
  let out="";
  for(let d=Core.CYCLE_START_MIN; d<=Core.CYCLE_START_MAX; d++){
    const label = d===1 ? "1日（暦の月・これまでどおり）" : `${d}日`;
    out += `<option value="${d}"${d===now?" selected":""}>${label}</option>`;
  }
  return out;
}
/* いま選んでいる区切りが、実際に何日から何日までになるかを見せる */
function cycleHelp(cur){
  const d=Core.normalizeCycleStart(cur);
  if(d===1) return "1日から月末までを1か月として数えます";
  const r=Core.cycleRange(curYM(), d);
  const jp=iso=>`${Number(iso.slice(5,7))}月${Number(iso.slice(8,10))}日`;
  const tail = d>28 ? "　※その日が無い月は、月末に合わせます" : "";
  return `いまの区切りは ${jp(r.from)}〜${jp(r.to)}${tail}`;
}

function openRecord(editId){
  if(editId){ const t=state.tx.find(x=>x.id===editId); if(!t) return;
    sheetState={mode:"edit", id:t.id, type:t.type, amount:String(t.amount), cat:t.cat, date:t.date, memo:t.memo||"", photo:t.photo||null, shot:"total", recurring:t.recurring===true};
  } else {
    sheetState={mode:"add", type:"expense", amount:"", cat:"food", date:todayISO(), memo:"", photo:null, shot:"total", recurring:false};
  }
  sheetState.calc=Core.calcFrom(sheetState.amount);
  renderSheet(); showSheet(true);
}
/* 電卓のキー。押した結果は Core.calcPress が決める（計算式は画面に書かない）。 */
function calcPad(calc){
  const k=(key,label,cls)=>`<button class="${cls||""}" data-act="calc" data-key="${key}">${label}</button>`;
  const op=(key,label)=>k(key,label,`op${calc.op===key?" on":""}`);
  return `<div class="calcpad">
    ${k("C","C","fn")}${k("back","⌫","fn")}${op("/","÷")}${op("*","×")}
    ${k("7","7")}${k("8","8")}${k("9","9")}${op("-","−")}
    ${k("4","4")}${k("5","5")}${k("6","6")}${op("+","＋")}
    ${k("1","1")}${k("2","2")}${k("3","3")}${k("=","＝","eq")}
    ${k("0","0")}${k("00","00","zero")}${k("000","000","zero")}
  </div>`;
}

         <span style="color:#a7b2af">初回の読み取りにはインターネット接続が必要です</span></div>
       <button class="photobtn main big" data-act="read-crop">🔍 この枠の金額を読み取る</button>
       <button class="photobtn" data-act="shot-total">📸 撮り直す</button>

    : `<button class="photobtn main" data-act="shot-total">📸 レシートを撮る
         <span class="sm">合計の行にアップで寄せて撮ってください</span></button>
       <div class="ocrnote" id="ocrnote">${escapeHtml(st.ocrNote||"")}</div>
       ${choicesHtml}`;
  $("sheet").innerHTML=`<div class="grip"></div>
    <div class="sheethd"><h3>${st.mode==="edit"?"記録をなおす":"記録する"}</h3>
      <button class="close" data-act="close-sheet" aria-label="閉じる">✕</button></div>
    <div class="typetog">

      ${st.type==="expense" ? `<button class="fixtog${st.recurring?" on":""}" data-act="toggle-recurring">

    </div>

    <div class="row2">

  if(st.photo) initCrop();
