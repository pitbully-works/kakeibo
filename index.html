/* 日記の日付えらび。
   書きかけの本文は保存されないので、変わっていれば必ず確かめてから移る。 */
function pickDiaryDate(value){
  if(!Core.validateDateString(value)){ toast(L("日付を選んでください","Please choose a date")); return; }
  const cur = diaryEditDate || todayISO();
  if(value === cur) return;
  const el = $("d-text");
  const stored = (state.diary[cur] || {}).text || "";
  const dirty = (el && el.value !== stored) || diaryPhotoPending !== undefined;
  if(dirty && typeof confirm==="function" && !confirm(L("書きかけの内容は保存されません。日付を変えますか？","What you've written won't be saved. Change the date anyway?"))){
    const dp = $("d-date"); if(dp) dp.value = cur;    // 選び直しを取り消す
    return;
  }
  diaryEditDate = (value === todayISO()) ? null : value;
  diaryPhotoPending = undefined;
  render();
}

async function saveDiary(){
  const el=$("d-text"); const text=el?el.value:"";
  const date=diaryEditDate||todayISO();
  const cur=state.diary[date]||{};
  /* 写真：未変更なら今の写真、null なら外す、文字列なら新規（縮小してから） */
  let photo = diaryPhotoPending!==undefined ? diaryPhotoPending : (cur.photo||null);
  if(photo && diaryPhotoPending) photo = await resizeDataUrl(photo, Core.PHOTO_STORE_MAX, 0.6);

  const before=JSON.parse(JSON.stringify(state.diary));
  const build=(withPhoto)=>{
    const next=Object.assign({}, state.diary);
    if(text.trim()==="" && !(withPhoto&&photo)){ delete next[date]; }   // 本文も写真も無ければ消す
    else {
      const e={ text:text.slice(0,Core.DIARY_MAX) };
      if(withPhoto && photo) e.photo=photo;
      next[date]=e;
    }
    return next;
  };
  state.diary=build(true);
  if(save()){
    diaryEditDate=null; diaryPhotoPending=undefined;
    render(); toast((text.trim()===""&&!photo)?L("日記を消しました","Diary entry deleted"):L("日記を保存しました ✓","Diary saved ✓"));
    return;
  }
  /* 容量オーバー：写真を落として本文だけで再挑戦 */
  state.diary=build(false);
  if(photo && save()){
    diaryEditDate=null; diaryPhotoPending=undefined;
    render(); toast(L("日記を保存しました（写真は容量オーバーで保存できません）","Diary saved — the photo did not fit in storage"));
    return;
  }
  state.diary=before;   // それでも駄目なら完全に戻す
  toast(L("日記を保存できませんでした","Could not save the diary"));
}

let healthRange="month";   // day / week / month
/* グラフの左端の日付。
   -----------------------------------------------------------------------
   ここは2つ間違えやすいところがある。どちらも実際に踏んだ。

   ① setMonth(月-1) を使ってはいけない。
      3月31日に「2月31日」を指すと、JavaScript は3月3日へ繰り越してしまう。
      31日に開いたときだけ、1か月グラフが数日ぶんしか出なくなる。
   ② toISOString() を使ってはいけない。
      ローカルの日付をUTCへ直してしまうので、日本では1日多く、
      アメリカなどでは「昨日」がまるごと消える。
      アプリの他の場所はすべて todayISO()（ローカル）で数えている。

   そこで、日数で引いて todayISO() で書き出す。 */
const HEALTH_RANGE_DAYS={ day:1, week:7, month:30 };
function healthFromDate(){
  const back=HEALTH_RANGE_DAYS[healthRange]||HEALTH_RANGE_DAYS.month;
  return Core.shiftDate(todayISO(), -back);
}
/* 日付 "2026-07-25" → "7/25" */
function mdLabel(iso){ return `${Number(iso.slice(5,7))}/${Number(iso.slice(8,10))}`; }
/* 目もりの数字。0.5きざみなら小数1桁、10きざみなら整数で書く。 */
function tickLabel(v, step){
  const dec = step >= 1 ? 0 : (step >= 0.1 ? 1 : 2);
  return v.toFixed(dec);
}
/* 値の表示（63.60 → 63.6、105 → 105） */
function chartValue(v){ return String(Math.round(v*100)/100); }

/* 折れ線グラフを SVG で描く（外部ライブラリなし）
   縦＝切りのよい目もり／横＝日付／下に「最初→最新と変化量」を出す。 */
function lineChart(series, color, unit){
  if(!series.length) return `<div class="muted" style="text-align:center;padding:14px;font-size:12.5px">${L("この期間の記録はまだありません","No records for this period yet")}</div>`;
  const sc = Core.chartScale(series.map(p=>p.value), Core.CHART_TICKS);
  const W=320, H=158, padL=38, padR=10, padT=12, padB=26;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const n=series.length;
  const x=i=> n>1 ? padL + plotW*(i/(n-1)) : padL + plotW/2;
  const span=(sc.hi-sc.lo)||1;
  const y=v=> padT + plotH*(1-(v-sc.lo)/span);

  /* 横線（目もり）と、左の数字 */
  const grid = sc.ticks.map(t=>{
    const yy=y(t).toFixed(1);
    return `<line x1="${padL}" x2="${W-padR}" y1="${yy}" y2="${yy}" stroke="#e7ecee" stroke-width="1"></line>`
         + `<text x="${padL-6}" y="${(y(t)+3.4).toFixed(1)}" text-anchor="end" font-size="9.5" fill="#647476">${tickLabel(t, sc.step)}</text>`;
  }).join("");

  /* 縦線と、下の日付 */
  const xi = Core.chartLabelIndexes(n, Core.CHART_XLABELS);
  const xaxis = xi.map(i=>{
    const xx=x(i).toFixed(1);
    const anchor = i===0 ? "start" : (i===n-1 ? "end" : "middle");
    return `<line x1="${xx}" x2="${xx}" y1="${padT}" y2="${padT+plotH}" stroke="#eef2f0" stroke-width="1"></line>`
         + `<text x="${xx}" y="${H-8}" text-anchor="${anchor}" font-size="9.5" fill="#647476">${mdLabel(series[i].date)}</text>`;
  }).join("");

  const pts=series.map((p,i)=>`${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(" ");
  const dots=series.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.value).toFixed(1)}" r="3" fill="#fff" stroke="${color}" stroke-width="2"></circle>`).join("");

  /* どれだけ変わったか */
  const ch=Core.seriesChange(series);
  const cls = ch.diff>0 ? "up" : (ch.diff<0 ? "dn" : "");
  const sign = ch.diff>0 ? "＋" : (ch.diff<0 ? "−" : "±");
  const badge = `<span class="chgbadge ${cls}">${sign}${chartValue(Math.abs(ch.diff))}${unit}</span>`;
  const change = n>1
    ? `<div class="chgrow">
         <span>${mdLabel(ch.fromDate)} <b class="mono">${chartValue(ch.first)}${unit}</b></span>
         <span class="ar">→</span>
         <span>${mdLabel(ch.toDate)} <b class="mono">${chartValue(ch.last)}${unit}</b></span>
         ${badge}
       </div>`
    : `<div class="chgrow"><span>${mdLabel(ch.toDate)} <b class="mono">${chartValue(ch.last)}${unit}</b></span><span>${L("（記録が2件になると変化量が出ます）","The change appears once there are two entries")}</span></div>`;

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img">
    ${grid}${xaxis}
    <line x1="${padL}" x2="${padL}" y1="${padT}" y2="${padT+plotH}" stroke="#d7dedb" stroke-width="1"></line>
    <line x1="${padL}" x2="${W-padR}" y1="${padT+plotH}" y2="${padT+plotH}" stroke="#d7dedb" stroke-width="1"></line>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"></polyline>
    ${dots}
  </svg>
  ${change}`;
}

/* 健康ページの「心拍数」カード。

function saveHealth(){
  const g=id=>{ const el=$(id); return el?el.value:""; };
  const entry=Core.normalizeHealthEntry({ weight:g("h-weight"), bpHigh:g("h-bphigh"), bpLow:g("h-bplow"), pulse:g("h-pulse") });

function renderSettings(){
  const s=state.settings;
  const u=Core.storageUsage(state);

/* ---------- 記録シート ---------- */
let sheetState=null; // {mode:'add'|'edit', id?, type, amount, cat, date, memo, photo}
/* シートの amount は「打ち込む側の数」＝主単位（ドル・円）で持つ。
   内部（最小単位）との行き来は、この2つだけを通す。
   第1段階では小数を打てないので、主単位は必ず整数になる
   （セントを打てるようにするのは第2段階）。 */
/* 内部（最小単位）→ 打ち込み欄の字（主単位）。小数のある通貨では "12.34" になる。
   丸めてはいけない。丸めると、直すたびにセントが落ちる。 */
function decOf(country){ return Core.currencyDecimals(Core.countryRule(Core.normalizeCountry(
  country===undefined ? (state.settings&&state.settings.country) : (country.country||country))).currency); }
function sheetMajor(minorValue, country){ return Core.minorToMajorText(minorValue, decOf(country)); }
/* いま開いている記録の小数桁 */
function sheetDec(){
  const st=sheetState;
  if(st && st.mode==="edit"){
    const t=state.tx.find(x=>x.id===st.id);
    if(t) return decOf(txCountryOf(t));
  }
  return decOf(curCountry());
}
/* 記録電卓の計算桁。日本円も計算中だけは小数第2位まで保持する。
   保存時の通貨桁は sheetDec() のままなので、JPだけ記録時に1円へ四捨五入される。
   US/GB/CA/AU は従来どおり2桁のまま保存される。 */
function sheetCalcDec(){
  const d=sheetDec();
  return d===0 ? 2 : d;
}
/* その記録がどの国のものか。国の印が無ければ日本。
   打ち込みの換算は「いま選んでいる国」ではなく **その記録の国** で決める。
   ここを取り違えると、US画面で日本の記録を直したときに100倍になる。 */
function txCountryOf(t){ return Core.normalizeCountry(t && t.country); }
function openRecord(editId){
  if(editId){ const t=state.tx.find(x=>x.id===editId); if(!t) return;
    sheetState={mode:"edit", id:t.id, type:t.type, amount:String(sheetMajor(t.amount, txCountryOf(t))), cat:t.cat, date:t.date, memo:t.memo||"", photo:t.photo||null, shot:"total", recurring:t.recurring===true};
  } else {
    sheetState={mode:"add", type:"expense", amount:"", cat:"food", date:todayISO(), memo:"", photo:null, shot:"total", recurring:false};
  }
  sheetState.calc=Core.calcFrom(sheetState.amount, sheetCalcDec());
  renderSheet(); showSheet(true);
}
/* 電卓のキー。押した結果は Core.calcPress が決める（計算式は画面に書かない）。 */
function calcPad(calc){
  const k=(key,label,cls)=>`<button class="${cls||""}" data-act="calc" data-key="${key}">${label}</button>`;
  const op=(key,label)=>k(key,label,`op${calc.op===key?" on":""}`);
  return `<div class="calcpad">
    ${k("C","C","fn")}${k("back","⌫","fn")}${op("/","÷")}${op("*","×")}
    ${k("7","7")}${k("8","8")}${k("9","9")}${op("-","−")}
    ${k("4","4")}${k("5","5")}${k("6","6")}${op("+","＋")}
    ${k("1","1")}${k("2","2")}${k("3","3")}${k("=","＝","eq")}
    ${k("0","0")}${k(".",".","zero")}${k("00","00","zero")}
  </div>`;
}

function recordCalcCatEmoji(type, key){
  const cats=type==="income"?INC_CATS:EXP_CATS;
  const c=cats.find(x=>x.k===key); return c&&c.e?c.e:"🧾";
}
function recordCalcHistoryHtml(){
  const hs=(state.recordCalcHistory||[]).slice().reverse();
  if(!hs.length) return `<div class="muted" style="font-size:12px;text-align:center;padding:10px">${L("まだ計算履歴はありません","No calculation history yet")}</div>`;
  return hs.map(h=>{
    const expr=String(h.expr||"").replace(/\s+/g,"").replace(/＝$/g,"");
    const result=String(h.result||"").replace(/(\.\d*?[1-9])0+$/,"$1").replace(/\.0+$/,"");
    const text=expr===result ? expr : `${expr}=${result}`;
    return `<div class="rechistrow"><div class="rechistexpr mono">${recordCalcCatEmoji(h.type,h.cat)} ${escapeHtml(text)}</div><div class="rechistacts"><button data-act="record-hist-del" data-id="${escapeAttr(h.id)}">${L("削除","Delete")}</button></div></div>`;
  }).join("");
}

function readSheetInputs(){

function showSheet(on){ $("scrim").classList.toggle("show",on); $("sheet").classList.toggle("show",on);
  if(!on){ releaseOcrImage(sheetState); sheetState=null; clearPending(); } }

/* いま何が起きているかを必ず画面に出す（黙って失敗しない） */
/* 読み取りの決まり文句。ここは呼び出し側の書き方を変えずに入れ替える
   （どの段階を表示しているかを、テストがソースの形で見張っているため）。 */
const STATUS_EN = { "画像を調整しています…": "Adjusting the image…" };
function setStatus(msg){
  if(isEn() && STATUS_EN[msg]) msg = STATUS_EN[msg];
  if(sheetState){ sheetState.ocrNote=msg; const n=$("ocrnote"); if(n){ n.textContent=msg; return; } }
  toast(msg);
}

/* ---------- カメラ起動でページが再読み込みされても記録を続けられるように ---------- */
const PENDING_KEY="kakeibo:v1:pending";
function savePending(){
  try{
    const st=sheetState; if(!st) return;
    const light={mode:st.mode,id:st.id||null,type:st.type,amount:st.amount,cat:st.cat,date:st.date,memo:st.memo};
    sessionStorage.setItem(PENDING_KEY, JSON.stringify(light));
  }catch(e){}
}
function loadPending(){
  try{ const raw=sessionStorage.getItem(PENDING_KEY); return raw?JSON.parse(raw):null; }catch(e){ return null; }
}
function clearPending(){ try{ sessionStorage.removeItem(PENDING_KEY); }catch(e){} }

/* 写真が届いたのにシートが消えていたら、作り直して必ず受け取る */
function ensureSheetForPhoto(){
  if(sheetState) return;
  const p=loadPending();
  sheetState = p
    ? {mode:p.mode||"add", id:p.id||undefined, type:p.type||"expense", amount:p.amount||"",
       cat:p.cat||"food", date:p.date||todayISO(), memo:p.memo||"", photo:null}
    : {mode:"add", type:"expense", amount:"", cat:"food", date:todayISO(), memo:"", photo:null};
  showSheet(true);
}

/* ---------- 写真＋OCR（任意・失敗しても写真は残る） ---------- */
function onPhotoPicked(file){
  const reader=new FileReader();
  ensureSheetForPhoto();
  const kb=Math.round((file.size||0)/1024);
  setStatus(L(`写真を受け取りました（${kb}KB / ${file.type||"形式不明"}）。準備中…`, `Photo received — ${kb}KB, ${file.type||"unknown type"}. Getting it ready…`));
  reader.onerror=()=>{ setStatus(L("写真を読み込めませんでした。もう一度おねがいします","Could not read that photo. Please try again")); };
  reader.onload=async()=>{
    try{
      setStatus(L("写真を準備中…","Getting the photo ready…"));
      /* 表示・保存用は縮小版。読み取り用は高解像度版を別に持つ（保存しない）。 */
      const shrunk=await resizeDataUrl(reader.result, Core.PHOTO_VIEW_MAX, 0.85);
      const hires =await resizeDataUrl(reader.result, Core.PHOTO_OCR_MAX, 0.95);
      ensureSheetForPhoto();
      if(!shrunk || shrunk.length<100){ setStatus(L("この形式の写真は表示できませんでした。もう一度撮ってください","That photo format can't be shown. Please take it again")); return; }
      releaseOcrImage(sheetState);        // 前の写真の高解像度版を先に手放す
      sheetState.photo=shrunk;
      sheetState.photoHi=hires||shrunk;   // メモリ内だけ。localStorageには入れない
      sheetState.crop=Object.assign({},Core.CROP_DEFAULT);
      sheetState.ocrNote="枠を合計に合わせて、読み取りボタンを押してください";
      sheetState.ocrChoices=null;
      clearPending();
      renderSheet(); showSheet(true);
      loadTesseract().catch(()=>{});   // 枠を合わせている間に先読み
    }catch(e){ setStatus(L("写真を扱えませんでした。金額は手で入れられます","Could not handle that photo. You can type the amount yourself")); }
  };
  reader.readAsDataURL(file);
}
/* 写真を指定の長辺まで縮める。保存領域を超えないための要。 */
function resizeDataUrl(src, maxEdge, quality){
  return new Promise((resolve)=>{
    const im=new Image();
    im.onload=()=>{
      try{
        const out=Core.fitSize(im.naturalWidth, im.naturalHeight, maxEdge);
        const cv=document.createElement("canvas"); cv.width=out.w; cv.height=out.h;
        const cx=cv.getContext("2d");
        cx.imageSmoothingEnabled=true; cx.imageSmoothingQuality="high";
        cx.drawImage(im,0,0,out.w,out.h);
        resolve(cv.toDataURL("image/jpeg", quality));
      }catch(e){ resolve(src); }
    };
    im.onerror=()=>resolve(src);
    im.src=src;
  });
}

/* 枠の中だけを切り出して読む。他の金額は物理的に視界に入らない。 */
/* 読み取り用の高解像度画像をメモリから手放す */
function releaseOcrImage(st){
  const t = st || sheetState;
  if(t && t.photoHi){ t.photoHi = null; }
}

async function readCrop(){
  const st=sheetState; if(!st||!st.photo) return;
  st.ocrChoices=null;
  setStatus("画像を調整しています…");
  renderSheet();
  try{
    const crop = st.crop||Core.CROP_DEFAULT;
    const source = st.photoHi || st.photo;

    /* 枠3種 × 画像処理 の切り抜きは、必要になったときだけ1回作って使い回す */
    const cache={};
    const imageFor = async (cropKey, style)=>{
      const key=cropKey+"|"+style;
      if(!cache[key]) cache[key] = await cropToDataUrl(source, Core.cropVariant(crop, cropKey), style);
      return cache[key];
    };

    const candidates=[];
    let runs=0;
    for(let i=0;i<Core.OCR_PLAN.length;i++){
      setStatus(i===0 ? L("金額を確認しています…","Checking the amount…") : L("もう少し詳しく確認しています…","Taking a closer look…"));
      const jobs=[];
      for(const step of Core.OCR_PLAN[i]){
        jobs.push({ img: await imageFor(step.crop, step.image), psm: step.psm });
      }
      const got = await ocrCandidates(jobs);
      runs += jobs.length;
      got.forEach(c=>candidates.push(c));
      if(Core.ocrEnough(candidates)) break;
    }

    /* 先頭の桁が欠けていそうなら、その1文字だけを画像から読み直す（最大1回） */
    const details = candidates.map(c=>c.detail).filter(Boolean);
    const plan = Core.reconstructionPlan(details, crop);
    const already4 = candidates.some(c=>Number(c.amount)>=1000);
    if(plan && !already4){
      setStatus(L("先頭の桁を読み直しています…","Re-reading the first digit…"));
      const base = candidates.filter(c=>c.amount===plan.base);
      const agree = base.length || 1;
      const conf  = base.reduce((a,c)=>Math.max(a,Number(c.confidence)||0),0);
      let digits = plan.digits || null;
      if(plan.kind==="strip"){
        try{
          const stripImg = await cropToDataUrl(source, plan.strip, "bw");
          const got = await ocrCandidates([{ img:stripImg, psm:"10" }], { raw:true });
          digits = Core.firstDigit(got);
        }catch(e){ digits = null; }
      }
      const rebuilt = Core.buildReconstructed(plan.base, digits, { confidence:conf, agree:agree, posScore:0.6 });
      if(rebuilt) candidates.push(rebuilt);
    }

    const ranked = Core.rankCandidates(candidates);
    if(!ranked.length){
      st.ocrChoices=null;
      setStatus(L("枠の中に数字が見つかりませんでした。枠を合計に合わせ直すか、金額を入れてね","No digits found inside the box. Move the box onto the total, or type the amount"));
      renderSheet(); return;
    }
    if(Core.needsConfirmation(ranked)){
      st.ocrChoices = ranked.slice(0, Core.MAX_CHOICES).map(r=>r.amount);
      setStatus(L("どれが合計か選んでください","Choose which one is the total"));
      renderSheet(); return;
    }
    st.ocrChoices=null;
    st.amount=Core.minorToMajorText(ranked[0].amount, sheetDec());
    setStatus(L(`金額を「${yen(ranked[0].amount)}」と読みました。ちがう時は直してね`, `Read the amount as ${yen(ranked[0].amount)}. Change it if that's wrong`));
    renderSheet();
  }catch(e){
    const why=(e&&e.message)?e.message:String(e||"原因不明");
    st.ocrChoices=null;
    setStatus(L(`読み取れませんでした：${why}。金額は手で入れられます`, `Could not read it: ${why}. You can type the amount yourself`));
    renderSheet();
  }finally{
    /* 高解像度画像はここでは解放しない。
       枠を直してもう一度読み取るとき、表示用(1600px)へ落ちてしまうため。
       解放するのは：シートを閉じた時／写真を消した時／写真を撮り直した時／記録を確定した時。
       加工画像 cache はこの関数のローカル変数なので、抜ければ参照が消える。 */
  }
}

/* 枠の範囲を切り出し、拡大＋白黒コントラスト調整をしてから渡す */
function cropToDataUrl(src, crop, style){
  return new Promise((resolve,reject)=>{
    const im=new Image();
    im.onload=()=>{
      try{
        const nat={w:im.naturalWidth, h:im.naturalHeight};
        const r=Core.cropRect(crop, nat);
        const out=Core.cropOutputSize(r.w, r.h);
        const cv=document.createElement("canvas"); cv.width=out.w; cv.height=out.h;
        const cx=cv.getContext("2d");
        cx.imageSmoothingEnabled=true; cx.imageSmoothingQuality="high";
        cx.drawImage(im, r.x, r.y, r.w, r.h, 0, 0, out.w, out.h);
        try{
          const d=cx.getImageData(0,0,out.w,out.h);
          Core.prepareForOcr(d.data, out.w, out.h, style);  // 反転の判断もここ1か所だけ
          cx.putImageData(d,0,0);
        }catch(e){}
        resolve(cv.toDataURL("image/png"));
      }catch(e){ reject(e); }
    };
    im.onerror=reject;
    im.src=src;
  });
}

/* 読み取りライブラリの取得先。
   ①自分のサーバー（tess/ に置いた場合）→ ②jsDelivr → ③unpkg の順に試す。
   ①があれば外部CDNに一切依存せず、オフラインでも動く。 */
const TESSERACT_VERSION = "5.1.1";   // 完全固定（@5 のような範囲指定にしない）
const TESS_LOCAL_DIR = "./tess";
const TESSERACT_SOURCES = [
  { name:"この端末のサーバー", url: TESS_LOCAL_DIR + "/tesseract.min.js", local:true },
  /* 版は完全固定。jsDelivr と unpkg で同じ版を使う。
     worker / core / 言語データも、この版に付属するものが使われる。 */
  { name:"jsDelivr",          url:"https://cdn.jsdelivr.net/npm/tesseract.js@" + TESSERACT_VERSION + "/dist/tesseract.min.js" },
  { name:"unpkg",             url:"https://unpkg.com/tesseract.js@" + TESSERACT_VERSION + "/dist/tesseract.min.js" }
];
let tessSource=null;

/* 外部スクリプトを読み込む。読み込み完了かエラーかを必ず返す。 */
function loadScript(src){
  return new Promise((resolve,reject)=>{
    const existing=document.querySelector(`script[data-src="${src}"]`);
    if(existing){
      if(existing.dataset.loaded==="1") return resolve();
      existing.addEventListener("load",()=>resolve());
      existing.addEventListener("error",()=>reject(new Error("読み込み失敗")));
      return;
    }
    const el=document.createElement("script");
    el.src=src; el.async=true; el.dataset.src=src;
    el.onload=()=>{ el.dataset.loaded="1"; resolve(); };
    el.onerror=()=>reject(new Error("読み込み失敗"));
    document.head.appendChild(el);
  });
}

async function loadTesseract(){
  if(window.Tesseract) return window.Tesseract;
  const tried=[];
  for(const src of TESSERACT_SOURCES){
    try{
      await loadScript(src.url);
      if(window.Tesseract){ tessSource=src; return window.Tesseract; }
      tried.push(src.name+"：取得できたが中身が違う");
    }catch(e){ tried.push(src.name+"："+((e&&e.message)?e.message:"つながらない")); }
  }
  const online = (typeof navigator!=="undefined" && "onLine" in navigator) ? (navigator.onLine?"通信あり":"オフライン") : "通信状態不明";
  throw new Error(
    "初回のレシート読み取りにはインターネット接続が必要です。読み取れない場合は金額を手入力してください" +
    `（${online}／${tried.join(" ／ ")}）`
  );
}

/* 自前で置いた場合は、部品の場所も自分のサーバーに向ける */
function tessWorkerOptions(){
  if(tessSource && tessSource.local){
    return {
      workerPath: TESS_LOCAL_DIR + "/worker.min.js",
      corePath:   TESS_LOCAL_DIR + "/core",
      langPath:   TESS_LOCAL_DIR + "/lang"
    };
  }
  return {};
}

/* 数字だけを読む設定で、渡された「画像 × 読み取り方」の組を順に試す。
   偶然の誤読は重ならないので、同じ数字が複数回出たものを採用する。 */
async function ocrCandidates(jobs, opts){
  const T = await loadTesseract();
  const out=[];
  let worker=null;
  try{
    worker=await T.createWorker("eng", 1, Object.assign({}, tessWorkerOptions(), {
      logger: m=>{
        if(m && m.status && typeof m.progress==="number"){
          const pct=Math.round(m.progress*100);
          if(m.status.indexOf("load")>=0||m.status.indexOf("initial")>=0) setStatus(L(`読み取りの準備中… ${pct}%（初回だけ少し時間がかかります）`, `Getting the reader ready… ${pct}% — the first time takes a little longer`));
          else if(m.status.indexOf("recogniz")>=0) setStatus(L(`読み取り中… ${pct}%`, `Reading… ${pct}%`));
        }
      }
    }));
    for(const job of jobs){
      try{
        await worker.setParameters({
          tessedit_pageseg_mode: job.psm,
          /* 小数のある通貨では通貨記号も読ませる（$9.99 の $ を落とさない） */
          tessedit_char_whitelist: (opts&&opts.raw) ? "0123456789" : "0123456789,.¥￥$£€"
        });
        const { data } = await worker.recognize(job.img);
        const conf = data.confidence||0;
        if(opts&&opts.raw){ out.push({ text:data.text, confidence:conf }); continue; }
        Core.amountDetails(data.text, sheetDec()).forEach(d=>{
          out.push({
            amount:d.amount, raw:d.raw, confidence:conf,
            posScore:Core.textPositionScore(d),
            context:Core.totalHint(d),                 // ¥ / カンマ / 合計 などの手がかり
            truncated:!!Core.truncatedLeading(d),      // 先頭の桁が欠けている疑い
            detail:d,
            source:"ocr",
          });
        });
      }catch(e){}
    }
  } finally { if(worker){ try{ await worker.terminate(); }catch(e){} } }
  return out;
}

/* 枠のドラッグ（移動／左上・右下でサイズ変更）
   注意：setPointerCapture を画像全体にかけると、指を離したあとも
   タップが画像に吸われてボタンが押せなくなる。ドラッグ中だけ
   document で受けて、終わったら必ず外す。 */
function initCrop(){
  const wrap=$("cropwrap"), box=$("cropbox");
  if(!wrap||!box||!sheetState) return;
  const st=sheetState;
  if(!st.crop) st.crop=Object.assign({},Core.CROP_DEFAULT);
  const apply=()=>{ box.style.left=(st.crop.x*100)+"%"; box.style.top=(st.crop.y*100)+"%";
    box.style.width=(st.crop.w*100)+"%"; box.style.height=(st.crop.h*100)+"%"; };
  apply();

  let mode=null, start=null;

  const onMove=e=>{
    if(!mode||!start) return;
    const dx=(e.clientX-start.px)/start.w, dy=(e.clientY-start.py)/start.h;
    st.crop=Core.moveCrop(start.c, dx, dy, mode);
    apply();
    if(e.cancelable) e.preventDefault();
  };
  const onEnd=()=>{
    mode=null; start=null;
    document.removeEventListener("pointermove",onMove);
    document.removeEventListener("pointerup",onEnd);
    document.removeEventListener("pointercancel",onEnd);
  };

  wrap.addEventListener("pointerdown",e=>{
    const t=e.target;
    if(t.classList&&t.classList.contains("br")) mode="br";
    else if(t.classList&&t.classList.contains("tl")) mode="tl";
    else if(t===box) mode="move";
    else return;                      // 枠の外は無視（他のボタンを邪魔しない）
    const r=wrap.getBoundingClientRect();
    start={px:e.clientX, py:e.clientY, c:Object.assign({},st.crop), w:r.width||1, h:r.height||1};
    document.addEventListener("pointermove",onMove,{passive:false});
    document.addEventListener("pointerup",onEnd);
    document.addEventListener("pointercancel",onEnd);
    if(e.cancelable) e.preventDefault();
  });
}

/* ---------- 保存アクション ---------- */
async function saveTx(){
  readSheetInputs(); const st=sheetState;
  /* ＝ を押さずに「記録する」を押しても、待っている計算を済ませてから記録する。
     calcValue は最小単位を返すので、打ち込み欄の字（主単位）へ戻して持たせる。 */
  if(st.calc && st.calc.op){ st.calc=Core.calcPress(st.calc,"="); st.amount=Core.calcDisplay(st.calc); }
  /* 記録ページの履歴は、計算した金額だけでなく数字を直接入れて記録した場合も残す。
     どちらも txId で実際の家計簿記録と結び、履歴の「削除」でまとめ側の記録も同時に消せるようにする。 */
  const hasCalcHistory = !!(st.calc && st.calc.done && st.calc.expr);
  const calcHistCandidate = {
    id:uid(), txId:"", expr:hasCalcHistory ? st.calc.expr : String(st.amount||""),
    result:hasCalcHistory ? Core.calcDisplay(st.calc) : "", cat:st.cat, type:st.type,
    country:curCountry(), date:st.date
  };
  if(!hasCalcHistory) calcHistCandidate.result=calcHistCandidate.expr;
  /* 直すときは、その記録がもともと持っていた国で換算する。
     新しく作るときは、いま選んでいる国。 */
  const editIdx = st.mode==="edit" ? state.tx.findIndex(x=>x.id===st.id) : -1;
  const recCountry = editIdx>=0 ? txCountryOf(state.tx[editIdx]) : curCountry();
  /* ここが「打ち込み → 内部」の境目。以降はすべて最小単位で扱う。
     小数点を含む字（"12.34"）も、字のまま桁を組んで整数にするので誤差が出ない。 */
  const typed=Core.majorTextToMinorRound(st.amount, decOf(recCountry));
  /* その通貨で表せない桁を打っていたか（円の "1.5" など）。あとで知らせる。 */
  const rounded=Core.majorTextHasExtraDecimals(st.amount, decOf(recCountry));
  if(!typed||typed<=0){ toast(L("金額を入れてね","Please enter an amount")); const ai=$("s-amt"); if(ai) ai.focus(); return; }
  /* 上限で止める。電卓は 9桁×9桁 のような掛け算ができてしまうので、
     ここで切り詰めないと 18桁の金額がそのまま残り、集計がすべて壊れる。
     黙って切り詰めず、切り詰めたことを必ず伝える。 */
  const cap=Core.amountMax(recCountry);
  const amount=Math.min(typed, cap);
  if(amount!==typed){
    const capText=Core.formatAmount(cap, recCountry);
    toast(L(`金額が大きすぎます。${capText} までにしました`,
            `That's too large — capped at ${capText}`));
  }

  /* 保存用に写真を小さくする（そのままだと保存領域を超えて何も残らない）。
     読み取り用の高解像度画像は、保存が成功してから手放す。
     ここで手放すと、保存に失敗してシートが残ったとき、
     枠を直して読み直すと表示用(1600px)へ落ちてしまう。 */
  let photo = st.photo || null;
  if(photo) photo = await resizeDataUrl(photo, Core.PHOTO_STORE_MAX, 0.6);

  /* 「毎月固定」は支出だけの印。収入に切り替えていたら必ず落とす。 */
  const recurring = st.type==="expense" && st.recurring===true;

  const before = JSON.stringify(state.tx);
  const beforeRecordCalcHistory = JSON.stringify(state.recordCalcHistory||[]);
  /* 国の印。直すときは、その記録がもともと持っていた国を必ず引き継ぐ
     （US滞在中に日本の記録を直しても、日本の記録のままにする）。 */
  const idx = editIdx;

  const rec={id:uid(),type:st.type,amount,cat:st.cat,date:st.date,memo:st.memo,photo:photo};
  if(recurring) rec.recurring=true;   // オフのときはキーごと持たない（保存を軽くする）
  if(recCountry!=="JP") rec.country=recCountry;   // JPは印を持たない
  if(st.mode==="edit") rec.id=st.id;
  if(calcHistCandidate){
    calcHistCandidate.txId=rec.id;
    state.recordCalcHistory=(state.recordCalcHistory||[]).concat([calcHistCandidate]).slice(-50);
  }

  /* 記録は必ず core.js の normalizeTransaction を通してから state に入れる。
     復元のときだけ整えて、手で入れたときは素通し、という作りにすると、
     同じ内容でも経路によって中身が変わってしまう。整える場所はひとつだけにする。 */
  const safe=Core.normalizeTransaction(rec);
  if(!safe){ toast(L("この内容では記録できません","That can't be recorded as it is")); return; }
  /* 計算コアが落としたキーは、こちらの rec からも消す。
     いまは到達しない（rec に付くキーは、コアがどれも落とさない）。
     将来キーを増やしたときに、片方だけ残るのを防ぐための保険として置いてある。 */
  Object.keys(rec).forEach(k=>{ if(!(k in safe)) delete rec[k]; });
  Object.assign(rec, safe);

  if(st.mode==="edit"){ if(idx>=0) state.tx[idx]=rec; }
  else state.tx.push(rec);

  if(save()){
    releaseOcrImage(st);            // 記録が確定した。高解像度はここで手放す
    openRecord(null);
    /* その通貨より細かい桁を打っていたら、四捨五入したことを必ず知らせる。
       黙って額が変わるのがいちばん困る（円で 1.5 と打つと ¥2 になる）。 */
    if(rounded){
      toast(L(`${yen(amount)} として記録しました（${roundUnit()}未満は四捨五入）`,
              `Recorded as ${yen(amount)} — rounded to the nearest ${roundUnit()}`));
    }else{
      toast(st.mode==="edit"?L("更新しました","Updated"):L("記録できました ✓","Recorded ✓"));
    }
    return;
  }

  /* 入りきらなかった。写真だけ落として、記録そのものは必ず残す。 */
  if(photo){
    const t2 = st.mode==="edit" ? state.tx.find(x=>x.id===st.id) : state.tx[state.tx.length-1];
    if(t2) t2.photo=null;
    if(save()){
      releaseOcrImage(st);          // 写真は諦めたが記録は確定した
      openRecord(null);
      toast(L("記録しました（写真は容量オーバーで保存できません）","Recorded — the photo did not fit in storage"));
      return;
    }
  }

  /* それでも駄目なら元に戻して、理由をはっきり伝える。
     シートは開いたままなので、photoHi は解放しない（枠を直して読み直せるように）。 */
  state.tx = JSON.parse(before);
  state.recordCalcHistory = JSON.parse(beforeRecordCalcHistory);
  const msg = isQuotaError(lastSaveError)
    ? L("保存できません。せっていの「写真をすべて消す」で空きを作ってください",
        "Storage is full. Use \"Delete all photos\" in Settings to make room")
    : L("この端末では保存が使えません（プライベートブラウズ等）",
        "Saving isn't available on this device — private browsing, perhaps");
  toast(msg);
}

function delTx(){
  if(!sheetState||sheetState.mode!=="edit") return;
  const before = JSON.parse(JSON.stringify(state.tx));   // 失敗したら戻せるように退避
  state.tx = state.tx.filter(t=>t.id!==sheetState.id);
  if(!save()){
    state.tx = before;            // 消えたように見えて復活する、を防ぐ
    toast(L("削除できませんでした","Could not delete it"));
    return;                       // 編集シートは閉じない
  }
  showSheet(false); render(); toast(L("削除しました","Deleted"));
}

/* 予定を1件足す。保存に失敗したら、足す前に完全に戻す。 */
function addPlan(date){
  if(!date) return;
  const text=($("p-text")?$("p-text").value:"").trim();
  if(!text){ toast(L("予定を書いてください","Please write what's planned")); focusField("p-text"); return; }
  const before=JSON.parse(JSON.stringify(state.plans||{}));
  const list=(state.plans[date]||[]).slice();
  if(list.length>=Core.PLAN_PER_DAY_MAX){ toast(L(`1日に入れられるのは ${Core.PLAN_PER_DAY_MAX}件までです`, `You can add up to ${Core.PLAN_PER_DAY_MAX} a day`)); return; }
  list.push({ id:uid(), time:Core.normalizeTimeString($("p-time")?$("p-time").value:""),
              text:text.slice(0,Core.PLAN_TEXT_MAX), done:false });
  state.plans[date]=Core.sortPlans(list);
  if(!save()){ state.plans=before; toast(L("予定を保存できませんでした","Could not save the schedule")); render(); return; }
  toast(L("予定を入れました ✓","Added to the schedule ✓")); render();
}

/* 予定を1件消す */
function delPlan(date, id){
  if(!date||!id||!state.plans[date]) return;
  const before=JSON.parse(JSON.stringify(state.plans));
  state.plans[date]=state.plans[date].filter(p=>p.id!==id);
  if(!state.plans[date].length) delete state.plans[date];
  if(!save()){ state.plans=before; toast(L("消せませんでした","Could not delete it")); }
  render();
}

/* 済み／未済を切り替える */
function togglePlan(date, id){
  if(!date||!id||!state.plans[date]) return;
  const before=JSON.parse(JSON.stringify(state.plans));
  state.plans[date]=state.plans[date].map(p=> p.id===id ? Object.assign({}, p, {done:!p.done}) : p);
  if(!save()){ state.plans=before; toast(L("保存できませんでした","Could not save")); }
  render();
}

/* 内訳の画面へ移るとき、設定の書きかけを消さないための静かな保存。
   画面は動かさず、うまくいかなければ何もしない（元の値のまま）。 */
function readSettingsForm(base){
  const g=id=>{ const el=$(id); return el?el.value:null; };
  if(g("f-birth")===null) return Core.normalizeSettings(base||state.settings);
  const num=v=>{ const n=parseInt(String(v).replace(/[^\d]/g,""),10); return isNaN(n)?0:n; };
  const s=Object.assign({}, base||state.settings);
  s.birth=Core.normalizeBirth(g("f-birth"));
  s.goalName=(g("f-gname")||"").slice(0,24);
  /* 打ち込みは主単位。内部の最小単位へ直してから設定に入れる。 */
  s.goalTarget=settingMinor(g("f-gtarget"), s); s.goalCurrent=settingMinor(g("f-gcur"), s);
  s.cycleStart=Core.normalizeCycleStart(g("f-cycle"));
  return Core.normalizeSettings(s);
}

function switchMoneyCountry(next){
  next=Core.pickCountry(next);
  const old=curCountry();
  if(next===old) return save();
  const before=JSON.parse(JSON.stringify(state));
  /* 現在の国の保存済み設定を、その国のプロファイルへ退避してから切り替える。
     入力欄は通常350msの自動保存で state.settings に反映されるため、
     国の select を変えた瞬間に他の欄を読み直して0で潰さない。 */
  state.moneyProfiles=Core.normalizeMoneyProfiles(state.moneyProfiles, old==="JP"?state.settings:null);
  state.moneyProfiles[old]=Core.normalizeSettings(Object.assign({},state.settings,{country:old}));
  const sharedBirth=state.settings.birth;
  state.settings=Core.settingsForCountry(state.moneyProfiles,next,sharedBirth);
  if(!save()){ state=before; return false; }
  return true;
}

/* 内訳の画面へ移るとき、設定の書きかけを消さないための静かな保存。 */
function saveSettingsQuiet(){
  const c0=$("f-country");
  if(c0 && Core.pickCountry(c0.value)!==curCountry()) return switchMoneyCountry(c0.value);
  const before=JSON.parse(JSON.stringify(state.settings));
  state.settings=readSettingsForm(state.settings);
  if(!save()){ state.settings=before; return false; }
  return true;
}

function saveSettings(){
  const before=JSON.parse(JSON.stringify(state));
  const c0=$("f-country");
  const next=c0?Core.pickCountry(c0.value):curCountry();
  if(next!==curCountry()){
    if(!switchMoneyCountry(next)){ state=before; toast(T("set.saveFailed")); return; }
  }else{
    state.settings=readSettingsForm(state.settings);
    if(!save()){ state=before; toast(T("set.saveFailed")); return; }
  }
  toast(T("set.saved")); view="home"; render();
}

/* ---------- 連携：ライフプラン形式の月次スナップショット ---------- */
function purgePhotos(){
  const n=state.tx.filter(t=>t.photo).length;
  if(!n){ toast(L("消せる写真はありません","There are no photos to delete")); return; }   // 保存処理そのものを行わない
  const before = JSON.parse(JSON.stringify(state.tx)); // 失敗したら戻せるように退避
  state.tx.forEach(t=>{ t.photo=null; });

    toast(L("写真を消せませんでした","Could not delete the photos"));

  }
  render(); toast(L(`写真${n}枚を消しました（記録は残っています）`, `Deleted ${n} photos — the records are still there`));
}

/* --- バックアップの読み込み（復元） --- */
function pickBackup(){ const el=$("backupInput"); if(el){ el.value=""; el.click(); } }

function onBackupPicked(file){
  const el=$("backupInput");
  const clear=()=>{ if(el) el.value=""; };   // 同じファイルをもう一度選べるようにする
  if(!file){ clear(); return; }
  const reader=new FileReader();
  reader.onerror=()=>{ toast(L("ファイルを読み込めませんでした","Could not read that file")); clear(); };
  reader.onload=()=>{
    let restored;
    try{
      const raw = Core.parseBackupJson(reader.result);
      restored = Core.normalizeBackup(raw);         // ここで壊れた値を安全な形に整える
    }catch(e){
      toast(L(`読み込めません：${(e&&e.message)||"形式が違います"}`, `Could not load it: ${(e&&e.message)||"the format is wrong"}`));
      clear(); return;                              // 現在のデータは一切変更しない
    }

    const ok = confirm(
      "現在のデータを上書きします。\n先にバックアップを書き出すことをおすすめします。\n\n" +
      `復元する記録：${restored.tx.length}件` +
      (restored.dropped ? `（読み取れなかった${restored.dropped}件は除外）` : "") +
      "\n\n続けますか？"
    );
    if(!ok){ clear(); return; }                     // キャンセル：何も変えない

    const before = JSON.parse(JSON.stringify(state));
    // state.settings = restored.settings; 旧形式の目印。実際は下で国別プロファイルから復元する。
    state.moneyProfiles = restored.moneyProfiles || Core.normalizeMoneyProfiles(null, restored.settings);
    state.settings = Core.settingsForCountry(state.moneyProfiles, restored.settings.country, restored.settings.birth);
    state.tx = restored.tx;
    state.health = restored.health || {};
    state.diary = restored.diary || {};
    state.plans = restored.plans || {};   // 予定も復元する（入れ忘れると古い予定が残る）
    state.pulse = restored.pulse || [];   // 心拍数の履歴も復元する
    if(!save()){
      state = before;                               // 保存できないなら元のまま
      toast(L("バックアップを復元できませんでした","Could not restore the backup"));
      clear(); return;
    }
    view="home"; render();
    toast(L(`バックアップを復元しました（${restored.tx.length}件）`, `Backup restored — ${restored.tx.length} records`));
    clear();
  };
  reader.readAsText(file);
}
/* 文字を渡す。
   iPhone（iOS Safari）は <a download> でファイルを保存できず、
   押しても何も起きないように見える。まずクリップボードへコピーし、
   コピーできない端末だけ、これまでどおりファイルに書き出す。
   done / fallbackMsg は、呼ぶ側の言葉づかいに合わせるため受け取る。 */
function shareText(name, text, doneMsg, fileMsg){
  const toFile = () => { downloadText(name, text); toast(fileMsg); };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>toast(doneMsg), toFile);
      return;
    }
  }catch(e){ /* コピーできない端末は下へ */ }
  toFile();
}

/* ファイルとして残す。
   バックアップは「読み込む」がファイル選びなので、文字のコピーでは戻せない。
   ところが iPhone は <a download> でファイルを保存できず、押しても何も残らない。
   そこで、まず共有シート（「ファイルに保存」が選べる）を試し、
   使えない端末ではこれまでどおりのダウンロードにする。
   共有はタップの中でしか呼べないので、ボタンからそのまま呼ぶこと。 */
function saveFile(name, text, mime, doneMsg){
  const type = mime || "application/json";
  const toDownload = () => { downloadText(name, text, type); toast(doneMsg); };
  try{
    if(navigator.share && navigator.canShare && typeof File === "function"){
      const file = new File([text], name, { type: type });
      if(navigator.canShare({ files:[file] })){
        navigator.share({ files:[file], title: name })
          .then(()=>toast(doneMsg), toDownload);     // 取り消し・失敗ならダウンロードへ
        return;
      }
    }
  }catch(e){ /* 共有できない端末は下へ */ }
  toDownload();
}

function downloadText(name,text,mime){
  const blob=new Blob([text],{type:mime||(/\.csv$/i.test(name)?"text/csv":"application/json")}); const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },500);
}

function focusField(id){
  if(!id) return;
  setTimeout(()=>{ const el=$(id); if(!el) return;
    el.scrollIntoView({block:"center",behavior:"smooth"});
    try{ el.focus({preventScroll:true}); }catch(e){ el.focus(); } }, 60);
}

let toastT=null;
function toast(msg){ const el=$("toast"); el.innerHTML=`<span class="ck">✓</span>${escapeHtml(msg).replace("✓","")}`;
  el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),1900); }
/* ' も逃がす。いまは属性をすべて " で囲んでいるので実害は無いが、
   将来どこか1か所を ' で囲んだ瞬間に穴になるため、ここで塞いでおく。 */
function escapeHtml(s){ return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
/* 属性に入れる値。escapeHtml が " も ' も逃がすので、そのまま使える。 */
function escapeAttr(s){ return escapeHtml(s); }

/* 端末の見分けがつく程度の短い文字列（個人が特定される情報は入れない） */
function pulseDeviceTag(){
  try{
    const ua = (navigator && navigator.userAgent) || "";
    const m = ua.match(/(iPhone|iPad|Android|Macintosh|Windows)/);
    const os = (ua.match(/OS[ ](\d+[_.]\d+)/) || [])[1] || (ua.match(/Version\/(\d+\.\d+)/) || [])[1] || "";
    const sc = (typeof screen !== "undefined" && screen) ? (screen.width + "x" + screen.height) : "";
    return [(m ? m[1] : "unknown"), os.replace("_", "."), sc].filter(Boolean).join(" ");
  }catch(e){ return "unknown"; }
}
/* 保存する日時。端末の時計そのままの読みやすい形（世界標準時に直さない）。 */

/* 1コマを 16×16 に縮めるための作業用キャンバス（画像は残さない） */
function pulseCanvasCtx(){

/* カメラが開けなかった理由を、直し方まで含めた言葉にする。 */
function pulseCamError(e){
  const name=(e&&e.name)||"不明";
  if(name==="NotAllowedError"){
    if(isStandalonePWA()){
      return "カメラの使用が許可されませんでした。ホーム画面のアプリは開くたびに確認が出ます。"
        +"確認が出てこないときは、設定 → アプリ → Safari → カメラ を「確認」にしてから、もう一度お試しください。";
    }
    return "カメラの使用が許可されませんでした。アドレスバーの「ぁあ」→ Webサイトの設定 → カメラ を「許可」にしてください。";
  }
  if(name==="NotFoundError") return "カメラが見つかりませんでした。";
  if(name==="NotReadableError") return "ほかのアプリがカメラを使っています。カメラアプリなどを閉じてから、もう一度お試しください。";
  if(name==="OverconstrainedError") return "このカメラでは指定した設定で測れませんでした。もう一度お試しください。";
  return "カメラを開けませんでした（"+name+"）。もう一度お試しください。";
}

async function pulseStart(){
  if(pRunning) return;
  pulseResult=null; pulseCheck=null; pulseSaved=false; pulseErr="";
  pSamples=[]; pT0=0; pLiveBpm=null; pGuideKey=""; pGuideAt=0; pTickN=0; pLastSettings="";
  pulseEnv={};

  if(!(typeof navigator!=="undefined" && navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){
    pulseErr="この端末ではカメラを使えません。https:// で開いているかご確認ください。";
    pulseStage="home"; render(); return;
  }

  /* ここが肝心。カメラを頼む前に画面を描き直さない。
     iPhoneのホーム画面アプリ（PWA）では「ボタンを押した直後」でないと
     許可の確認が出ず、そのまま NotAllowedError になってしまう。
     そのため getUserMedia を最初に呼び、映像が取れてから測定画面へ移る。 */
  const gen=++pGen;
  let stream;
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{ facingMode:{ideal:"environment"}, width:{ideal:640}, height:{ideal:480}, frameRate:{ideal:30,max:30} },
    });
  }catch(e){
    if(gen!==pGen) return;                 // もう中止されている。エラーも出さない
    pulseFail(pulseCamError(e));
    return;
  }

  /* 許可を待っている間に、中止を押されたか、別の画面へ移っていないか。
     移っていたら、届いた映像はその場で捨てる（点けっぱなしにしない）。 */
  if(gen!==pGen || view!=="pulse"){
    try{ stream.getTracks().forEach(t=>t.stop()); }catch(e){}
    return;
  }

  pStream=stream;
  pulseStage="measure"; render(); pulseMountVideo();
  pTrack=pStream.getVideoTracks()[0];
  if(pVideo){
    try{ pVideo.srcObject=pStream; await pVideo.play(); }catch(e){ /* 再生できなくても解析は続く */ }
  }
  pRunning=true;
  pT0=(typeof performance!=="undefined"&&performance.now)?performance.now():Date.now();

  /* ライトを点ける。点けられない端末・ブラウザでも測定は続ける
     （保存の可否は 測定品質・採用窓・fps だけで決める）。 */
  let torch=false;
  let caps={};
  try{ caps=pTrack.getCapabilities?(pTrack.getCapabilities()||{}):{}; }catch(e){ caps={}; }
  try{
    if("torch" in caps){ await pTrack.applyConstraints({advanced:[{torch:true}]}); torch=true; }
  }catch(e){ torch=false; }
  try{
    /* レンズの自動切り替え対策：ズームを最小（＝広角）に固定してみる */
    if("zoom" in caps && caps.zoom) await pTrack.applyConstraints({advanced:[{zoom:caps.zoom.min}]});
  }catch(e){ /* 指定できない端末もある。測定は続ける */ }

  const st=(pTrack.getSettings?pTrack.getSettings():{})||{};
  pLastSettings=`${st.width||"?"}x${st.height||"?"}@${Math.round(st.frameRate||0)}`;
  pulseEnv={ cam:`${st.width||"?"}×${st.height||"?"}`, torch:torch, device:pulseDeviceTag() };
  /* ライトが点かない端末では、明るい場所で測るよう最初に伝える */
  if(!torch) pulseSetText("pulse-hold","ライトが使えません。明るい場所で、指をレンズに当ててください");

  try{ if(navigator.wakeLock) pWake=await navigator.wakeLock.request("screen"); }catch(e){ /* 無くても測れる */ }

  /* 途中でレンズが切り替わっていないか見張る（解像度やfpsが変われば怪しい） */
  pWatch=setInterval(()=>{
    if(!pTrack) return;
    const s=(pTrack.getSettings?pTrack.getSettings():{})||{};
    const cur=`${s.width||"?"}x${s.height||"?"}@${Math.round(s.frameRate||0)}`;
    if(cur!==pLastSettings){ pLastSettings=cur; pulseFail("測定中にカメラのレンズが切り替わりました。もう一度測ってください。"); }
  },1000);

  pulseLoop();
  pTickId=setInterval(pulseTick,200);
}

function pulseLoop(){
  const v=pVideo;
  if(!v) return;
  const onFrame=()=>{
    if(!pRunning) return;
    pulseGrab(v);
    if(v.requestVideoFrameCallback) pRvfcId=v.requestVideoFrameCallback(onFrame);
    else pRafId=requestAnimationFrame(onFrame);
  };
  if(v.requestVideoFrameCallback) pRvfcId=v.requestVideoFrameCallback(onFrame);
  else if(typeof requestAnimationFrame==="function") pRafId=requestAnimationFrame(onFrame);
}

/* 1コマぶんの平均色を取る。画像そのものは残さない（読み終えたら捨てる）。 */
function pulseGrab(v){
  const ctx=pulseCanvasCtx();
  if(!ctx || !v.videoWidth) return;
  const G=Core.PULSE_CFG.GRID;
  const side=Math.min(v.videoWidth,v.videoHeight);
  const sx=(v.videoWidth-side)/2, sy=(v.videoHeight-side)/2;
  ctx.drawImage(v,sx,sy,side,side,0,0,G,G);
  const d=ctx.getImageData(0,0,G,G).data;
  const n=G*G;
  let r=0,g=0,b=0;
  const lum=new Float32Array(n);
  for(let i=0,p=0;i<n;i++,p+=4){
    r+=d[p]; g+=d[p+1]; b+=d[p+2];
    lum[i]=0.299*d[p]+0.587*d[p+1]+0.114*d[p+2];
  }
  r/=n; g/=n; b/=n;
  let m=0; for(let i=0;i<n;i++) m+=lum[i]; m/=n;
  let sd=0; for(let i=0;i<n;i++) sd+=(lum[i]-m)*(lum[i]-m);
  sd=Math.sqrt(sd/n);
  const now=(typeof performance!=="undefined"&&performance.now)?performance.now():Date.now();
  pSamples.push({ t:now-pT0, r:r, g:g, b:b, bright:(r+g+b)/3, sd:sd, redRatio:r/((g+b)/2+1) });
}

/* 200msごとの画面更新と、途中中止の判定 */
function pulseTick(){
  if(!pRunning) return;
  const C=Core.PULSE_CFG;
  const now=(typeof performance!=="undefined"&&performance.now)?performance.now():Date.now();
  const el=(now-pT0)/1000;
  const prep=el<C.PREP_SEC;
  pTickN++;

  pulseSetText("pulse-cnt", String(Math.max(0,Math.ceil(C.TOTAL_SEC-el))));
  const bar=$("pulse-bar");
  if(bar){
    if(bar.style) bar.style.width=Math.max(0,Math.min(100,(el/C.TOTAL_SEC)*100)).toFixed(1)+"%";
    if(bar.className!==undefined) bar.className=prep?"prep":"";
  }
  pulseSetText("pulse-phase", prep?"信号を確認中":"測定中");
  pulseSetText("pulse-hold","指を動かさないでください");

  /* 直近3秒の様子 */
  const recent=pSamples.filter(s=>s.t>(el-3)*1000);
  const okRate=recent.length ? recent.filter(Core.pulseFrameOk).length/recent.length : 0;
  const bright=recent.length ? recent.reduce((a,s)=>a+s.bright,0)/recent.length : 0;
  const fps=recent.length/3;
  pulseSetText("pulse-fps", fps.toFixed(0)+"fps");

  pulseGuide(recent, bright, okRate, prep);
  pulseDrawWave(el);
  if(!prep && pTickN%5===0) pulseLiveBpm();

  /* 準備時間が終わっても指が当たっていないなら、そこで打ち切る */
  if(!prep && recent.length>10){
    if(okRate<0.4){
      pulseFail(bright<C.minBright
        ? "暗すぎます。ライトが指で隠れているかご確認のうえ、もう一度測ってください。"
        : "指が外れているようです。レンズを指の腹でふさいで、もう一度測ってください。");
      return;
    }
    if(fps<C.minFps){ pulseFail("コマ数が足りません（"+fps.toFixed(0)+"fps）。ほかのアプリを閉じて、もう一度測ってください。"); return; }
  }
  if(el>=C.TOTAL_SEC) pulseFinish();
}

/* いまの心拍数（表示だけ。確定の計算には使わない） */
function pulseLiveBpm(){
  const C=Core.PULSE_CFG;
  const seg=pSamples.filter(s=>s.t>=C.PREP_SEC*1000);
  if(seg.length<C.WIN_SEC*10) return;
  const tail=seg.slice(-Math.round(C.WIN_SEC*40));
  const sig=Core.pulseResample(tail.map(s=>s.t), tail.map(s=>s.g), C.FS);
  if(!sig||sig.length<C.FS*4) return;
  const r=Core.pulseAutocorrBpm(Core.pulseBandpass(sig,C.FS), C.FS);
  if(r.bpm && r.q>=C.minQuality){ pLiveBpm=Math.round(r.bpm); pulseSetText("pulse-bpm", String(pLiveBpm)); }
}

/* リアルタイムの案内。表示だけの機能で、計算には一切関与しない。 */
function pulseGuide(recent, bright, okRate, prep){
  const C=Core.PULSE_CFG;
  /* 直近の波の振幅を明るさで割った値（脈の出やすさの目安） */
  let acdc=0;
  if(recent.length>=10){
    const v=recent.map(s=>s.g);
    const mean=v.reduce((a,b)=>a+b,0)/v.length;
    if(mean>0){
      const k=Math.max(3,Math.round(v.length/8));
      let sq=0;
      for(let i=0;i<v.length;i++){
        let s=0,c=0;
        for(let j=Math.max(0,i-k);j<=Math.min(v.length-1,i+k);j++){ s+=v[j]; c++; }
        const d=v[i]-s/c; sq+=d*d;
      }
      acdc=(Math.sqrt(sq/v.length)*2)/mean;
    }
  }
  const sd=recent.length ? recent.reduce((a,s)=>a+s.sd,0)/recent.length : 0;
  const red=recent.length ? recent.reduce((a,s)=>a+s.redRatio,0)/recent.length : 0;

  const q=Math.max(0,Math.min(100,(acdc/(C.minAcDc*3))*100));
  const qf=$("pulse-qf");
  if(qf){ if(qf.style) qf.style.width=q.toFixed(0)+"%"; if(qf.className!==undefined) qf.className=q>=60?"":(q>=30?"low":"bad"); }
  pulseSetText("pulse-qv", recent.length<10 ? "—" : q.toFixed(0)+"%");

  let key,icon,text,cls;
  if(recent.length<8)                    { key="wait";  icon="🔎"; text=L("信号を確認しています","Checking the signal"); cls=""; }
  else if(bright<20)                     { key="dark";  icon="💡"; text=L("暗すぎます。ライトが指で隠れているか確かめてください","Too dark — check that your finger is covering the light"); cls="bad"; }
  else if(red<C.minRedRatio||bright>235) { key="off";   icon="👆"; text=L("レンズを完全に覆ってください","Cover the lens completely"); cls="bad"; }
  else if(sd>30)                         { key="move";  icon="✋"; text=L("指が動いています。そのまま止めてください","Your finger is moving — hold it still"); cls="warn"; }
  else if(acdc<0.0008)                   { key="tight"; icon="🤏"; text=L("指の力を少し緩めてください","Press a little more gently"); cls="warn"; }
  else if(okRate<0.8||acdc<C.minAcDc)    { key="weak";  icon="〰️"; text=L("信号が弱めです。指の位置を少しずらしてください","The signal is weak — shift your finger slightly"); cls="warn"; }
  else                                   { key="good";  icon="✅"; text=prep?L("良好です。このまま保ってください","Looking good — hold it there"):L("測定良好","Reading well"); cls=""; }

  const now=(typeof performance!=="undefined"&&performance.now)?performance.now():Date.now();
  if(key!==pGuideKey && now-pGuideAt>=1500){
    pGuideKey=key; pGuideAt=now;
    pulseSetText("pulse-gi",icon); pulseSetText("pulse-gt",text);
    const g=$("pulse-guide"); if(g && g.className!==undefined) g.className="pguide "+cls;
  }else if(key===pGuideKey){
    pulseSetText("pulse-gt",text);
  }
}

function pulseDrawWave(el){
  const c=$("pulse-wave");
  if(!c || typeof c.getContext!=="function") return;
  let g; try{ g=c.getContext("2d"); }catch(e){ return; }
  if(!g) return;
  const W=c.width, H=c.height;
  g.clearRect(0,0,W,H);
  const seg=pSamples.filter(s=>s.t>(el-6)*1000);
  if(seg.length<8) return;
  const vals=seg.map(s=>s.g);
  const mean=vals.reduce((a,b)=>a+b,0)/vals.length;
  const dev=vals.map(v=>v-mean);
  const amp=Math.max(0.4,Math.max(...dev.map(Math.abs)));
  g.beginPath();
  dev.forEach((v,i)=>{
    const x=(i/(dev.length-1))*W;
    const y=H/2-(v/amp)*(H/2-10);
    i?g.lineTo(x,y):g.moveTo(x,y);
  });
  g.strokeStyle="#e2739a"; g.lineWidth=3; g.lineJoin="round"; g.lineCap="round"; g.stroke();
}

/* ---------- 停止（測定終了・中止・画面移動のすべてでここを通す） ---------- */
function pulseStopAll(){
  pGen++;              // 許可を待っている最中の測定も、ここで無効にする
  pStopGen=pGen;
  pRunning=false;
  if(pTickId){ clearInterval(pTickId); pTickId=null; }
  if(pWatch){ clearInterval(pWatch); pWatch=null; }
  if(pRafId && typeof cancelAnimationFrame==="function"){ cancelAnimationFrame(pRafId); }
  pRafId=null;
  if(pRvfcId && pVideo && pVideo.cancelVideoFrameCallback){ try{ pVideo.cancelVideoFrameCallback(pRvfcId); }catch(e){} }
  pRvfcId=null;
  if(pTrack){ try{ pTrack.applyConstraints({advanced:[{torch:false}]}); }catch(e){} }   // ライトを必ず消す
  if(pStream){ try{ pStream.getTracks().forEach(t=>t.stop()); }catch(e){} pStream=null; }
  pTrack=null;
  if(pVideo){ try{ pVideo.pause(); pVideo.srcObject=null; }catch(e){} }
  pVideo=null;
  if(pWake){ try{ pWake.release(); }catch(e){} pWake=null; }
}

/* 測定できなかったとき。理由を残して最初の画面へ戻す。 */
function pulseFail(reason){
  pulseStopAll();
  pulseResult=null; pulseCheck=null; pulseSaved=false;
  pulseErr=reason;
  pulseStage="home";
  render();
}

/* 60秒たった。解析して、条件を満たしていれば記録する。 */
function pulseFinish(){
  const raw=pSamples.slice();
  pulseStopAll();
  pSamples=[];
  const r=Core.analyzePulse(raw);
  const chk=Core.pulseSaveCheck(r);
  pulseResult=r; pulseCheck=chk; pulseSaved=false; pulseErr="";
  pulseStage="home";
  if(chk.ok){
    if(pulseSaveRecord(r)) pulseSaved=true;
    else pulseCheck={ ok:false, msg:L("記録を保存できませんでした（端末の空き容量をご確認ください）","Could not save the measurement — please check your free space"), detail:"" };
  }
  render();
  if(pulseSaved) toast(L(`心拍数 ${r.bpm}bpm を記録しました ✓`, `Heart rate ${r.bpm} bpm saved ✓`));
}

/* 保存に失敗したら、記録する前の状態へ完全に戻す。 */
function pulseSaveRecord(r){
  const now=new Date();
  const rec=Core.normalizePulseEntry({
    id:uid(),
    date:todayISO(now),
    time:`${pad(now.getHours())}:${pad(now.getMinutes())}`,
    ts:pulseStamp(now),
    bpm:r.bpm, stars:r.stars, quality:r.quality,
    kept:r.kept, wins:r.wins, spread:r.spread, fps:r.fps,
    cond:pulseCond,
    device:pulseEnv.device||pulseDeviceTag(),
    cam:pulseEnv.cam||"",
    torch:!!pulseEnv.torch,
  });
  if(!rec) return false;
  const before=state.pulse;
  state.pulse=Core.normalizePulseList([...(state.pulse||[]), rec]);
  if(!save()){ state.pulse=before; return false; }
  return true;
}

/* ---------- 履歴の編集・削除・書き出し ---------- */
function pulseDelete(id){
  const list=state.pulse||[];
  const r=list.find(x=>x.id===id);
  if(!r) return;
  if(typeof confirm==="function" && !confirm(L(`この測定を削除しますか？\n${pulseWhen(r)}　${r.bpm}bpm`, `Delete this measurement?\n${pulseWhen(r)} · ${r.bpm} bpm`))) return;
  const before=list;
  state.pulse=list.filter(x=>x.id!==id);
  if(!save()){ state.pulse=before; toast(L("削除できませんでした","Could not delete it")); return; }
  pulseOpenId=null; pulseEditId=null;
  render(); toast(L("削除しました ✓","Deleted ✓"));
}

function pulseEditSave(id){
  const list=state.pulse||[];
  const idx=list.findIndex(x=>x.id===id);
  if(idx<0) return;
  const bEl=$("pe-bpm"), cEl=$("pe-cond");
  const merged=Object.assign({}, list[idx], {
    bpm:bEl?bEl.value:list[idx].bpm,
    cond:cEl?cEl.value:list[idx].cond,
  });
  const rec=Core.normalizePulseEntry(merged);
  if(!rec){ toast(L(`心拍数は ${Core.PULSE_SAVE.bpmMin}〜${Core.PULSE_SAVE.bpmMax}bpm で入れてください`, `Heart rate must be between ${Core.PULSE_SAVE.bpmMin} and ${Core.PULSE_SAVE.bpmMax} bpm`)); return; }
  rec.id=id;
  const before=list;
  const next=list.slice(); next[idx]=rec;
  state.pulse=Core.normalizePulseList(next);
  if(!save()){ state.pulse=before; toast(L("直せませんでした","Could not save the change")); return; }
  pulseEditId=null;
  render(); toast(L("直しました ✓","Updated ✓"));
}

/* 測った心拍数を、健康記録（体重・血圧と同じ入れ物）へ入れる。
   電卓の「答えを家計簿に記録する」と同じ考え方で、
   測定の履歴とは別に、いつもの健康記録として1日1件で残す。
   保存に失敗したら、入れる前の状態へ完全に戻す。 */
function pulseToHealth(bpm){
  const b=Math.round(Number(bpm));
  if(!Number.isFinite(b)){ toast(L("心拍数を読み取れませんでした","Could not read the heart rate")); return; }
  const today=todayISO();
  const cur=state.health[today]||{};
  const entry=Core.normalizeHealthEntry(Object.assign({}, cur, {pulse:b}));
  if(!entry){ toast(L("健康記録に入れられませんでした","Could not add it to the health record")); return; }
  const before=JSON.parse(JSON.stringify(state.health));
  state.health=Object.assign({}, state.health); state.health[today]=entry;
  if(!save()){
    state.health=before;     // 入れる前へ完全に戻す
    toast(L("記録を保存できませんでした","Could not save the entry"));
    return;
  }
  render(); toast(L(`心拍数 ${b}bpm を健康記録に入れました ✓`, `Heart rate ${b} bpm added to your health record ✓`));
}

function pulseExportCsv(){
  const list=state.pulse||[];
  if(!list.length){ toast(L("書き出す測定がありません","There are no measurements to export")); return; }
  saveFile(`kakeibo-pulse-${todayISO()}.csv`, "\ufeff"+Core.pulseCsv(list), "text/csv",
    L("CSVを書き出しました","CSV exported"));
}

/* =========================================================================
   横スワイプで画面を切り替える
   -------------------------------------------------------------------------
   下のタブと同じ並びを、指で左右に払って移動できるようにする。
   ・縦スクロールと取り違えないよう、横の動きが縦よりはっきり大きいときだけ
   ・記録シートを開いている間と、心拍を測っている間は切り替えない
   ・入力欄や波形の上から始めた指の動きは、切り替えに使わない
   どこへ移るかは core.js の swipeNextView() が決める。
   ========================================================================= */
const SWIPE_MIN_X = 60;    // これ以上、横に動いたら切り替える（px）
const SWIPE_MAX_MS = 700;  // ゆっくりした動きは、なぞり操作とみなして切り替えない
let swipeX = 0, swipeY = 0, swipeAt = 0, swipeLive = false;

/* 切り替えてよい場面か。だめな理由があるうちは触らない。 */
function swipeBlocked(el){
  if(sheetState) return true;                       // 記録シートを開いている
  if(pRunning) return true;                         // 心拍を測っている最中
  if(el && typeof el.closest==="function" && el.closest("input,textarea,select,canvas,.sheet,#scrim")) return true;
  return false;
}

/* 指の動きから、移る先を決める（移らないなら null）。 */
function swipeDecide(dx, dy, ms, fromView){
  if(ms > SWIPE_MAX_MS) return null;
  if(Math.abs(dx) < SWIPE_MIN_X) return null;
  if(Math.abs(dx) < Math.abs(dy) * 1.5) return null;   // 縦スクロールと取り違えない
  return Core.swipeNextView(fromView, dx);
}

document.addEventListener("touchstart",(e)=>{
  swipeLive=false;
  if(!e.touches || e.touches.length!==1) return;      // つまむ操作は対象外
  if(swipeBlocked(e.target)) return;
  swipeX=e.touches[0].clientX; swipeY=e.touches[0].clientY;
  swipeAt=Date.now(); swipeLive=true;
},{passive:true});

document.addEventListener("touchmove",(e)=>{
  if(swipeLive && e.touches && e.touches.length>1) swipeLive=false;   // 途中で指が増えたらやめる
},{passive:true});

document.addEventListener("touchend",(e)=>{
  if(!swipeLive) return;
  swipeLive=false;
  const t = e.changedTouches && e.changedTouches[0];
  if(!t) return;
  const next = swipeDecide(t.clientX-swipeX, t.clientY-swipeY, Date.now()-swipeAt, view);
  if(!next) return;
  showSheet(false);
  view=next; render();
},{passive:true});

/* =========================================================================
   ライフプランへ渡す資産（金・銀行貯金・借入金・民間年金）
   -------------------------------------------------------------------------
   ・入力口はここだけ。家計簿のほかの画面には同じ欄を作らない。
   ・毎月の記録（収入・支出）とは完全に別。使えるお金の計算には入れない。
     借入の返済も、実際に払った月に「記録」から入れる。ここの毎月返済額は
     ライフプランが将来を見通すための予定額で、今月の家計には足さない。
   ・数の決め方と形は core.js（normalizeLifePlanAssets）が唯一の正。
   ========================================================================= */
const LP_KINDS = ["nisa", "ideco", "gold", "banks", "loans", "insurance", "pension"];
let lpKind = "gold";     // 内訳画面で開いている種類

/* いまの設定にある資産（未入力なら空の形） */
/* ライフプラン欄の編集は、打ち込む側の数＝**主単位**でやりとりする。
   内部（最小単位）との行き来を、読み(lpAssets)と書き(lpSave)の2か所だけに閉じる。
   ここを画面のあちこちでやると、必ずどこかで掛け忘れ・掛けすぎが出る。 */
function lpAssets(){
  const major = Core.settingsToMajor(state.settings);
  return Core.normalizeLifePlanAssets(major.lp);
}

/* 「この内容で保存する」で呼ぶ保存。名前も金額も入っていない行はここで捨てる。
   「＋ 足す」で作った直後の空行まで消してしまわないよう、
   静かな保存（lpSave）では捨てない。使い分けはここだけの決めごと。 */
function lpSaveTidy(next){ return lpSave(Core.lpDropEmptyRows(next)); }

/* 設定に戻さず、その場で保存する。失敗したら完全に元へ戻す。 */
function lpSave(next){
  const before = JSON.parse(JSON.stringify(state.settings));
  /* 行のしるし（id）を、まだ無い行にだけ付ける。
     これが無いとライフプラン側が名前で照合するしかなく、
     名前が空・同名だと、渡すたびに同じ行が増えてしまう。 */
  /* 打ち込まれた主単位を、ここで内部の最小単位へ直す。 */
  const merged = Core.settingsToMinor(
    Object.assign({}, Core.settingsToMajor(state.settings), { lp: Core.lpEnsureIds(next) }));
  state.settings = Core.normalizeSettings(merged);
  if(!save()){
    state.settings = before;
    toast(L("保存できませんでした","Could not save"));
    return false;
  }
  return true;
}

/* NISAの行に出す短い説明。
   「いま0円なのはなぜか」「いつから幾らになるか」は、
   廃止した先取りの欄に出していた案内。内訳が唯一の入力口になったので、
   この一覧の行へ移した。 */
function nisaNote(s, on){
  if(!Core.nisaAuto(s)) return L("生年月日と区間を入れると自動計算",
    "Enter your date of birth and the age ranges to calculate this automatically");
  const now = Core.nisaPlannedOn(s, on);
  if(now > 0) return L(`いまは ${ageLabel(s.birth)}。区間から自動で計算しています`,
    `You are ${ageLabel(s.birth)} — calculated automatically from the age ranges`);
  const next = Core.nisaUpcoming(s, on);
  if(next) return L(`まだ積立の期間に入っていません。${next.fromAge}歳から 月${yen(next.monthly)}`,
    `Contributions have not started yet — ${yen(next.monthly)} a month from age ${next.fromAge}`);
  return L(`いまは ${ageLabel(s.birth)}。積立の期間はすべて終わっています`,
    `You are ${ageLabel(s.birth)} — every contribution period has ended`);
}

/* ---------- 設定に出す一覧（合計と内訳ボタンだけ） ---------- */
function lpSummaryHtml(){
  const a = lpAssets();
  const row = (kind, icon, label, value, sub) => `<div class="lprow">
    <span class="lpi">${icon}</span>
    <span class="lpmid"><b>${label}</b><i>${escapeHtml(sub)}</i></span>
    <span class="lpv mono">${value}</span>
    <button class="lpbtn" data-act="lp-open" data-kind="${kind}">${L("内訳","Details")}</button>
  </div>`;
  /* 出す数字は、どの項目も「毎月いくら」でそろえる。
     残高（評価額・預金残高・借入の元金）は右の数字ではなく、名前の下の小さい字に出す。
     ここが残高だったため、毎月の金額を入れても画面が動かず
     「保存できていない」ように見えていた。 */
  const on = Core.cycleRange(curYM(), state.settings.cycleStart).from;
  const age = Core.ageFromBirth(state.settings.birth, on);
  const mon = (kind) => yen(Core.lpMonthlyOf(state.settings, kind, age))+T("home.perMonth");
  const cnt = (n) => L(`${n}件`, `${n} ${n===1?"item":"items"}`);
  return `<div class="stitle">${L("ライフプランへ渡すデータ","Data sent to the life plan")}</div>
  <div class="barlist">
    ${row("nisa","📈",T("lp.nisa"), yen(Core.nisaPlannedOn(state.settings, on))+T("home.perMonth"), nisaNote(state.settings, on))}
    ${row("gold","🪙",T("lp.gold"), mon("gold"), L(`いま ${a.gold.currentGrams||0}g・評価 ${yen(Core.lpGoldValue(a.gold))}`, `${a.gold.currentGrams||0}g held · worth ${yen(Core.lpGoldValue(a.gold))}`))}
    ${row("banks","🏦",T("lp.banks"), mon("banks"), L(`${a.banks.length}件・残高 ${yen(Core.lpBanksTotal(a.banks))}`, `${cnt(a.banks.length)} · balance ${yen(Core.lpBanksTotal(a.banks))}`))}
    ${row("loans","💳",T("lp.loans"), mon("loans"), L(`${a.loans.length}件・残り ${yen(Core.lpLoansTotal(a.loans))}`, `${cnt(a.loans.length)} · ${yen(Core.lpLoansTotal(a.loans))} remaining`))}
    ${row("ideco","🏛",T("lp.ideco"), mon("ideco"), a.ideco.productName||L("毎月の掛金は先取り","Monthly contribution is set aside"))}
    ${row("insurance","🛟",T("lp.insurance"), mon("insurance"), cnt(a.insurancePolicies.length))}
    ${row("pension","📜",T("lp.pension"), mon("pension"), cnt(a.privatePensionPlans.length))}
    <button class="btn-ghost" data-act="lp-export" style="margin-top:10px">${L("📤 ライフプランへ渡す","📤 Send to the life plan")}</button>
  </div>`;
}

/* ---------- 内訳の画面 ---------- */
const LP_ICONS = { nisa:"📈", ideco:"🏛", gold:"🪙", banks:"🏦", loans:"💳", insurance:"🛟", pension:"📜" };
/* 見出しは「絵文字＋その国のことば」。名前そのものは core.js の表から取る。 */
function lpTitle(kind){ return LP_ICONS[kind] + " " + T("lp."+kind); }

function renderLp(){
  const a = lpAssets();
  const tabs = LP_KINDS.map(k=>`<button data-act="lp-tab" data-kind="${k}" class="rgbtn${lpKind===k?" on":""}">${T("lp."+k)}</button>`).join("");
  const body = lpKind==="nisa" ? lpNisaHtml(a)
    : lpKind==="ideco" ? lpIdecoHtml(a.ideco)
    : lpKind==="insurance" ? lpInsuranceHtml(a.insurancePolicies)
    : lpKind==="gold" ? lpGoldHtml(a.gold)
    : lpKind==="banks" ? lpBanksHtml(a.banks)
    : lpKind==="loans" ? lpLoansHtml(a.loans)
    : lpPensionHtml(a.privatePensionPlans);
  return `<div class="screen">
    <div class="stitle" style="margin-top:6px">${lpTitle(lpKind)}</div>
    <div class="rangebar" style="display:flex;gap:6px;margin:0 0 12px">${tabs}</div>
    ${body}
    <button class="btn-quiet" data-act="lp-back" style="margin-top:14px">${L("← せっていへ戻る","← Back to settings")}</button>
  </div>`;
}

/* NISA積立の内訳。
   つみたて枠・成長投資枠それぞれの「年齢区間ごとの月額」と「銘柄別の内訳」。
   月額を打てる場所はここだけ。せっていの欄は、ここから自動計算した表示になる。 */
function nisaHeadHtml(s){
  if(!s.birth) return L("せってい","Settings")+L("で<b>生年月日</b>を入れると、いまの年齢からこの月額を自動で計算します。","：enter your <b>date of birth</b> and this monthly amount is worked out from your current age.");
  const from=Core.cycleRange(curYM(),s.cycleStart).from;
  const now=Core.nisaPlannedOn(s,from);
  const next=Core.nisaUpcoming(s,from);
  return L(`いま <b>${escapeHtml(ageLabel(s.birth))}</b>。今月の先取りは <b>${yen(now)}</b> です。`,
           `You are <b>${escapeHtml(ageLabel(s.birth))}</b>. This month you set aside <b>${yen(now)}</b>.`)
    +(next?L(`<br>${escapeHtml(mdLabel(next.startDate))}（${escapeHtml(ageValueLabel(next.fromAge))}）から 月${yen(next.monthly)} になります。`,
             `<br>From ${escapeHtml(mdLabel(next.startDate))}, ${escapeHtml(ageValueLabel(next.fromAge))}, it becomes ${yen(next.monthly)} a month.`):"");
}

function lpNisaHtml(a){
  const s = state.settings;
  /* 区間ひとつぶん。月額は銘柄の合計なので、打つのは銘柄名と金額だけ。 */
  const seg = (key, id, rows) => rows.map((r,i)=>{
    const sum = (r.funds||[]).reduce((t,f)=>t+(f.amount||0),0);
    const funds = (r.funds||[]).map((f,n)=>`<div class="lpgrid" style="margin-bottom:6px">
        <label>${L("銘柄名","Fund name")}<input id="${id}-fn-${i}-${n}" value="${escapeAttr(f.name)}" placeholder="${L("全世界株式","Global equity index")}"></label>
        <label>${L("毎月の金額（円）","Monthly amount")}<div style="display:flex;gap:6px">
          <input class="mono" id="${id}-fa-${i}-${n}" inputmode="${moneyInputMode()}" value="${f.amount||""}" placeholder="0">
          <button class="lpdel" data-act="lp-del-fund" data-key="${key}" data-i="${i}" data-n="${n}">🗑</button></div></label>
      </div>`).join("");
    return `<div class="lpseg">
      <div class="lpseg-h"><b data-liveage="${key}-${i}">${ageRangeLabel(r.fromAge||0, r.toAge||0)}</b>
        <button class="lpdel" data-act="lp-del" data-i="${i}" data-key="${key}">${L("🗑 区間ごと","🗑 Whole range")}</button></div>
      <div class="lpgrid">
        ${ageInputHtml(`${id}-from-${i}`,L("開始年齢","Start age"),r.fromAge,"57")}
        ${ageInputHtml(`${id}-to-${i}`,L("終了年齢","End age"),r.toAge,"65")}
      </div>
      <div class="lptotal" style="margin:8px 0 4px">${L("この区間の月額","Monthly total for this range")} <b class="mono" data-live="${key}-${i}">${yen(sum)}</b></div>
      ${funds || `<div class="fhelp" style="margin-bottom:6px">${L("銘柄を足すと、その合計が月額になります","Add funds and their total becomes the monthly amount")}</div>`}
      <button class="btn-quiet" data-act="lp-add-fund" data-key="${key}" data-i="${i}">${L("＋ 銘柄を足す","＋ Add a fund")}</button>
    </div>`;
  }).join("");

  const box = (title, key, id, rows) => `<div class="stitle" style="margin-top:4px">${title}</div>
    <div class="barlist">
      ${seg(key,id,rows) || `<div class="empty"><span class="e">📈</span>${L("まだ入っていません","Nothing here yet")}</div>`}
      <button class="btn-quiet" data-act="lp-add" data-key="${key}">${L("＋ 区間を足す","＋ Add an age range")}</button>
    </div>`;

  const lumps = a.lumpSums.map((l,i)=>`<div class="lpgrid" style="margin-bottom:8px">
      ${ageInputHtml(`lp-lm-age-${i}`,L("何歳のとき","At what age"),l.age,"59")}
      <label>${L("金額（円）","Amount")}<div style="display:flex;gap:6px">
        <input class="mono" id="lp-lm-amt-${i}" inputmode="${moneyInputMode()}" value="${l.amount||""}" placeholder="0">
        <button class="lpdel" data-act="lp-del" data-i="${i}" data-key="lumpSums">🗑</button></div></label>
    </div>`).join("");

  const head = `<div class="calcnote" data-live="nisa-head" style="margin:0 0 10px">${nisaHeadHtml(s)}</div>`;

  return `${head}
    ${box(L("つみたて投資枠（積立）","Regular contributions"),"tsumitateSchedule","lp-ts",a.tsumitateSchedule)}
    ${box(L("成長投資枠（積立）","Growth allowance contributions"),"growthSchedule","lp-gs",a.growthSchedule)}
    <div class="stitle" style="margin-top:4px">${L("一括投資（ライフプランへ渡すだけ）","Lump-sum investing — sent to the life plan only")}</div>
    <div class="barlist">
      <div class="fhelp" style="margin-bottom:8px">${L("まとまったお金なので、<b>かけいぼの毎月の計算には入りません</b>。ライフプランへ渡すためだけの欄です。","This is a one-off amount, so it is <b>never part of the monthly budget</b>. It is only passed on to the life plan.")}</div>
      ${lumps || `<div class="empty"><span class="e">💵</span>${L("まだ入っていません","Nothing here yet")}</div>`}
      <button class="btn-quiet" data-act="lp-add" data-key="lumpSums">${L("＋ 一括投資を足す","＋ Add a lump sum")}</button>
    </div>
    <button class="btn-main" data-act="lp-save-nisa" style="margin-top:4px">${L("この内容で保存する","Save these details")}</button>`;
}

/* ---------- 画面の値を読んで保存する ---------- */
const lpVal = (id) => { const el=$(id); return el?el.value:""; };

function lpReadGold(){
  const a = lpAssets();
  a.gold = { currentGrams: lpVal("lp-g-grams"), pricePerGram: lpVal("lp-g-price"), monthlyYen: lpVal("lp-g-monthly") };
  return a;
}
function lpSaveGold(){ if(lpSaveTidy(lpReadGold())){ render(); toast(T("set.saved")); } }
function lpSaveBanks(){
  const a = lpAssets();
  a.banks = a.banks.map((b,i)=>({
    name: lpVal(`lp-b-name-${i}`), balance: lpVal(`lp-b-bal-${i}`),
    monthlyDeposit: lpVal(`lp-b-mon-${i}`), interestPct: lpVal(`lp-b-int-${i}`), id: b.id,
  }));
  if(lpSaveTidy(a)){ render(); toast(T("set.saved")); }
}
function lpSaveLoans(){
  const a = lpAssets();
  a.loans = a.loans.map((l,i)=>({
    name: lpVal(`lp-l-name-${i}`), principal: lpVal(`lp-l-pri-${i}`),
    annualRatePct: lpVal(`lp-l-rate-${i}`), monthlyPayment: lpVal(`lp-l-pay-${i}`), id: l.id,
  }));
  if(lpSaveTidy(a)){ render(); toast(T("set.saved")); }
}
function lpSavePension(){
  const a = lpAssets();
  a.privatePensionPlans = a.privatePensionPlans.map((p,i)=>({
    name: lpVal(`lp-p-name-${i}`), monthlyContribution: lpVal(`lp-p-mon-${i}`),

/* NISAの4つの表を、画面の値から作り直す */
function lpReadNisa(){
  const a = lpAssets();
  /* 行のしるし（id）は必ず持ち回る。落とすと保存のたびに新しい id が付き、
     ライフプラン側で別の行と見なされて同じものが増える。 */
  const sched = (id, rows) => rows.map((r,i)=>({
    fromAge: ageValueFromFields(`${id}-from-${i}`,`${id}-from-${i}-month`), toAge: ageValueFromFields(`${id}-to-${i}`,`${id}-to-${i}-month`),
    funds: (r.funds||[]).map((_,n)=>({ name: lpVal(`${id}-fn-${i}-${n}`), amount: lpVal(`${id}-fa-${i}-${n}`) })),
    id: r.id,
  }));
  a.tsumitateSchedule = sched("lp-ts", a.tsumitateSchedule);
  a.growthSchedule = sched("lp-gs", a.growthSchedule);
  a.lumpSums = a.lumpSums.map((r,i)=>({ age: ageValueFromFields(`lp-lm-age-${i}`,`lp-lm-age-${i}-month`), amount: lpVal(`lp-lm-amt-${i}`), id: r.id }));
  return a;
}
/* 区間の中に銘柄を1行足す／消す */
function lpAddFund(key, i){
  const a = lpReadNisa();
  const row = a[key] && a[key][Number(i)];
  if(!row) return;
  if((row.funds||[]).length >= Core.LP_MAX_ROWS){ toast(L(`${Core.LP_MAX_ROWS}件までです`, `Up to ${Core.LP_MAX_ROWS} items`)); return; }
  row.funds = (row.funds||[]).concat([{ name:"", amount:"" }]);
  const n = row.funds.length - 1;
  if(lpSave(a)){ render(); focusField(`${key==="tsumitateSchedule"?"lp-ts":"lp-gs"}-fn-${i}-${n}`); }
}
function lpDeleteFund(key, i, n){
  const a = lpReadNisa();
  const row = a[key] && a[key][Number(i)];
  if(!row || !row.funds || !row.funds[Number(n)]) return;
  if(typeof confirm==="function" && !confirm(L("この銘柄を消しますか？","Delete this fund?"))) return;
  row.funds = row.funds.filter((_,x)=>x!==Number(n));
  if(lpSave(a)){ render(); toast(L("消しました ✓","Deleted ✓")); }
}
function lpSaveNisa(){ if(lpSaveTidy(lpReadNisa())){ render(); toast(T("set.saved")); } }

function lpReadInsurance(){
